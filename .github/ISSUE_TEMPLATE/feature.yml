name: Product change
about: Propose a bounded product or engineering change
title: "[CHANGE] "
labels: ["triage"]
body:
  - type: textarea
    id: human-action
    attributes:
      label: Human action or decision
      description: What must a person understand, decide or complete?
    validations:
      required: true
  - type: textarea
    id: current-chain
    attributes:
      label: Current derivation chain
      description: Which inputs, producer, outcome, limits and receipt are involved?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected bounded outcome
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals and forbidden claims
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and DoD
    validations:
      required: true
