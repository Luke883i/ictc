name: ictc-s4-a0-observability
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-s4-a0-observability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  observability-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: S4-A0 source/runtime identity contract
        run: node v3/s4-a0-observability-check.mjs
      - name: S4-A0 identity saturation
        run: node v3/s4-a0-observability-saturation.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: ictc-s4-a0-contract
          path: artifacts/s4-a0-observability-*.json
          if-no-files-found: error
          retention-days: 30

  observability-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Browser probe syntax
        run: python -m py_compile v3/browser-s4-a0-observability.py
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          if [[ -z "$browser" || ! -x "$browser" ]]; then echo 'No supported system Chromium browser found on the runner' >&2; exit 1; fi
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Exact-head S4-A0 browser baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONUNBUFFERED=1 ICTC_NO_OPEN=1 ICTC_PORT=4827 PORT=4827
          export ICTC_BASE_URL="http://127.0.0.1:4827"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-s4-a0-state"
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-s4-a0-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          export ICTC_EXPECT_BUILD_SHA="$GITHUB_SHA"
          ./ictc.sh start --profile current --no-open
          trap './ictc.sh stop --profile current || true' EXIT
          ./ictc.sh status --profile current
          status=0
          python -u v3/browser-s4-a0-observability.py || status=$?
          cp "$ICTC_STATE_DIR/logs/ictc.log" artifacts/s4-a0-server.log || true
          if [[ "$status" -ne 0 ]]; then
            FAILED_BROWSER_SCRIPT='v3/browser-s4-a0-observability.py' node scripts/browser-failure-provenance.mjs || true
            exit "$status"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: ictc-s4-a0-browser-evidence
          path: artifacts/s4-a0-*
          if-no-files-found: error
          retention-days: 30
