name: uiux-semantic-audit
on:
  push:
    branches:
      - agent/uiux-ontology-audit-20260920
    paths-ignore:
      - audit/uiux-ontology-20260920/**
permissions:
  contents: write
concurrency:
  group: uiux-semantic-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0 pillow==11.3.0
      - name: Resolve system Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          test -n "$browser"
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Start current runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4867 PORT=4867
          export ICTC_BASE_URL="http://127.0.0.1:4867"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-uiux-semantic-state"
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-uiux-semantic-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          ./ictc.sh status --profile current
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
          echo "ICTC_STATE_DIR=$ICTC_STATE_DIR" >> "$GITHUB_ENV"
          echo "ICTC_RUNTIME_DIR=$ICTC_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Render P4 exact branch
        run: python -u v3/browser-uiux-beauty-p4.py
      - name: Semantic observation
        run: python -u v3/browser-uiux-semantic-audit.py
      - name: Commit evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "ictc-uiux-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add audit/uiux-ontology-20260920
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: rendered UIUX ontology evidence [skip ci]"
          git push origin HEAD:agent/uiux-ontology-audit-20260920
      - name: Stop runtime
        if: always()
        run: ./ictc.sh stop --profile current || true
