name: ICTC PR274 synchronize truthful migration scope
on:
  push:
    branches:
      - ci/ictc-pr274-transport-20261109
    paths:
      - 'transport/PR274_BODY.md'
      - '.github/workflows/ictc-pr274-transport.yml'
permissions:
  contents: read
  pull-requests: write
jobs:
  update-pr-body:
    if: github.repository == 'Luke883i/ictc' && github.ref == 'refs/heads/ci/ictc-pr274-transport-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify #274 identity and update body without changing source branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected='0d0ca7a64b0b66f59ade2175aadec41d3a19b13e'
          observed="$(gh api repos/Luke883i/ictc/pulls/274 --jq '.head.sha')"
          if [[ "$observed" != "$expected" ]]; then
            echo "STOP: PR274 head changed: $observed"
            exit 2
          fi
          jq -n --rawfile body transport/PR274_BODY.md '{body: $body}' > "$RUNNER_TEMP/pr274-patch.json"
          gh api -X PATCH repos/Luke883i/ictc/pulls/274 --input "$RUNNER_TEMP/pr274-patch.json" --jq '{number, updated_at, title}'
