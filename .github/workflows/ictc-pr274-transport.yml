name: ICTC PR274 one-shot cutover transport
on:
  push:
    branches:
      - ci/ictc-pr274-transport-20261109
    paths:
      - 'transport/**'
      - '.github/workflows/ictc-pr274-transport.yml'
permissions:
  contents: write
jobs:
  cutover:
    if: github.repository == 'Luke883i/ictc' && github.ref == 'refs/heads/ci/ictc-pr274-transport-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout immutable transport
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Fetch exact PR274 HEAD and reject drift
        shell: bash
        run: |
          set -euo pipefail
          branch=docs/level-cora-method-interface-v1
          git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
          observed="$(git rev-parse "refs/remotes/origin/$branch")"
          test "$observed" = b415248c7a27885a41b4db02881f66d76bd6e5ab
          echo "ICTC_TARGET=$RUNNER_TEMP/ictc-pr274-target" >> "$GITHUB_ENV"
      - name: Create isolated worktree from real PR HEAD
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$ICTC_TARGET" b415248c7a27885a41b4db02881f66d76bd6e5ab
          test "$(git -C "$ICTC_TARGET" rev-parse HEAD)" = b415248c7a27885a41b4db02881f66d76bd6e5ab
      - name: Reconstruct exact migration from source-bound delta
        shell: bash
        run: |
          set -euo pipefail
          ICTC_REPO_ROOT="$ICTC_TARGET" python3 "$GITHUB_WORKSPACE/transport/migrate_pr274.py"
      - name: Verify tree, absence of v3 and whitespace
        shell: bash
        run: |
          set -euo pipefail
          git -C "$ICTC_TARGET" diff --cached --check
          test "$(git -C "$ICTC_TARGET" write-tree)" = 22d9fb9429336c42be0f61e4710c09ac80642ac1
          test "$(git -C "$ICTC_TARGET" ls-files | grep -c '^v3/' || true)" = 0
      - name: Commit atomic runtime cutover to candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git -C "$ICTC_TARGET" config user.name "github-actions[bot]"
          git -C "$ICTC_TARGET" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$ICTC_TARGET" commit -m "refactor(repo): migrate v3 to standard src/public/tests (exact-tree I12)"
          test "$(git -C "$ICTC_TARGET" rev-parse 'HEAD^{tree}')" = 22d9fb9429336c42be0f61e4710c09ac80642ac1
      - name: Push fast-forward to PR274 branch only
        shell: bash
        run: |
          set -euo pipefail
          git -C "$ICTC_TARGET" push --porcelain origin HEAD:refs/heads/docs/level-cora-method-interface-v1
          echo "PUBLISHED PR274 $(git -C "$ICTC_TARGET" rev-parse HEAD)"
