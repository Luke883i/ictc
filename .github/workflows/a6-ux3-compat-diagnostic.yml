name: a6-ux3-compat-diagnostic
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a6-ux3-compat-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v21:
    name: compat-v21
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$candidate")" >> "$GITHUB_ENV"; exit 0; fi
          done
          exit 1
      - name: Start runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4871 PORT=4871 ICTC_BASE_URL=http://127.0.0.1:4871
          export ICTC_STATE_DIR="$RUNNER_TEMP/state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/runtime" ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
          echo "ICTC_STATE_DIR=$ICTC_STATE_DIR" >> "$GITHUB_ENV"
          echo "ICTC_RUNTIME_DIR=$ICTC_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: V2.1 journey
        id: browser
        continue-on-error: true
        run: python -u v3/browser-v2-1-procedure-journey.py
      - name: Stop runtime
        if: always()
        run: ./ictc.sh stop --profile current || true
      - name: Capture V2.1 phase
        id: phase
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('artifacts/browser-v2-1-procedure-journey-error.json')
          phase='green' if '${{ steps.browser.outcome }}' == 'success' else 'unknown'
          if p.exists(): phase=str(json.loads(p.read_text(encoding='utf8')).get('phase') or 'unknown')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as f: f.write('phase='+phase+'\n')
          print('ICTC_BROWSER_PHASE='+phase)
          PY
      - name: V2.1 failure - RN
        if: steps.browser.outcome == 'failure' && startsWith(steps.phase.outputs.phase, 'RN-01')
        run: exit 1
      - name: V2.1 failure - EC
        if: steps.browser.outcome == 'failure' && startsWith(steps.phase.outputs.phase, 'EC-01')
        run: exit 1
      - name: V2.1 failure - AO
        if: steps.browser.outcome == 'failure' && startsWith(steps.phase.outputs.phase, 'AO-01')
        run: exit 1
      - name: V2.1 failure - MC
        if: steps.browser.outcome == 'failure' && startsWith(steps.phase.outputs.phase, 'MC-01')
        run: exit 1
      - name: V2.1 failure - AP
        if: steps.browser.outcome == 'failure' && startsWith(steps.phase.outputs.phase, 'AP-01')
        run: exit 1
      - name: V2.1 failure - RC
        if: steps.browser.outcome == 'failure' && startsWith(steps.phase.outputs.phase, 'RC-01')
        run: exit 1
      - name: V2.1 failure - AR
        if: steps.browser.outcome == 'failure' && startsWith(steps.phase.outputs.phase, 'AR-01')
        run: exit 1
      - name: V2.1 failure - projection or proof
        if: steps.browser.outcome == 'failure' && !startsWith(steps.phase.outputs.phase, 'RN-01') && !startsWith(steps.phase.outputs.phase, 'EC-01') && !startsWith(steps.phase.outputs.phase, 'AO-01') && !startsWith(steps.phase.outputs.phase, 'MC-01') && !startsWith(steps.phase.outputs.phase, 'AP-01') && !startsWith(steps.phase.outputs.phase, 'RC-01') && !startsWith(steps.phase.outputs.phase, 'AR-01')
        run: exit 1
      - name: V2.1 verdict
        if: always()
        run: test '${{ steps.browser.outcome }}' = success

  finetuning:
    name: compat-finetuning-${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: base, script: v3/browser-procedure-finetuning-1-4-base.py, error: browser-procedure-finetuning-1-4-error.json}
          - {id: executive, script: v3/browser-procedure-executive-harmonization-1-5.py, error: browser-procedure-executive-harmonization-1-5-error.json}
          - {id: rn-controls, script: v3/browser-surface-truth-rn-controls-2-5.py, error: browser-surface-truth-rn-controls-2-5-error.json}
          - {id: surface-truth, script: v3/browser-surface-truth-2-5.py, error: browser-surface-truth-2-5-error.json}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$candidate")" >> "$GITHUB_ENV"; exit 0; fi
          done
          exit 1
      - name: Start runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4872 PORT=4872 ICTC_BASE_URL=http://127.0.0.1:4872
          export ICTC_STATE_DIR="$RUNNER_TEMP/state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/runtime" ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
          echo "ICTC_STATE_DIR=$ICTC_STATE_DIR" >> "$GITHUB_ENV"
          echo "ICTC_RUNTIME_DIR=$ICTC_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Finetuning subtest
        id: browser
        continue-on-error: true
        run: python -u '${{ matrix.script }}'
      - name: Stop runtime
        if: always()
        run: ./ictc.sh stop --profile current || true
      - name: Capture finetuning phase
        id: phase
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('artifacts/${{ matrix.error }}')
          phase='green' if '${{ steps.browser.outcome }}' == 'success' else 'unknown'
          if p.exists(): phase=str(json.loads(p.read_text(encoding='utf8')).get('phase') or 'unknown')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as f: f.write('phase='+phase+'\n')
          print('ICTC_BROWSER_PHASE='+phase)
          PY
      - name: Finetuning failure - RN
        if: steps.browser.outcome == 'failure' && (steps.phase.outputs.phase == 'rn' || startsWith(steps.phase.outputs.phase, 'RN-01'))
        run: exit 1
      - name: Finetuning failure - EC
        if: steps.browser.outcome == 'failure' && (steps.phase.outputs.phase == 'ec' || startsWith(steps.phase.outputs.phase, 'EC-01'))
        run: exit 1
      - name: Finetuning failure - AO
        if: steps.browser.outcome == 'failure' && (steps.phase.outputs.phase == 'ao' || startsWith(steps.phase.outputs.phase, 'AO-01'))
        run: exit 1
      - name: Finetuning failure - MC
        if: steps.browser.outcome == 'failure' && (steps.phase.outputs.phase == 'mc' || startsWith(steps.phase.outputs.phase, 'MC-01'))
        run: exit 1
      - name: Finetuning failure - AP
        if: steps.browser.outcome == 'failure' && (steps.phase.outputs.phase == 'ap' || startsWith(steps.phase.outputs.phase, 'AP-01'))
        run: exit 1
      - name: Finetuning failure - mobile
        if: steps.browser.outcome == 'failure' && startsWith(steps.phase.outputs.phase, 'mobile')
        run: exit 1
      - name: Finetuning failure - other
        if: steps.browser.outcome == 'failure' && steps.phase.outputs.phase != 'rn' && steps.phase.outputs.phase != 'ec' && steps.phase.outputs.phase != 'ao' && steps.phase.outputs.phase != 'mc' && steps.phase.outputs.phase != 'ap' && !startsWith(steps.phase.outputs.phase, 'RN-01') && !startsWith(steps.phase.outputs.phase, 'EC-01') && !startsWith(steps.phase.outputs.phase, 'AO-01') && !startsWith(steps.phase.outputs.phase, 'MC-01') && !startsWith(steps.phase.outputs.phase, 'AP-01') && !startsWith(steps.phase.outputs.phase, 'mobile')
        run: exit 1
      - name: Finetuning verdict
        if: always()
        run: test '${{ steps.browser.outcome }}' = success
