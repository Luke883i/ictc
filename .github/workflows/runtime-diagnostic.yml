name: ictc-runtime-diagnostic
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: ictc-runtime-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Run current runtime rail
        id: runtime-suite
        continue-on-error: true
        run: npm run test:current:runtime
      - name: Publish runtime exact-head provenance
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FAILED_CHECK: ${{ steps.runtime-suite.outputs.failed_check }}
          RAIL_OUTCOME: ${{ steps.runtime-suite.outcome }}
          RAIL: runtime
        run: node scripts/release-failure-provenance.mjs
  semantic-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Run current semantic rail
        id: semantic-suite
        continue-on-error: true
        run: npm run test:current:semantic
      - name: Publish semantic exact-head provenance
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FAILED_CHECK: ${{ steps.semantic-suite.outputs.failed_check }}
          RAIL_OUTCOME: ${{ steps.semantic-suite.outcome }}
          RAIL: semantic
        run: node scripts/release-failure-provenance.mjs
  stable-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Run stable semantic rail
        id: stable-suite
        continue-on-error: true
        run: node v3/stable-release-suite.mjs
      - name: Publish stable exact-head provenance
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FAILED_CHECK: ${{ steps.stable-suite.outputs.failed_check }}
          RAIL_OUTCOME: ${{ steps.stable-suite.outcome }}
          RAIL: stable
        run: node scripts/release-failure-provenance.mjs
