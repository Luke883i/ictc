name: uiux-semantic-summary
on:
  push:
    branches:
      - agent/uiux-ontology-audit-20260920
    paths:
      - .github/workflows/uiux-semantic-summary.yml
      - audit/uiux-ontology-20260920/semantic-manifest.json
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Build compact rendered summary
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('audit/uiux-ontology-20260920/semantic-manifest.json')
          data=json.loads(p.read_text(encoding='utf8'))
          rows=[]
          for s in data['snapshots']:
              controls=[{'tag':c.get('tag'),'id':c.get('id'),'text':c.get('text'),'aria':c.get('aria'),'rect':c.get('rect')} for c in s.get('controls',[]) if c.get('text') or c.get('aria')]
              statuses=[{'id':x.get('id'),'className':x.get('className'),'text':x.get('text'),'aiState':x.get('aiState'),'sourceState':x.get('sourceState'),'rect':x.get('rect')} for x in s.get('statuses',[])]
              rows.append({
                  'viewport':s.get('viewport'),'surface':s.get('surface'),'url':s.get('url'),
                  'metrics':s.get('metrics'),'analysis':s.get('analysis'),
                  'headings':[{'tag':h.get('tag'),'text':h.get('text'),'rect':h.get('rect')} for h in s.get('headings',[])],
                  'controls':controls[:60],'statuses':statuses[:40],
                  'visibleText':s.get('visibleText','')[:5000],
              })
          out={'sha':data.get('sha'),'roles':data.get('roles'),'candidateFlags':data.get('candidateFlags'),'rows':rows,'limitations':data.get('limitations')}
          q=pathlib.Path('audit/uiux-ontology-20260920/semantic-summary.json')
          q.write_text(json.dumps(out,indent=2,ensure_ascii=False),encoding='utf8')
          print(json.dumps({'rows':len(rows),'flags':len(out['candidateFlags'])},ensure_ascii=False))
          PY
      - name: Commit summary
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "ictc-uiux-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add audit/uiux-ontology-20260920/semantic-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: compact rendered semantic summary [skip ci]"
          git push origin HEAD:agent/uiux-ontology-audit-20260920
