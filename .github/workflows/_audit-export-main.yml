name: audit-export-main-snapshot

on:
  push:
    branches:
      - agent/audit-main-snapshot-ca6017b

permissions:
  contents: write

jobs:
  export:
    if: ${{ !contains(github.event.head_commit.message, '[skip audit-export]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Export exact main snapshot
        shell: bash
        run: |
          set -euo pipefail
          target="ca6017b76f33d951ac5e3e5ee3db5f155e6a1fff"
          git cat-file -e "$target^{commit}"
          rm -rf _audit_transfer
          mkdir -p _audit_transfer
          git archive --format=zip --output=/tmp/ictc-main.zip "$target"
          split -b 700000 -d -a 3 /tmp/ictc-main.zip _audit_transfer/part-
          sha256sum /tmp/ictc-main.zip | awk '{print $1}' > _audit_transfer/SHA256.txt
          printf '%s\n' "$target" > _audit_transfer/REF.txt
          wc -c /tmp/ictc-main.zip > _audit_transfer/SIZE.txt
      - name: Commit transfer chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ictc-audit-export"
          git config user.email "ictc-audit-export@users.noreply.github.com"
          git add _audit_transfer
          git commit -m "audit transfer snapshot chunks [skip audit-export]"
          git push origin HEAD:agent/audit-main-snapshot-ca6017b
