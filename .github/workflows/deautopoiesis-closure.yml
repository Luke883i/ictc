name: deautopoiesis-closure
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deautopoiesis-closure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  false-closure-firewall:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit remediation registry cannot self-close external gates
        run: node v3/audit-remediation-closure-check.mjs
      - name: One-million hostile seeded closure simulations
        run: node v3/deautopoiesis-adversarial-saturation.mjs
      - name: Operational storage authority
        run: node v3/operations-storage-authority-check.mjs
      - name: Enterprise readiness evidence-envelope fixture
        run: node v3/enterprise-readiness-check.mjs

  runtime-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Snapshot Windows Node process baseline
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $baseline = @(Get-Process node -ErrorAction SilentlyContinue | ForEach-Object {
            [PSCustomObject]@{ Id = $_.Id; Started = $_.StartTime.ToUniversalTime().Ticks }
          })
          $baseline | ConvertTo-Json -Compress | Set-Content -Path "$env:RUNNER_TEMP/ictc-node-baseline.json" -Encoding utf8
          Write-Host "Windows Node baseline: $($baseline.Count) process(es)"
      - name: Current runtime suite on supported matrix
        id: current-runtime
        continue-on-error: true
        run: npm run test:current:runtime
      - name: "Runtime suite verdict · ${{ steps.current-runtime.outputs.failed_check || 'passed' }} · ${{ steps.current-runtime.outputs.s3_failed_phase || 'phase-ok' }} · ${{ steps.current-runtime.outputs.s3_failed_code || 'code-ok' }}"
        if: always()
        env:
          ICTC_RUNTIME_SUITE_OUTCOME: ${{ steps.current-runtime.outcome }}
          ICTC_RUNTIME_FAILED_CHECK: ${{ steps.current-runtime.outputs.failed_check }}
          ICTC_S3_FAILED_PHASE: ${{ steps.current-runtime.outputs.s3_failed_phase }}
          ICTC_S3_FAILED_CODE: ${{ steps.current-runtime.outputs.s3_failed_code }}
        run: node -e "const outcome=process.env.ICTC_RUNTIME_SUITE_OUTCOME;const failed=process.env.ICTC_RUNTIME_FAILED_CHECK||'unknown';const phase=process.env.ICTC_S3_FAILED_PHASE||'unknown';const code=process.env.ICTC_S3_FAILED_CODE||'unknown';if(outcome!=='success'){console.error('runtime portability failed_check='+failed+' phase='+phase+' code='+code);process.exit(1)}console.log('runtime portability suite passed')"
      - name: Enforce Windows runtime process quiescence
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $baselinePath = "$env:RUNNER_TEMP/ictc-node-baseline.json"
          $baseline = @()
          if (Test-Path $baselinePath) {
            $raw = Get-Content -Raw $baselinePath
            if ($raw.Trim()) { $baseline = @(ConvertFrom-Json $raw) }
          }
          $baselineKeys = [System.Collections.Generic.HashSet[string]]::new()
          foreach ($item in $baseline) { [void]$baselineKeys.Add("$($item.Id):$($item.Started)") }
          $current = @(Get-Process node -ErrorAction SilentlyContinue)
          $residual = @($current | Where-Object {
            $key = "$($_.Id):$($_.StartTime.ToUniversalTime().Ticks)"
            -not $baselineKeys.Contains($key)
          })
          if ($residual.Count -gt 0) {
            $ids = ($residual | ForEach-Object { $_.Id }) -join ','
            Write-Host "Residual ICTC-owned Node processes after runtime rail: $ids"
            $residual | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Milliseconds 750
          }
          $remaining = @(Get-Process node -ErrorAction SilentlyContinue | Where-Object {
            $key = "$($_.Id):$($_.StartTime.ToUniversalTime().Ticks)"
            -not $baselineKeys.Contains($key)
          })
          if ($remaining.Count -gt 0) {
            $ids = ($remaining | ForEach-Object { $_.Id }) -join ','
            throw "Residual ICTC-owned Node processes survived explicit quiescence: $ids"
          }
          Write-Host "Windows runtime process quiescence: clean; preserved $($baselineKeys.Count) baseline process(es)"
