name: deautopoiesis-closure
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deautopoiesis-closure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  false-closure-firewall:
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head without post-action
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
      - name: Select hosted Node 22 without post-action
        shell: bash
        env:
          NODE_MAJOR: '22'
        run: |
          set -Eeuo pipefail
          node_root="$RUNNER_TOOL_CACHE/node"
          version_dir="$(find "$node_root" -mindepth 1 -maxdepth 1 -type d -name "$NODE_MAJOR.*" -printf '%f\n' | sort -V -r | head -n1)"
          [[ -n "$version_dir" ]] || { echo "Node $NODE_MAJOR is not present in RUNNER_TOOL_CACHE" >&2; exit 1; }
          node_dir="$node_root/$version_dir/x64/bin"
          [[ -x "$node_dir/node" ]] || { echo "Node executable missing from $node_dir" >&2; exit 1; }
          echo "$node_dir" >> "$GITHUB_PATH"
          "$node_dir/node" --version
          "$node_dir/npm" --version
      - run: npm ci --ignore-scripts
      - name: Audit remediation registry cannot self-close external gates
        id: audit-remediation
        run: node v3/audit-remediation-closure-check.mjs
      - name: One-million hostile seeded closure simulations
        id: adversarial-closure
        run: node v3/deautopoiesis-adversarial-saturation.mjs
      - name: Operational storage authority
        id: storage-authority
        run: node v3/operations-storage-authority-check.mjs
      - name: Enterprise readiness evidence-envelope fixture
        id: enterprise-readiness
        run: node v3/enterprise-readiness-check.mjs
      - name: Publish false-closure rail verdict
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RAIL: false-closure
          RAIL_OUTCOME: ${{ steps.audit-remediation.outcome == 'success' && steps.adversarial-closure.outcome == 'success' && steps.storage-authority.outcome == 'success' && steps.enterprise-readiness.outcome == 'success' && 'success' || 'failure' }}
          FAILED_CHECK: ${{ steps.audit-remediation.outcome == 'failure' && 'v3/audit-remediation-closure-check.mjs' || steps.adversarial-closure.outcome == 'failure' && 'v3/deautopoiesis-adversarial-saturation.mjs' || steps.storage-authority.outcome == 'failure' && 'v3/operations-storage-authority-check.mjs' || steps.enterprise-readiness.outcome == 'failure' && 'v3/enterprise-readiness-check.mjs' || '' }}
        run: node scripts/release-failure-provenance.mjs
  runtime-portability:
    permissions:
      contents: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact head without post-action (Ubuntu)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
      - name: Checkout exact head without post-action (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git"
          git fetch --no-tags --depth=1 origin $env:HEAD_SHA
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - name: Select hosted Node toolcache without post-action (Ubuntu)
        if: runner.os != 'Windows'
        shell: bash
        env:
          NODE_MAJOR: ${{ matrix.node }}
        run: |
          set -Eeuo pipefail
          node_root="$RUNNER_TOOL_CACHE/node"
          version_dir="$(find "$node_root" -mindepth 1 -maxdepth 1 -type d -name "$NODE_MAJOR.*" -printf '%f\n' | sort -V -r | head -n1)"
          [[ -n "$version_dir" ]] || { echo "Node $NODE_MAJOR is not present in RUNNER_TOOL_CACHE" >&2; exit 1; }
          node_dir="$node_root/$version_dir/x64/bin"
          [[ -x "$node_dir/node" ]] || { echo "Node executable missing from $node_dir" >&2; exit 1; }
          echo "$node_dir" >> "$GITHUB_PATH"
          "$node_dir/node" --version
          "$node_dir/npm" --version
      - name: Select hosted Node toolcache without post-action (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NODE_MAJOR: ${{ matrix.node }}
        run: |
          $nodeRoot = Join-Path $env:RUNNER_TOOL_CACHE 'node'
          $versionDir = Get-ChildItem $nodeRoot -Directory | Where-Object { $_.Name -like "$env:NODE_MAJOR.*" } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $versionDir) { throw "Node $env:NODE_MAJOR is not present in RUNNER_TOOL_CACHE" }
          $nodeDir = Join-Path $versionDir.FullName 'x64'
          if (-not (Test-Path (Join-Path $nodeDir 'node.exe'))) { throw "Node executable missing from $nodeDir" }
          $nodeDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $nodeDir 'node.exe') --version
          & (Join-Path $nodeDir 'npm.cmd') --version
      - run: npm ci --ignore-scripts
      - name: Snapshot Windows Node process baseline
        id: windows-node-baseline
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $baseline = @(Get-Process node -ErrorAction SilentlyContinue | ForEach-Object {
            [PSCustomObject]@{ Id = $_.Id; Started = $_.StartTime.ToUniversalTime().Ticks }
          })
          $baseline | ConvertTo-Json -Compress | Set-Content -Path "$env:RUNNER_TEMP/ictc-node-baseline.json" -Encoding utf8
          Write-Host "Windows Node baseline: $($baseline.Count) process(es)"
      - name: Current runtime suite on supported matrix
        id: runtime-suite
        run: npm run test:current:runtime
      - name: Enforce Windows runtime process quiescence
        id: windows-quiescence
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $baselinePath = "$env:RUNNER_TEMP/ictc-node-baseline.json"
          $baseline = @()
          if (Test-Path $baselinePath) {
            $raw = Get-Content -Raw $baselinePath
            if ($raw.Trim()) { $baseline = @(ConvertFrom-Json $raw) }
          }
          $baselineKeys = [System.Collections.Generic.HashSet[string]]::new()
          foreach ($item in $baseline) { [void]$baselineKeys.Add("$($item.Id):$($item.Started)") }
          $current = @(Get-Process node -ErrorAction SilentlyContinue)
          $residual = @($current | Where-Object {
            $key = "$($_.Id):$($_.StartTime.ToUniversalTime().Ticks)"
            -not $baselineKeys.Contains($key)
          })
          if ($residual.Count -gt 0) {
            $ids = ($residual | ForEach-Object { $_.Id }) -join ','
            Write-Host "Residual ICTC-owned Node processes after runtime rail: $ids"
            $residual | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Milliseconds 750
          }
          $remaining = @(Get-Process node -ErrorAction SilentlyContinue | Where-Object {
            $key = "$($_.Id):$($_.StartTime.ToUniversalTime().Ticks)"
            -not $baselineKeys.Contains($key)
          })
          if ($remaining.Count -gt 0) {
            $ids = ($remaining | ForEach-Object { $_.Id }) -join ','
            throw "Residual ICTC-owned Node processes survived explicit quiescence: $ids"
          }
          Write-Host "Windows runtime process quiescence: clean; preserved $($baselineKeys.Count) baseline process(es)"
      - name: Publish portability exact-head verdict
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FAILED_CHECK: ${{ steps.runtime-suite.outputs.failed_check }}
          RAIL_OUTCOME: ${{ steps.runtime-suite.outcome == 'success' && (runner.os != 'Windows' || steps.windows-quiescence.outcome == 'success') && 'success' || 'failure' }}
          RAIL: portability-${{ matrix.os }}-node${{ matrix.node }}
        run: node scripts/release-failure-provenance.mjs
