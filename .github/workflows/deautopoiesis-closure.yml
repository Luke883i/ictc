name: deautopoiesis-closure
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deautopoiesis-closure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  false-closure-firewall:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit remediation registry cannot self-close external gates
        run: node v3/audit-remediation-closure-check.mjs
      - name: One-million hostile seeded closure simulations
        run: node v3/deautopoiesis-adversarial-saturation.mjs
      - name: Operational storage authority
        run: node v3/operations-storage-authority-check.mjs
      - name: Enterprise readiness evidence-envelope fixture
        run: node v3/enterprise-readiness-check.mjs
  runtime-portability:
    permissions:
      contents: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact head (non-Windows)
        if: runner.os != 'Windows'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Checkout exact head without post-action (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git"
          git fetch --no-tags --depth=1 origin $env:HEAD_SHA
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - name: Setup Node (non-Windows)
        if: runner.os != 'Windows'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '${{ matrix.node }}'
      - name: Select hosted Node toolcache without post-action (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NODE_MAJOR: ${{ matrix.node }}
        run: |
          $nodeRoot = Join-Path $env:RUNNER_TOOL_CACHE 'node'
          $versionDir = Get-ChildItem $nodeRoot -Directory | Where-Object { $_.Name -like "$env:NODE_MAJOR.*" } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $versionDir) { throw "Node $env:NODE_MAJOR is not present in RUNNER_TOOL_CACHE" }
          $nodeDir = Join-Path $versionDir.FullName 'x64'
          if (-not (Test-Path (Join-Path $nodeDir 'node.exe'))) { throw "Node executable missing from $nodeDir" }
          $nodeDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $nodeDir 'node.exe') --version
          & (Join-Path $nodeDir 'npm.cmd') --version
      - run: npm ci --ignore-scripts
      - name: Current runtime suite on supported matrix
        id: runtime-suite
        run: npm run test:current:runtime
      - name: Publish portability exact-head provenance
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FAILED_CHECK: ${{ steps.runtime-suite.outputs.failed_check }}
          RAIL_OUTCOME: ${{ steps.runtime-suite.outcome }}
          RAIL: portability-${{ matrix.os }}-node${{ matrix.node }}
        run: node scripts/release-failure-provenance.mjs
      - name: Enforce Windows runtime process quiescence
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $nodes = @(Get-Process node -ErrorAction SilentlyContinue)
          if ($nodes.Count -gt 0) {
            $ids = ($nodes | ForEach-Object { $_.Id }) -join ','
            Write-Host "Residual Node processes after runtime rail: $ids"
            $nodes | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Milliseconds 750
          }
          $remaining = @(Get-Process node -ErrorAction SilentlyContinue)
          if ($remaining.Count -gt 0) {
            $ids = ($remaining | ForEach-Object { $_.Id }) -join ','
            throw "Residual Node processes survived explicit quiescence: $ids"
          }
          Write-Host 'Windows runtime process quiescence: clean'
