name: deautopoiesis-closure
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deautopoiesis-closure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  false-closure-firewall:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit remediation registry cannot self-close external gates
        run: node v3/audit-remediation-closure-check.mjs
      - name: One-million hostile seeded closure simulations
        run: node v3/deautopoiesis-adversarial-saturation.mjs
      - name: Operational storage authority
        run: node v3/operations-storage-authority-check.mjs
      - name: Enterprise readiness evidence-envelope fixture
        run: node v3/enterprise-readiness-check.mjs
  runtime-portability:
    permissions:
      contents: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact head (non-Windows)
        if: runner.os != 'Windows'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Checkout exact head without post-action (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git"
          git fetch --no-tags --depth=1 origin $env:HEAD_SHA
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '${{ matrix.node }}'
      - run: npm ci --ignore-scripts
      - name: Current runtime suite on supported matrix
        id: runtime-suite
        run: npm run test:current:runtime
      - name: Publish portability exact-head provenance
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FAILED_CHECK: ${{ steps.runtime-suite.outputs.failed_check }}
          RAIL_OUTCOME: ${{ steps.runtime-suite.outcome }}
          RAIL: portability-${{ matrix.os }}-node${{ matrix.node }}
        run: node scripts/release-failure-provenance.mjs
