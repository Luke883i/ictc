name: browser-onto-diagnostics-2-6
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
  statuses: write
concurrency:
  group: browser-onto-diagnostics-2-6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  onto-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "ICTC_CHROMIUM=$(command -v "$candidate")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          exit 1
      - name: Diagnose Onto-Compliance browser failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4840 PORT=4840 ICTC_BASE_URL=http://127.0.0.1:4840
          export ICTC_STATE_DIR="$RUNNER_TEMP/onto-diag-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/onto-diag-runtime" ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          trap './ictc.sh stop --profile current || true' EXIT
          if python -u v3/browser-onto-compliance-v1.py; then exit 0; fi
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          p=pathlib.Path('artifacts/browser-onto-compliance-v1-error.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          phase=str(d.get('phase','unknown')); anomalies=d.get('anomalies') or []
          message=str(d.get('message','')); trace=str(d.get('traceback',''))
          def slug(v,n=42): return re.sub(r'[^a-z0-9._-]+','-',str(v).lower()).strip('-')[:n] or 'none'
          rows=anomalies[:8] or [{'kind':d.get('type','exception'),'surface':phase,'measured':message or 'no-artifact'}]
          for i,row in enumerate(rows,1):
              kind=str(row.get('kind','exception')); surface=str(row.get('surface','unknown')); measured=row.get('measured')
              compact=json.dumps(measured,ensure_ascii=True,separators=(',',':')) if not isinstance(measured,str) else measured
              context=f"ictc/onto-diag/{i}-{slug(kind,34)}-{slug(surface,18)}"[:100]
              payload=json.dumps({'state':'failure','context':context,'description':f'{kind}; phase={phase}; measured={compact}'[:140]})
              subprocess.run(['curl','-fsS','-X','POST','-H',f"Authorization: Bearer {os.environ['GH_TOKEN']}",'-H','Accept: application/vnd.github+json','-H','X-GitHub-Api-Version: 2022-11-28',f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['HEAD_SHA']}",'-d',payload],check=True)
          hits=re.findall(r'File "[^"]*browser-onto-compliance-v1\.py", line (\d+)',trace)
          line=hits[-1] if hits else 'none'
          low=message.lower(); op='unknown'
          for needle,label in [('locator.click','click'),('expect.to_be_visible','visible'),('to_be_visible','visible'),('to_have_attribute','attribute'),('wait_for','wait'),('evaluate','evaluate')]:
              if needle in low: op=label; break
          reason='unknown'
          for needle,label in [('intercepts pointer events','intercept'),('outside of the viewport','outside'),('not visible','not-visible'),('not stable','unstable'),('detached from the dom','detached'),('visible, enabled and stable','not-ready')]:
              if needle in low: reason=label; break
          blocker='none'
          m=re.search(r'(<[^\n>]+[^\n]*>) intercepts pointer events',message,re.I)
          if m: blocker=slug(m.group(1),30)
          locator='none'
          m=re.search(r'waiting for locator\(([^\n]+)',message,re.I)
          if m: locator=slug(m.group(1),24)
          context=f"ictc/onto-trace/line-{line}-{slug(op,12)}-{reason}-{blocker}"[:100]
          payload=json.dumps({'state':'failure','context':context,'description':f'phase={phase}; line={line}; op={op}; reason={reason}; blocker={blocker}; locator={locator}'[:140]})
          subprocess.run(['curl','-fsS','-X','POST','-H',f"Authorization: Bearer {os.environ['GH_TOKEN']}",'-H','Accept: application/vnd.github+json','-H','X-GitHub-Api-Version: 2022-11-28',f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['HEAD_SHA']}",'-d',payload],check=True)
          PY
          exit 1
