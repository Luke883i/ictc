name: v4-stable-dod
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v4-stable-dod-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semantic-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: node v3/v4-stable-real-saturation.mjs
      - run: node v3/v4-stable-e2e-mutation-check.mjs
      - run: node v3/v4-stable-governance-check.mjs
      - run: node v3/v4-stable-persistence-check.mjs
      - run: node v3/store-durability-check.mjs
      - run: node v3/v4-stable-global-dod-check.mjs
  browser-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve system Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$candidate")" >> "$GITHUB_ENV"; exit 0; fi
          done
          exit 1
      - name: Historical V4 stable runtime browser journey
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4821 PORT=4821 ICTC_BASE_URL="http://127.0.0.1:4821"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-v4-stable-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-v4-stable-runtime" ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          trap './ictc.sh stop --profile current || true' EXIT
          python -u v3/browser-v4-stable-check.py
