name: v3-dod
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v3-dod-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semantic-dod:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Historical V3 semantic replay
        run: |
          npm run check
          node tests/verification/v2-grc-convergence-check.mjs
          node tests/verification/v2-grc-saturation.mjs
          node tests/verification/work-orchestration-check.mjs
          node tests/verification/procedure-guide-check.mjs
          node tests/verification/assist-envelope-check.mjs
          node tests/verification/review-inbox-check.mjs
          node tests/verification/insight-projection-check.mjs
          node tests/verification/procedure-trace-check.mjs
          node tests/verification/decision-binding-check.mjs
          node tests/verification/epistemic-projection-check.mjs
          node tests/verification/evidence-export-check.mjs
  runtime-dod:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Historical V3 runtime replay
        run: |
          node tests/verification/v2-grc-runtime-check.mjs
          node tests/verification/work-orchestration-runtime-check.mjs
          node tests/verification/insight-runtime-check.mjs
          node tests/verification/evidence-check.mjs
          node tests/verification/evidence-export-auth-check.mjs
