name: Demo | Legacy dataset runtime checks

on:
  pull_request:
    paths:
      - 'ictc.sh'
      - 'src/server.mjs'
      - 'public/ui/stable-shell.js'
      - 'tests/browser/browser-epistemic-professional-demo.py'
      - 'tests/fixtures/demo-suite-2-2/demo-suite-2-2-fixture-*.b64'
      - 'src/runtime/demo-suite-2-2*.mjs'
      - 'tests/verification/demo-suite-2-2-module-load-check.mjs'
      - 'tests/verification/demo-suite-2-2-runtime-semantic-check.mjs'
      - 'tests/verification/demo-suite-2-2-runtime-store-check.mjs'
      - 'tests/verification/demo-suite-2-2-projection-closure-check.mjs'
      - 'docs/DEMO_SUITE_2_2_RUNTIME_SEMANTIC.md'
      - '.github/workflows/demo-suite-2-2-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: node scripts/syntax-check.mjs

  module-load:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: node tests/verification/demo-suite-2-2-module-load-check.mjs

  native-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: node tests/verification/demo-suite-2-2-runtime-semantic-check.mjs

  runtime-store:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: RuntimeStore materialization + restart/idempotence
        run: node tests/verification/demo-suite-2-2-runtime-store-check.mjs

  projection-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Sole authority + 10M multi-abstraction mutations + server bootstrap
        run: node tests/verification/demo-suite-2-2-projection-closure-check.mjs
