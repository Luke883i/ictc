name: Demo Suite 2.2 Runtime Semantic

on:
  pull_request:
    paths:
      - 'ictc.sh'
      - 'v3/server.mjs'
      - 'v3/public/ui/stable-shell.js'
      - 'v3/browser-epistemic-professional-demo.py'
      - 'v3/demo/demo-suite-2-2-fixture-*.b64'
      - 'v3/runtime/demo-suite-2-2*.mjs'
      - 'v3/demo-suite-2-2-module-load-check.mjs'
      - 'v3/demo-suite-2-2-runtime-semantic-check.mjs'
      - 'v3/demo-suite-2-2-runtime-store-check.mjs'
      - 'v3/demo-suite-2-2-projection-closure-check.mjs'
      - 'docs/DEMO_SUITE_2_2_RUNTIME_SEMANTIC.md'
      - '.github/workflows/demo-suite-2-2-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: node scripts/syntax-check.mjs

  module-load:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: node v3/demo-suite-2-2-module-load-check.mjs

  native-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: node v3/demo-suite-2-2-runtime-semantic-check.mjs

  runtime-store:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: RuntimeStore materialization + restart/idempotence
        run: node v3/demo-suite-2-2-runtime-store-check.mjs

  projection-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Sole authority + 10M multi-abstraction mutations + server bootstrap
        run: node v3/demo-suite-2-2-projection-closure-check.mjs
