name: s4-a1-presentation-worklist-authority
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: s4-a1-presentation-worklist-authority-${{ github.ref }}
  cancel-in-progress: true
jobs:
  presentation-worklist-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - name: A1 changed-source syntax and integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check v3/runtime/procedure-worklist-presentation.mjs
          node --check v3/public/ui/procedure-worklist.js
          node --check v3/public/ui/procedure-sequential-rn-ec.js
          node --check v3/public/ui/grc-workspace-3-2.js
          node --check v3/s4-a1-worklist-presentation-check.mjs
          node --check v3/s4-a1-convergence-saturation-1m.mjs
      - name: A1 presentation contract
        run: node v3/s4-a1-worklist-presentation-check.mjs
      - name: A1 product-CI convergence mutation saturation 1M
        run: node v3/s4-a1-convergence-saturation-1m.mjs
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Browser check syntax
        run: python -m py_compile v3/browser-s4-a1-worklist-authority.py
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          if [[ -z "$browser" || ! -x "$browser" ]]; then echo 'No supported system Chromium browser found on the runner' >&2; exit 1; fi
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Materialize exact-head canonical DEMO runtime
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4821 PORT=4821
          export ICTC_BASE_URL="http://127.0.0.1:4821"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-s4-a1-state"
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-s4-a1-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          export ICTC_DEMO_STARTUP_ATTEMPTS=900
          export ICTC_EXPECT_BUILD_SHA="$HEAD_SHA"
          ./ictc.sh demo --profile current --no-open
          ./ictc.sh status --profile current
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
          echo "ICTC_STATE_DIR=$ICTC_STATE_DIR" >> "$GITHUB_ENV"
          echo "ICTC_RUNTIME_DIR=$ICTC_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "ICTC_EXPECT_BUILD_SHA=$ICTC_EXPECT_BUILD_SHA" >> "$GITHUB_ENV"
      - name: Seven-procedure exact-target browser contract
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONUNBUFFERED=1 ICTC_NO_OPEN=1 ICTC_PORT=4821 PORT=4821 ICTC_SCHEDULER_TICK_MS=100000
          status=0
          python -u v3/browser-s4-a1-worklist-authority.py || status=$?
          cp "$ICTC_STATE_DIR/logs/ictc.log" artifacts/browser-s4-a1-server.log || true
          if [[ "$status" -ne 0 ]]; then
            FAILED_BROWSER_SCRIPT='v3/browser-s4-a1-worklist-authority.py' node scripts/browser-failure-provenance.mjs || true
            exit "$status"
          fi
      - name: Publish machine-readable A1 browser provenance
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -u
          error='artifacts/browser-s4-a1-worklist-authority-error.json'
          report='artifacts/browser-s4-a1-worklist-authority.json'
          if [[ -f "$error" ]]; then
            phase="$(node -e "const p=require('./$error');process.stdout.write(String(p.phase||'unknown'))")"
            type="$(node -e "const p=require('./$error');process.stdout.write(String(p.type||'Error'))")"
            description="failure ${phase} ${type}"
            state=failure
          elif [[ -f "$report" ]]; then
            phase=complete
            description='7/7 exact-target browser contract green'
            state=success
          else
            phase=no-artifact
            description='browser evidence artifact missing'
            state=error
          fi
          description="${description:0:140}"
          target="https://github.com/${GITHUB_REPOSITORY}/blob/${HEAD_SHA}/v3/browser-s4-a1-worklist-authority.py?phase=${phase}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state="$state" -f context='ictc/s4-a1-browser' -f description="$description" -f target_url="$target" >/dev/null || true
          echo "ICTC_S4_A1_BROWSER_PHASE=$phase"
      - name: Stop DEMO runtime
        if: always()
        shell: bash
        run: ./ictc.sh stop --profile current || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: s4-a1-presentation-worklist-authority
          path: |
            artifacts/s4-a1-*.json
            artifacts/s4-a1-*.png
            artifacts/browser-s4-a1-*.json
            artifacts/browser-s4-a1-server.log
          if-no-files-found: error
          retention-days: 30
