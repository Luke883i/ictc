name: s4-a6-ux4-semantic-surface
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s4-a6-ux4-semantic-surface-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semantic-surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - name: A6-UX4 syntax
        run: |
          node --check v3/public/ui/semantic-surface-a6-ux4.js
          node --check v3/public/ui/standard-browser.js
          node --check v3/s4-a6-ux4-semantic-surface-model.mjs
          node --check v3/s4-a6-ux4-uiux-mount-model.mjs
          node --check v3/s4-a6-ux4-ontology-uiux-model.mjs
          node --check v3/s4-a6-ux4-semantic-surface-check.mjs
          node --check v3/s4-a6-ux4-semantic-surface-fuzz-10k.mjs
          node --check v3/s4-a6-ux4-uiux-mount-fuzz-100k.mjs
          node --check v3/s4-a6-ux4-ontology-uiux-fuzz-100k.mjs
          node --check v3/s4-a6-ux3-operational-surface-model.mjs
          node --check v3/s4-a6-ux3-operational-surface-saturation.mjs
          node --check v3/current-gate-registry.mjs
          python -m py_compile v3/browser-s4-a6-ux4-semantic-surface.py
          python -m py_compile v3/browser-s4-a1-worklist-authority.py
      - name: A6-UX4 semantic source contract
        run: node v3/s4-a6-ux4-semantic-surface-check.mjs
      - name: A6-UX4 deterministic falsification 10,000 cases
        run: node v3/s4-a6-ux4-semantic-surface-fuzz-10k.mjs
      - name: A6-UX4 screenshot-derived UIUX mount falsification 100,000 cases
        run: node v3/s4-a6-ux4-uiux-mount-fuzz-100k.mjs
      - name: A6-UX4 editorial semantic visual ontological falsification 100,000 cases
        run: node v3/s4-a6-ux4-ontology-uiux-fuzz-100k.mjs
      - name: A6-UX3 successor-lineage compatibility
        run: |
          node v3/s4-a6-ux3-operational-surface-check.mjs
          node v3/s4-a6-ux3-operational-surface-saturation.mjs
      - name: Convergence workbook binding
        run: node v3/convergence-authority-check.mjs
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          test -n "$browser" -a -x "$browser"
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
      - name: Materialize exact-head current runtime
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4874 PORT=4874 ICTC_BASE_URL=http://127.0.0.1:4874
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-a6-ux4-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-a6-ux4-runtime" ICTC_SCHEDULER_TICK_MS=100000 ICTC_EXPECT_BUILD_SHA="$HEAD_SHA"
          ./ictc.sh start --profile current --no-open
          ./ictc.sh status --profile current
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
          echo "ICTC_STATE_DIR=$ICTC_STATE_DIR" >> "$GITHUB_ENV"
          echo "ICTC_RUNTIME_DIR=$ICTC_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "ICTC_EXPECT_BUILD_SHA=$ICTC_EXPECT_BUILD_SHA" >> "$GITHUB_ENV"
      - name: A6-UX4 exact-head Chromium semantic UIUX surface
        run: python -u v3/browser-s4-a6-ux4-semantic-surface.py
      - name: Stop runtime
        if: always()
        run: ./ictc.sh stop --profile current || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v6
        if: always()
        with:
          name: s4-a6-ux4-semantic-surface-evidence
          path: |
            artifacts/s4-a6-ux4-semantic-surface-fuzz-10k.json
            artifacts/s4-a6-ux4-uiux-mount-fuzz-100k.json
            artifacts/s4-a6-ux4-ontology-uiux-fuzz-100k.json
            artifacts/browser-s4-a6-ux4-semantic-surface*.json
            artifacts/convergence-authority-*.json
          if-no-files-found: warn
          retention-days: 30
