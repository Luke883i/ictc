name: s4-a6-ux4-semantic-surface
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s4-a6-ux4-semantic-surface-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semantic-surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - name: A6-UX4 syntax
        run: |
          node --check v3/public/ui/semantic-surface-a6-ux4.js
          node --check v3/public/ui/standard-browser.js
          node --check v3/s4-a6-ux4-semantic-surface-model.mjs
          node --check v3/s4-a6-ux4-uiux-mount-model.mjs
          node --check v3/s4-a6-ux4-ontology-uiux-model.mjs
          node --check v3/s4-a6-ux4-semantic-surface-check.mjs
          node --check v3/s4-a6-ux4-semantic-surface-fuzz-10k.mjs
          node --check v3/s4-a6-ux4-uiux-mount-fuzz-100k.mjs
          node --check v3/s4-a6-ux4-ontology-uiux-fuzz-100k.mjs
          node --check v3/s4-a6-ux3-operational-surface-model.mjs
          node --check v3/s4-a6-ux3-operational-surface-saturation.mjs
          node --check v3/current-gate-registry.mjs
          node --check v3/uiux-ontoepistemic-convergence-3-check.mjs
          node --check v3/uiux-ontoepistemic-convergence-3-saturation-10m.mjs
          python -m py_compile v3/browser-s4-a6-ux4-semantic-surface.py
          python -m py_compile v3/browser-s4-a1-worklist-authority.py
      - name: A6-UX4 semantic source contract
        run: node v3/s4-a6-ux4-semantic-surface-check.mjs
      - name: UIUX onto-epistemic convergence 3 source contract
        run: node v3/uiux-ontoepistemic-convergence-3-check.mjs
      - name: UIUX onto-epistemic convergence 3 falsification 10,000,000
        run: node v3/uiux-ontoepistemic-convergence-3-saturation-10m.mjs
      - name: A6-UX4 deterministic falsification 10,000 cases
        run: node v3/s4-a6-ux4-semantic-surface-fuzz-10k.mjs
      - name: A6-UX4 screenshot-derived UIUX mount falsification 100,000 cases
        run: node v3/s4-a6-ux4-uiux-mount-fuzz-100k.mjs
      - name: A6-UX4 editorial semantic visual ontological falsification 100,000 cases
        run: node v3/s4-a6-ux4-ontology-uiux-fuzz-100k.mjs
      - name: A6-UX3 successor-lineage compatibility
        run: |
          node v3/s4-a6-ux3-operational-surface-check.mjs
          node v3/s4-a6-ux3-operational-surface-saturation.mjs
      - name: Convergence workbook binding
        run: node v3/convergence-authority-check.mjs
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          test -n "$browser" -a -x "$browser"
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
      - name: Materialize exact-head current runtime
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4874 PORT=4874 ICTC_BASE_URL=http://127.0.0.1:4874
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-a6-ux4-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-a6-ux4-runtime" ICTC_SCHEDULER_TICK_MS=100000 ICTC_EXPECT_BUILD_SHA="$HEAD_SHA"
          ./ictc.sh start --profile current --no-open
          ./ictc.sh status --profile current
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
          echo "ICTC_STATE_DIR=$ICTC_STATE_DIR" >> "$GITHUB_ENV"
          echo "ICTC_RUNTIME_DIR=$ICTC_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "ICTC_EXPECT_BUILD_SHA=$ICTC_EXPECT_BUILD_SHA" >> "$GITHUB_ENV"
      - name: A6-UX4 exact-head Chromium semantic UIUX surface
        id: ux4_browser
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -u v3/browser-s4-a6-ux4-semantic-surface.py
          rc=$?
          phase=pass
          if [ "$rc" -ne 0 ] && [ -f artifacts/browser-s4-a6-ux4-semantic-surface-error.json ]; then
            phase="$(python -c "import json;print(json.load(open('artifacts/browser-s4-a6-ux4-semantic-surface-error.json'))['phase'])")"
          fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Parse A6-UX4 browser failure
        id: ux4_diag
        if: steps.ux4_browser.outcome == 'failure'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,pathlib
          p=pathlib.Path('artifacts/browser-s4-a6-ux4-semantic-surface-error.json')
          def safe(value):
              raw=str(value or 'none')
              return ''.join(ch if ch.isalnum() or ch in '._-' else '-' for ch in raw).strip('-')[:96] or 'none'
          if not p.exists():
              print('phase=no-error-artifact');print('type=none');print('page_errors=0');print('leaf=none');print('result_tail=none')
          else:
              data=json.loads(p.read_text())
              trace=str(data.get('traceback') or '')
              leaf=next((line.strip() for line in reversed(trace.splitlines()) if line.strip()),'none')
              results=data.get('results') or []
              tail=results[-1].get('oracle') if results and isinstance(results[-1],dict) else 'none'
              print('phase='+safe(data.get('phase')))
              print('type='+safe(data.get('type')))
              print('page_errors='+str(len(data.get('pageErrors') or [])))
              print('leaf='+safe(leaf))
              print('result_tail='+safe(tail))
          PY
      - name: A6-UX4 browser diagnostic · ${{ steps.ux4_diag.outputs.phase }} · ${{ steps.ux4_diag.outputs.type }} · pe=${{ steps.ux4_diag.outputs.page_errors }} · ${{ steps.ux4_diag.outputs.leaf }} · ${{ steps.ux4_diag.outputs.result_tail }}
        if: steps.ux4_browser.outcome == 'failure'
        shell: bash
        run: |
          cat artifacts/browser-s4-a6-ux4-semantic-surface-error.json || true
          exit 1
      - name: Stop runtime
        if: always()
        run: ./ictc.sh stop --profile current || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: s4-a6-ux4-semantic-surface-evidence-${{ steps.ux4_browser.outputs.phase || 'pre-browser' }}
          path: |
            artifacts/s4-a6-ux4-semantic-surface-fuzz-10k.json
            artifacts/s4-a6-ux4-uiux-mount-fuzz-100k.json
            artifacts/s4-a6-ux4-ontology-uiux-fuzz-100k.json
            artifacts/browser-s4-a6-ux4-semantic-surface*.json
            artifacts/convergence-authority-*.json
          if-no-files-found: warn
          retention-days: 30
