name: c3-enterprise-scale-pack
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack-semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Enterprise scale pack contract
        run: node v3/c3-enterprise-scale-pack-check.mjs
      - name: One-million semantic falsification trials
        run: node v3/c3-enterprise-scale-pack-mutation-1m.mjs
