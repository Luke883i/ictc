name: c3-enterprise-scale-pack
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack-semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Enterprise scale pack contract
        run: node v3/c3-enterprise-scale-pack-check.mjs
      - name: One-million semantic falsification trials
        run: node v3/c3-enterprise-scale-pack-mutation-1m.mjs
