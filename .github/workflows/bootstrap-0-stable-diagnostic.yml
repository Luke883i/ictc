name: bootstrap-0-stable-diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: bootstrap-0-stable-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stable-sequence:
    name: stable-sequence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      semantic_failed_gate: ${{ steps.current_semantic.outputs.failed_check }}
      semantic_outcome: ${{ steps.current_semantic.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: predecessor / enterprise manifest
        run: node v3/enterprise-gate-manifest-check.mjs
      - name: predecessor / convergence authority
        run: node v3/convergence-authority-check.mjs
      - name: stable prefix / syntax
        run: node scripts/syntax-check.mjs
      - name: stable prefix / bootstrap contract
        run: node v3/bootstrap-contract-check.mjs
      - name: stable 01 / release contract
        run: node v3/v1-stable-release-contract-check.mjs
      - name: stable 02 / ui contract
        run: node v3/v1-stable-ui-contract-check.mjs
      - name: stable 03 / visual epistemic runtime
        run: node v3/visual-epistemic-runtime-check.mjs
      - name: stable 04 / visual epistemic saturation
        run: node v3/visual-epistemic-runtime-saturation.mjs
      - name: stable 05 / finetuning intent coverage
        run: node v3/procedure-finetuning-intent-coverage-check.mjs
      - name: stable 06 / finetuning check
        run: node v3/procedure-finetuning-check.mjs
      - name: stable 07 / compliance onto epistemic
        run: node v3/procedure-compliance-onto-epistemic-check.mjs
      - name: stable 08 / finetuning saturation
        run: node v3/procedure-finetuning-saturation.mjs
      - name: stable 09 / compliance onto saturation
        run: node v3/procedure-compliance-onto-epistemic-saturation.mjs
      - name: stable 10 / executive harmonization
        run: node v3/procedure-executive-harmonization-check.mjs
      - name: stable 11 / executive harmonization saturation
        run: node v3/procedure-executive-harmonization-saturation.mjs
      - name: stable 12 / demo procedure ontology
        run: node v3/demo-procedure-ontology-check.mjs
      - name: stable 13 / demo operating year
        run: node v3/demo-operating-year-check.mjs
      - name: stable 14 / demo operating year saturation
        run: node v3/demo-operating-year-saturation.mjs
      - name: stable 15 / ui ux finetuning
        run: node v3/procedure-ui-ux-finetuning-check-1-6-1.mjs
      - name: stable 16 / ui ux finetuning saturation
        run: node v3/procedure-ui-ux-finetuning-saturation.mjs
      - name: stable 17 / intent convergence
        run: node v3/procedure-intent-convergence-check.mjs
      - name: stable 18 / rn contribution boundary
        run: node v3/rn-contribution-boundary-check.mjs
      - name: stable 19 / intent convergence saturation
        run: node v3/procedure-intent-convergence-saturation.mjs
      - name: stable 20 / experience saturation
        run: node v3/v1-stable-experience-saturation.mjs
      - name: stable 21 / process hardening
        run: node v3/v1-stable-process-hardening-check.mjs
      - name: current semantic
        id: current_semantic
        continue-on-error: true
        run: node v3/current-semantic-3-2.mjs
      - name: current runtime
        if: steps.current_semantic.outcome == 'success'
        run: npm run test:current:runtime
      - name: propagate semantic failure
        if: steps.current_semantic.outcome == 'failure'
        run: exit 1
  semantic-failure-report:
    needs: stable-sequence
    if: always() && needs.stable-sequence.outputs.semantic_failed_gate != ''
    name: semantic-failure / ${{ needs.stable-sequence.outputs.semantic_failed_gate }}
    runs-on: ubuntu-24.04
    steps:
      - run: exit 1
