name: runtime-enterprise-boundaries
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-enterprise-boundaries-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boundary-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Enterprise boundary DoD contract
        run: node v3/runtime-enterprise-dod-check.mjs
      - name: Enterprise boundary runtime falsifier
        run: node v3/runtime-enterprise-boundaries-check.mjs
  hostile-saturation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: One-million tenant security and lifecycle scenarios
        run: node v3/runtime-enterprise-boundaries-saturation.mjs
      - name: Existing current semantic suite
        run: npm run test:current:semantic
      - name: Existing current runtime suite
        run: npm run test:current:runtime
