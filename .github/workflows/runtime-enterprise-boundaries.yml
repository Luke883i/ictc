name: runtime-enterprise-boundaries
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-enterprise-boundaries-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boundary-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Enterprise boundary DoD contract
        run: node v3/runtime-enterprise-dod-check.mjs
      - name: Security hardening DoD contract
        run: node v3/security-enterprise-dod-check.mjs
      - name: Tenant identity coherence
        run: node v3/tenant-identity-coherence-check.mjs
      - name: Tenant-bound scanner trust
        run: node v3/attachment-scanner-tenant-check.mjs
      - name: CSV export injection boundary
        run: node v3/csv-export-security-check.mjs
      - name: AI network policy boundary
        run: node v3/ai-network-policy-check.mjs
      - name: Enterprise boundary runtime falsifier
        run: node v3/runtime-enterprise-boundaries-ci.mjs
  hostile-saturation:
    runs-on: ubuntu-24.04
    outputs:
      semantic_failed_gate: ${{ steps.current_semantic.outputs.failed_check }}
      semantic_outcome: ${{ steps.current_semantic.outcome }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Existing one-million tenant security and lifecycle scenarios
        run: node v3/runtime-enterprise-boundaries-saturation.mjs
      - name: M plus 10000 attack saturation and holdout mutations
        run: node v3/security-attack-saturation.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: security-attack-saturation
          path: artifacts/security-attack-saturation.json
          if-no-files-found: error
          retention-days: 30
      - name: Existing current semantic suite
        id: current_semantic
        continue-on-error: true
        run: npm run test:current:semantic
      - name: Evidence runtime diagnostic
        if: steps.current_semantic.outcome == 'success'
        run: node v3/evidence-runtime-diagnostic.mjs
      - name: Existing current runtime suite
        if: steps.current_semantic.outcome == 'success'
        run: npm run test:current:runtime
      - name: Propagate semantic failure
        if: steps.current_semantic.outcome == 'failure'
        run: exit 1

  hostile-semantic-failure-report:
    needs: hostile-saturation
    if: always() && needs.hostile-saturation.outputs.semantic_failed_gate != ''
    name: hostile-semantic-failure / ${{ needs.hostile-saturation.outputs.semantic_failed_gate }}
    runs-on: ubuntu-24.04
    steps:
      - run: exit 1
