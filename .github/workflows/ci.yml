name: ictc-ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: npm run check && python3 -m py_compile v3/browser-v1-2-market-candidate.py
      - name: Current product and runtime contracts
        run: node v3/v1-2-market-candidate-check.mjs && node v3/product-contract-check.mjs && node v3/procedure-contracts-check.mjs && node v3/procedure-policy-check.mjs
      - name: Semantic authority ratchet
        run: node v3/ui-active-experience-audit.mjs && node v3/semantic-api-contract-check.mjs && node v3/historical-ui-fixture-check.mjs
      - name: Process kernel and GRC capability regression
        run: node v3/process-kernel-check.mjs && node v3/v2-grc-convergence-check.mjs && node v3/v2-grc-saturation.mjs && node v3/grc-object-check.mjs && node v3/grc-mapping-check.mjs && node v3/grc-action-check.mjs && node v3/grc-risk-check.mjs && node v3/grc-assurance-check.mjs
      - name: Current procedure primitives
        run: node v3/standard-library-check.mjs && node v3/monitoring-access-check.mjs && node v3/incident-contract-check.mjs && node v3/object-identity-check.mjs && node v3/procedure-summary-check.mjs
      - name: Current process semantic hardening
        run: node v3/v1-stable-process-hardening-check.mjs && node v3/reference-contract-check.mjs && node v3/reference-integration-check.mjs && node v3/ao-reattestation-check.mjs && node v3/rn-requirement-identity-check.mjs && node v3/dependency-review-check.mjs && node v3/onto-epistemic-audit.mjs
      - name: Current semantic convergence
        run: node v3/procedure-market-saturation.mjs && node v3/v4-stable-real-saturation.mjs
      - name: Security boundaries
        run: node v3/security-boundary-check.mjs && node v3/ai-network-policy-check.mjs && node v3/hardening-saturation.mjs
      - name: Honest enterprise posture
        run: node v3/enterprise-readiness-check.mjs && node v3/enterprise-convergence-check.mjs
      - name: Enterprise T assurance
        run: node v3/enterprise-t-saturation.mjs && node v3/enterprise-invariant-convergence.mjs && node v3/enterprise-t-audit.mjs && node v3/enterprise-falsification-check.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-contract-audit
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30

  runtime-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Procedure policy and market primitives
        run: node v3/procedure-policy-check.mjs && node v3/standard-library-check.mjs && node v3/monitoring-access-check.mjs && node v3/incident-contract-check.mjs && node v3/object-identity-check.mjs && node v3/procedure-summary-check.mjs
      - name: FI-01 reference binding
        run: node v3/fi01-reference-check.mjs
      - name: Home next action binding
        run: node v3/home-next-action-check.mjs
      - name: Evidence and persistence
        run: node v3/evidence-check.mjs && node v3/evidence-export-auth-check.mjs
      - name: GRC and process runtime
        run: node v3/v2-grc-runtime-check.mjs && node v3/work-orchestration-runtime-check.mjs && node v3/insight-runtime-check.mjs
      - name: Attachment replay safety
        run: node v3/attachment-replay-check.mjs
      - name: Enterprise administration and identity
        run: node v3/enterprise-runtime-check.mjs && node v3/identity-bridge-runtime-check.mjs
      - name: Historical runtime capability regressions
        run: node v3/stable-1-4-runtime-check.mjs && node v3/standard-proof-1-6-runtime-check.mjs && node v3/enterprise-1-8-runtime-check.mjs && node v3/v15-e2e.mjs && node v3/v15-runtime-saturation.mjs
      - name: Enterprise T runtime stress
        run: node v3/enterprise-t-runtime-stress.mjs
      - name: Persistence and governance
        run: node v3/v4-stable-governance-check.mjs && node v3/v4-stable-persistence-check.mjs && node v3/store-durability-check.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-runtime-evidence
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30

  browser-journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Browser check syntax
        run: python -m py_compile v3/browser-v1-2-market-candidate.py
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          if [[ -z "$browser" || ! -x "$browser" ]]; then echo 'No supported system Chromium browser found on the runner' >&2; exit 1; fi
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Canonical 1.2 market candidate journey
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONUNBUFFERED=1 ICTC_NO_OPEN=1 ICTC_PORT=4807 PORT=4807
          export ICTC_BASE_URL="http://127.0.0.1:4807"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-browser-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-browser-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          trap './ictc.sh stop --profile current || true' EXIT
          python -u v3/browser-v1-2-market-candidate.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-browser-evidence
          path: |
            artifacts/browser-v1-2*.json
            artifacts/ux-v12-*.png
          if-no-files-found: warn
          retention-days: 30

  launcher-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Canonical launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4807 ICTC_STATE_DIR="$RUNNER_TEMP/state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/runtime"
          trap './ictc.sh stop --profile current || true' EXIT
          ./ictc.sh start --profile current --no-open
          curl -fsS http://127.0.0.1:4807/api/health
          ./ictc.sh status --profile current
