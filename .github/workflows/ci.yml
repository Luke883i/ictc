name: ictc-ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: npm run check
      - name: Product contract
        run: node v3/product-contract-check.mjs
      - name: Question and UI contracts
        run: node v3/question-audit-check.mjs && node v3/ui-contract-check.mjs
      - name: Onto-epistemic and journey audits
        run: node v3/onto-epistemic-audit.mjs && node v3/user-journey-audit.mjs
      - name: Experience saturation
        run: node v3/experience-saturation.mjs
      - name: Security boundaries
        run: node v3/security-boundary-check.mjs && node v3/ai-network-policy-check.mjs && node v3/hardening-saturation.mjs
      - name: Honest enterprise posture and M plus 100
        run: node v3/enterprise-readiness-check.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-contract-audit
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30

  runtime-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Evidence and persistence
        run: node v3/evidence-check.mjs
      - name: Attachment replay safety
        run: node v3/attachment-replay-check.mjs
      - name: Enterprise administration
        run: node v3/enterprise-runtime-check.mjs
      - name: End-to-end journeys
        run: node v3/v15-e2e.mjs
      - name: Runtime saturation
        run: node v3/v15-runtime-saturation.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-runtime-evidence
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30

  browser-journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              browser="$(command -v "$candidate")"
              break
            fi
          done
          if [[ -z "$browser" || ! -x "$browser" ]]; then
            echo 'No supported system Chromium browser found on the runner' >&2
            exit 1
          fi
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Live browser journeys
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONUNBUFFERED=1
          export ICTC_NO_OPEN=1 ICTC_PORT=4807 PORT=4807
          export ICTC_BASE_URL="http://127.0.0.1:4807" ICTC_MOCK_URL="http://127.0.0.1:4899"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-browser-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-browser-runtime"
          export ICTC_ALLOW_PRIVATE_AI=1 ICTC_LLM_API_KEY="test-key" ICTC_SCHEDULER_TICK_MS=100000

          terminate_group() {
            local pid="$1"
            kill -TERM -- "-$pid" 2>/dev/null || true
            sleep 1
            kill -KILL -- "-$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }

          run_browser_journey() {
            local label="$1"
            local script="$2"
            local artifact="$3"
            local budget="$4"
            local elapsed=0
            local teardown_elapsed=0
            local pid state status

            rm -f "$artifact"
            echo "::group::$label"
            setsid python -u "$script" &
            pid=$!

            while true; do
              state="$(ps -o stat= -p "$pid" 2>/dev/null | tr -d ' ' || true)"
              if [[ -z "$state" || "$state" == Z* ]]; then
                set +e
                wait "$pid"
                status=$?
                set -e
                if (( status != 0 )); then
                  echo "::endgroup::"
                  return "$status"
                fi
                if [[ ! -s "$artifact" ]]; then
                  echo "$label: processo concluso senza artifact $artifact" >&2
                  echo "::endgroup::"
                  return 1
                fi
                echo "::endgroup::"
                return 0
              fi

              if [[ -s "$artifact" ]]; then
                if (( teardown_elapsed == 0 )); then
                  echo "$label: asserzioni attestate; teardown con budget 10s"
                fi
                teardown_elapsed=$((teardown_elapsed + 1))
                if (( teardown_elapsed >= 10 )); then
                  echo "$label: teardown Playwright forzato entro il budget"
                  terminate_group "$pid"
                  echo "::endgroup::"
                  return 0
                fi
              fi

              if (( elapsed >= budget )); then
                echo "$label: nessun artifact entro ${budget}s" >&2
                terminate_group "$pid"
                echo "::endgroup::"
                return 124
              fi

              sleep 1
              elapsed=$((elapsed + 1))
            done
          }

          node v3/mock-ai-provider.mjs >"$RUNNER_TEMP/ictc-mock.log" 2>&1 &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true; ./ictc.sh stop --profile current || true' EXIT
          for _ in $(seq 1 50); do curl -fsS http://127.0.0.1:4899 >/dev/null 2>&1 && break; sleep .1; done
          ./ictc.sh start --profile current --no-open
          run_browser_journey 'Product browser journey' v3/browser-check.py artifacts/browser-check.json 180
          run_browser_journey 'Administration browser journey' v3/browser-admin-check.py artifacts/browser-admin-check.json 120
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-browser-evidence
          path: |
            artifacts/browser-check.json
            artifacts/browser-admin-check.json
            artifacts/*.png
          if-no-files-found: warn
          retention-days: 30

  launcher-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Canonical launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4807 ICTC_STATE_DIR="$RUNNER_TEMP/state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/runtime"
          trap './ictc.sh stop --profile current || true' EXIT
          ./ictc.sh start --profile current --no-open
          curl -fsS http://127.0.0.1:4807/api/health
          ./ictc.sh status --profile current
