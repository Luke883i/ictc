name: ictc-ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Current semantic release suite
        run: npm run test:current:semantic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v6
        if: always()
        with:
          name: ictc-contract-audit
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30
  runtime-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Current runtime release suite
        run: npm run test:current:runtime
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v6
        if: always()
        with:
          name: ictc-runtime-evidence
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30
  browser-journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Browser check syntax
        run: python -m py_compile v3/browser-v1-9-experience.py v3/browser-v2-epistemic.py v3/browser-ui-epistemic-convergence.py v3/browser-v2-1-procedure-journey.py v3/browser-convergent-kernel.py v3/browser-pr60-polish.py v3/browser-onto-compliance-v1.py v3/browser-procedure-finetuning-1-4.py v3/browser-procedure-finetuning-1-4-base.py v3/browser-procedure-executive-harmonization-1-5.py v3/browser-procedure-ui-ux-1-6.py v3/browser-information-value.py v3/browser-risk-drilldown.py v3/browser-ao-activation.py
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          if [[ -z "$browser" || ! -x "$browser" ]]; then echo 'No supported system Chromium browser found on the runner' >&2; exit 1; fi
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Canonical Experience + Epistemic + Procedure Journey + Onto-Compliance
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONUNBUFFERED=1 ICTC_NO_OPEN=1 ICTC_PORT=4807 PORT=4807
          export ICTC_BASE_URL="http://127.0.0.1:4807"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-browser-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-browser-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          trap './ictc.sh stop --profile current || true' EXIT
          post_browser_failure() {
            local script="$1" slug payload
            slug=$(basename "$script" .py | tr -cs 'A-Za-z0-9._-' '-')
            payload=$(printf '{"state":"failure","context":"ictc/browser-failure/%s","description":"failed browser script: %s"}' "$slug" "$script")
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -d "$payload" >/dev/null
          }
          run_browser() {
            local script="$1"
            echo "browser-journeys:start $script"
            if python -u "$script"; then echo "browser-journeys:pass $script"; return 0; fi
            post_browser_failure "$script"
            FAILED_BROWSER_SCRIPT="$script" node scripts/browser-failure-provenance.mjs || true
            return 1
          }
          for script in \
            v3/browser-v1-9-experience.py \
            v3/browser-v2-epistemic.py \
            v3/browser-ui-epistemic-convergence.py \
            v3/browser-v2-1-procedure-journey.py \
            v3/browser-pr60-polish.py \
            v3/browser-onto-compliance-v1.py \
            v3/browser-procedure-finetuning-1-4.py \
            v3/browser-procedure-ui-ux-1-6.py \
            v3/browser-information-value.py \
            v3/browser-risk-drilldown.py \
            v3/browser-ao-activation.py; do
            run_browser "$script"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v6
        if: always()
        with:
          name: ictc-browser-evidence
          path: |
            artifacts/browser-v1-9*.json
            artifacts/browser-v2-epistemic*.json
            artifacts/browser-ui-epistemic-convergence*.json
            artifacts/browser-v2-1*.json
            artifacts/browser-pr60*.json
            artifacts/browser-onto-compliance*.json
            artifacts/browser-procedure-finetuning-1-4*.json
            artifacts/browser-procedure-ui-ux-1-6*.json
            artifacts/browser-information-value*.json
            artifacts/browser-risk-drilldown*.json
            artifacts/browser-ao-activation*.json
            artifacts/ux-v19-*.png
            artifacts/ux-v20-*.png
            artifacts/ux-ui-epistemic-*.png
            artifacts/ux-v21-*.png
            artifacts/ux-pr60-*.png
            artifacts/ux-och-v1-*.png
            artifacts/ux-finetune-*.png
            artifacts/information-value-*.png
          if-no-files-found: warn
          retention-days: 30
  epistemic-professional-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Professional demo browser syntax
        run: python -m py_compile v3/browser-epistemic-professional-demo.py
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          if [[ -z "$browser" || ! -x "$browser" ]]; then echo 'No supported system Chromium browser found on the runner' >&2; exit 1; fi
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Materialize canonical DEMO runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=47561 PORT=47561
          export ICTC_BASE_URL="http://127.0.0.1:47561"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-epistemic-demo-state"
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-epistemic-demo-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          export ICTC_DEMO_STARTUP_ATTEMPTS=900
          ./ictc.sh demo --profile current --no-open
          ./ictc.sh status --profile current
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
          echo "ICTC_STATE_DIR=$ICTC_STATE_DIR" >> "$GITHUB_ENV"
          echo "ICTC_RUNTIME_DIR=$ICTC_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Isolated server-backed EP-01 professional DEMO matrix
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          trap './ictc.sh stop --profile current || true' EXIT
          export PYTHONUNBUFFERED=1 ICTC_NO_OPEN=1 ICTC_PORT=47561 PORT=47561 ICTC_SCHEDULER_TICK_MS=100000
          status=0
          python -u v3/browser-epistemic-professional-demo.py || status=$?
          cp "$ICTC_STATE_DIR/logs/ictc.log" artifacts/browser-epistemic-professional-demo-server.log || true
          if [[ "$status" -ne 0 ]]; then
            FAILED_BROWSER_SCRIPT='v3/browser-epistemic-professional-demo.py' node scripts/browser-failure-provenance.mjs || true
            exit "$status"
          fi
      - name: Stop DEMO runtime
        if: always()
        shell: bash
        run: ./ictc.sh stop --profile current || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v6
        if: always()
        with:
          name: ictc-epistemic-professional-browser-evidence
          path: |
            artifacts/browser-epistemic-professional-demo*.json
            artifacts/browser-epistemic-professional-demo-server.log
            artifacts/epistemic-*.png
          if-no-files-found: warn
          retention-days: 30
  launcher-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Canonical launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4807 ICTC_STATE_DIR="$RUNNER_TEMP/state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/runtime"
          trap './ictc.sh stop --profile current || true' EXIT
          ./ictc.sh start --profile current --no-open
          curl -fsS http://127.0.0.1:4807/api/health
          ./ictc.sh status --profile current
  ci-verdict:
    if: always()
    needs: [contract-and-audit, runtime-e2e, browser-journeys, epistemic-professional-browser, launcher-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CONTRACT_RESULT: ${{ needs['contract-and-audit'].result }}
      RUNTIME_RESULT: ${{ needs['runtime-e2e'].result }}
      BROWSER_RESULT: ${{ needs['browser-journeys'].result }}
      PROFESSIONAL_RESULT: ${{ needs['epistemic-professional-browser'].result }}
      LAUNCHER_RESULT: ${{ needs['launcher-smoke'].result }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish exact-head CI verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          post_status() {
            local context="$1" result="$2" state='failure'
            [[ "$result" == 'success' ]] && state='success'
            local payload
            payload=$(printf '{"state":"%s","context":"%s","description":"job result: %s"}' "$state" "$context" "$result")
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -d "$payload" >/dev/null
            [[ "$state" == 'success' ]]
          }
          overall='success'
          post_status 'ictc/contract-and-audit' "$CONTRACT_RESULT" || overall='failure'
          post_status 'ictc/runtime-e2e' "$RUNTIME_RESULT" || overall='failure'
          post_status 'ictc/browser-journeys' "$BROWSER_RESULT" || overall='failure'
          post_status 'ictc/epistemic-professional-browser' "$PROFESSIONAL_RESULT" || overall='failure'
          post_status 'ictc/launcher-smoke' "$LAUNCHER_RESULT" || overall='failure'
          post_status 'ictc/exact-head-ci' "$overall" || true
          [[ "$overall" == 'success' ]]
