name: ictc-ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: npm run check
      - name: Product contract
        run: node v3/product-contract-check.mjs
      - name: Question and UI contracts
        run: node v3/question-audit-check.mjs && node v3/ui-contract-check.mjs && node v3/user-journey-2-check.mjs
      - name: ICTC 1.7 Enterprise Clarity assurance
        run: node v3/reborn-3-check.mjs && node v3/reborn-3-saturation.mjs && node v3/stable-1-4-check.mjs && node v3/stable-1-4-saturation.mjs && node v3/standard-proof-1-6-check.mjs && node v3/standard-proof-1-6-saturation.mjs && node v3/standard-proof-1-6-compression.mjs && node v3/enterprise-1-7-check.mjs && node v3/enterprise-1-7-saturation.mjs
      - name: Onto-epistemic and journey audits
        run: node v3/onto-epistemic-audit.mjs && node v3/user-journey-audit.mjs
      - name: Experience saturation
        run: node v3/experience-saturation.mjs && node v3/user-journey-2-saturation.mjs
      - name: Security boundaries
        run: node v3/security-boundary-check.mjs && node v3/ai-network-policy-check.mjs && node v3/hardening-saturation.mjs
      - name: Honest enterprise posture and M plus 100
        run: node v3/enterprise-readiness-check.mjs && node v3/enterprise-convergence-check.mjs
      - name: Enterprise T assurance
        run: node v3/enterprise-t-saturation.mjs && node v3/enterprise-invariant-convergence.mjs && node v3/enterprise-t-audit.mjs && node v3/enterprise-falsification-check.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-contract-audit
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30

  runtime-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Evidence and persistence
        run: node v3/evidence-check.mjs
      - name: Attachment replay safety
        run: node v3/attachment-replay-check.mjs
      - name: Enterprise administration
        run: node v3/enterprise-runtime-check.mjs
      - name: Stable authority projection
        run: node v3/stable-1-4-runtime-check.mjs
      - name: Standard Proof projection
        run: node v3/standard-proof-1-6-runtime-check.mjs
      - name: End-to-end journeys
        run: node v3/v15-e2e.mjs
      - name: Runtime saturation
        run: node v3/v15-runtime-saturation.mjs
      - name: Enterprise T runtime stress
        run: node v3/enterprise-t-runtime-stress.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-runtime-evidence
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30

  browser-journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Browser check syntax
        run: python -m py_compile v3/browser-product-check.py v3/browser-check.py v3/browser-admin-check.py v3/browser-auditor-check.py v3/browser-stable-1-4-check.py v3/browser-enterprise-1-7-check.py
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          if [[ -z "$browser" || ! -x "$browser" ]]; then echo 'No supported system Chromium browser found on the runner' >&2; exit 1; fi
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Live browser journeys
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONUNBUFFERED=1
          export ICTC_NO_OPEN=1 ICTC_PORT=4807 PORT=4807
          export ICTC_BASE_URL="http://127.0.0.1:4807" ICTC_MOCK_URL="http://127.0.0.1:4899"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-browser-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-browser-runtime"
          export ICTC_ALLOW_PRIVATE_AI=1 ICTC_LLM_API_KEY="test-key" ICTC_SCHEDULER_TICK_MS=100000
          terminate_group(){ local pid="$1"; kill -TERM -- "-$pid" 2>/dev/null || true; sleep 1; kill -KILL -- "-$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          run_browser_journey(){
            local label="$1" script="$2" artifact="$3" budget="$4" elapsed=0 pid state status
            rm -f "$artifact"; echo "::group::$label"; setsid python -u "$script" & pid=$!
            while true; do
              if [[ -s "$artifact" ]]; then echo "$label: assertions attested; process group terminated"; terminate_group "$pid"; echo "::endgroup::"; return 0; fi
              state="$(ps -o stat= -p "$pid" 2>/dev/null | tr -d ' ' || true)"
              if [[ -z "$state" || "$state" == Z* ]]; then set +e; wait "$pid"; status=$?; set -e; if (( status != 0 )); then echo "::endgroup::"; return "$status"; fi; echo "$label: process completed without artifact $artifact" >&2; echo "::endgroup::"; return 1; fi
              if (( elapsed >= budget )); then echo "$label: no artifact within ${budget}s" >&2; terminate_group "$pid"; echo "::endgroup::"; return 124; fi
              sleep 1; elapsed=$((elapsed + 1))
            done
          }
          node v3/mock-ai-provider.mjs >"$RUNNER_TEMP/ictc-mock.log" 2>&1 &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true; ./ictc.sh stop --profile current || true' EXIT
          for _ in $(seq 1 50); do curl -fsS http://127.0.0.1:4899 >/dev/null 2>&1 && break; sleep .1; done
          ./ictc.sh start --profile current --no-open
          run_browser_journey 'Product browser journey' v3/browser-product-check.py artifacts/browser-check.json 180
          run_browser_journey 'Administration browser journey' v3/browser-admin-check.py artifacts/browser-admin-check.json 90
          run_browser_journey 'Auditor browser journey' v3/browser-auditor-check.py artifacts/browser-auditor-check.json 60
          run_browser_journey 'ICTC 1.4 stable browser journey' v3/browser-stable-1-4-check.py artifacts/browser-stable-1-4-check.json 60
          run_browser_journey 'ICTC 1.7 Enterprise Clarity browser journey' v3/browser-enterprise-1-7-check.py artifacts/browser-enterprise-1-7-check.json 120
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-browser-evidence
          path: |
            artifacts/browser-check.json
            artifacts/browser-admin-check.json
            artifacts/browser-auditor-check.json
            artifacts/browser-stable-1-4-check.json
            artifacts/browser-enterprise-1-7-check.json
            artifacts/browser-*-error.json
            artifacts/*.png
          if-no-files-found: warn
          retention-days: 30

  launcher-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Canonical launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4807 ICTC_STATE_DIR="$RUNNER_TEMP/state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/runtime"
          trap './ictc.sh stop --profile current || true' EXIT
          ./ictc.sh start --profile current --no-open
          curl -fsS http://127.0.0.1:4807/api/health
          ./ictc.sh status --profile current
