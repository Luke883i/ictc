name: ictc
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Launcher smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1
          export ICTC_PORT=4807
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-state"
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-runtime"
          ./ictc.sh start --profile current --no-open
          trap './ictc.sh stop --profile current || true' EXIT
          curl -fsS http://127.0.0.1:4807/api/health
          ./ictc.sh status --profile current
          ./ictc.sh stop --profile current
          trap - EXIT
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-audit
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 30
