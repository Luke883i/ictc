name: ictc-ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Current semantic release suite
        run: npm run test:current:semantic
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: ictc-contract-audit
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30

  runtime-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Current runtime release suite
        run: npm run test:current:runtime
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: ictc-runtime-evidence
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30

  browser-journeys:
    name: browser / ${{ matrix.script }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {id: v1-9-experience, script: v3/browser-v1-9-experience.py}
          - {id: v2-epistemic, script: v3/browser-v2-epistemic.py}
          - {id: ui-epistemic-convergence, script: v3/browser-ui-epistemic-convergence.py}
          - {id: v2-1-procedure-journey, script: v3/browser-v2-1-procedure-journey.py}
          - {id: pr60-polish, script: v3/browser-pr60-polish.py}
          - {id: onto-compliance-v1, script: v3/browser-onto-compliance-v1.py}
          - {id: procedure-finetuning-1-4, script: v3/browser-procedure-finetuning-1-4.py}
          - {id: procedure-ui-ux-1-6, script: v3/browser-procedure-ui-ux-1-6.py}
          - {id: risk-drilldown, script: v3/browser-risk-drilldown.py}
          - {id: ao-activation, script: v3/browser-ao-activation.py}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Browser check syntax
        run: python -m py_compile "${{ matrix.script }}"
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          if [[ -z "$browser" || ! -x "$browser" ]]; then echo 'No supported system Chromium browser found on the runner' >&2; exit 1; fi
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Run isolated browser journey
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONUNBUFFERED=1 ICTC_NO_OPEN=1 ICTC_PORT=4807 PORT=4807
          export ICTC_BASE_URL="http://127.0.0.1:4807"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-browser-${{ matrix.id }}-state"
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-browser-${{ matrix.id }}-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          trap './ictc.sh stop --profile current || true' EXIT
          status=0
          python -u "${{ matrix.script }}" || status=$?
          if [[ "$status" -ne 0 ]]; then
            FAILED_BROWSER_SCRIPT="${{ matrix.script }}" node scripts/browser-failure-provenance.mjs || true
            exit "$status"
          fi
      - name: Diagnostic phase / v2.1 rc-submit-http
        if: ${{ always() && matrix.id == 'v2-1-procedure-journey' }}
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('artifacts/browser-v2-1-procedure-journey-error.json')
          if not p.exists(): sys.exit(0)
          phase=json.loads(p.read_text()).get('phase','')
          sys.exit(1 if phase.startswith('RC-01-submit-http-') else 0)
          PY
      - name: Diagnostic phase / v2.1 rc-submit-revision
        if: ${{ always() && matrix.id == 'v2-1-procedure-journey' }}
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('artifacts/browser-v2-1-procedure-journey-error.json')
          if not p.exists(): sys.exit(0)
          phase=json.loads(p.read_text()).get('phase','')
          sys.exit(1 if phase=='RC-01-submit-revision' else 0)
          PY
      - name: Diagnostic phase / v2.1 rc-local-projection
        if: ${{ always() && matrix.id == 'v2-1-procedure-journey' }}
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('artifacts/browser-v2-1-procedure-journey-error.json')
          if not p.exists(): sys.exit(0)
          phase=json.loads(p.read_text()).get('phase','')
          sys.exit(1 if phase=='RC-01-local-projection' else 0)
          PY
      - name: Diagnostic phase / v2.1 post-risk
        if: ${{ always() && matrix.id == 'v2-1-procedure-journey' }}
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('artifacts/browser-v2-1-procedure-journey-error.json')
          if not p.exists(): sys.exit(0)
          phase=json.loads(p.read_text()).get('phase','')
          post=('AR-01','home-projection','epistemic-','same-digest','history-transition','mobile','reduced-motion')
          sys.exit(1 if phase.startswith(post) else 0)
          PY
      - name: Diagnostic phase / pr60 proof-init
        if: ${{ always() && matrix.id == 'pr60-polish' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('artifacts/browser-pr60-polish-error.json')
          if not p.exists(): sys.exit(0)
          phase=json.loads(p.read_text()).get('phase','')
          sys.exit(1 if phase in {'evidence-meaning-first','evidence-render-idempotence'} else 0)
          PY
      - name: Diagnostic phase / pr60 refresh-keyboard
        if: ${{ always() && matrix.id == 'pr60-polish' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('artifacts/browser-pr60-polish-error.json')
          if not p.exists(): sys.exit(0)
          phase=json.loads(p.read_text()).get('phase','')
          sys.exit(1 if phase in {'evidence-refresh-ownership','evidence-keyboard-disclosure'} else 0)
          PY
      - name: Diagnostic phase / pr60 rn-seed-download
        if: ${{ always() && matrix.id == 'pr60-polish' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('artifacts/browser-pr60-polish-error.json')
          if not p.exists(): sys.exit(0)
          phase=json.loads(p.read_text()).get('phase','')
          sys.exit(1 if phase in {'evidence-download-disclosure','evidence-downloads','evidence-seed-open-scheduler','evidence-seed-monitoring-form','evidence-seed-submit','evidence-seed-materialized'} or phase.startswith('evidence-downloads-') else 0)
          PY
      - name: Diagnostic phase / pr60 escape-mobile
        if: ${{ always() && matrix.id == 'pr60-polish' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('artifacts/browser-pr60-polish-error.json')
          if not p.exists(): sys.exit(0)
          phase=json.loads(p.read_text()).get('phase','')
          sys.exit(1 if phase in {'evidence-escape','mobile-evidence'} else 0)
          PY
      - name: Diagnostic phase / onto home-shell
        if: ${{ always() && matrix.id == 'onto-compliance-v1' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('artifacts/browser-onto-compliance-v1-error.json')
          if not p.exists(): sys.exit(0)
          d=json.loads(p.read_text()); phase=d.get('phase',''); kinds={x.get('kind') for x in d.get('anomalies',[])}
          sys.exit(1 if phase.endswith('-bootstrap') or {'home-page-scroll','home-scroll-clipped','ai-status-truth','top-navigation-language'} & kinds else 0)
          PY
      - name: Diagnostic phase / onto procedure
        if: ${{ always() && matrix.id == 'onto-compliance-v1' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('artifacts/browser-onto-compliance-v1-error.json')
          if not p.exists(): sys.exit(0)
          d=json.loads(p.read_text()); phase=d.get('phase',''); kinds={x.get('kind') for x in d.get('anomalies',[])}
          proc=any(code in phase for code in ['RN-01','EC-01','AO-01','MC-01','AP-01','RC-01','AR-01'])
          proc_kinds={'editorial-order-prefix','editorial-owned-block-missing','editorial-owned-block-order','technical-trace-not-visible','context-not-after-native-work','claim-boundary-not-present-in-process-trace','rn-missing-reason-placeholder','rn-source-state-rail','ec-title-ellipsis'}
          sys.exit(1 if proc or proc_kinds & kinds else 0)
          PY
      - name: Diagnostic phase / onto proof-ep
        if: ${{ always() && matrix.id == 'onto-compliance-v1' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('artifacts/browser-onto-compliance-v1-error.json')
          if not p.exists(): sys.exit(0)
          d=json.loads(p.read_text()); phase=d.get('phase','')
          sys.exit(1 if phase.endswith('-proof') or 'EP-01' in phase or phase=='aggregate-verdict' else 0)
          PY
      - name: Diagnostic exact / pr60 open-scheduler
        if: ${{ always() && matrix.id == 'pr60-polish' }}
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('artifacts/browser-pr60-polish-error.json')
          if not p.exists(): sys.exit(0)
          sys.exit(1 if json.loads(p.read_text()).get('phase')=='evidence-seed-open-scheduler' else 0)
          PY
      - name: Diagnostic exact / pr60 monitoring-form
        if: ${{ always() && matrix.id == 'pr60-polish' }}
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('artifacts/browser-pr60-polish-error.json')
          if not p.exists(): sys.exit(0)
          sys.exit(1 if json.loads(p.read_text()).get('phase')=='evidence-seed-monitoring-form' else 0)
          PY
      - name: Diagnostic exact / pr60 submit
        if: ${{ always() && matrix.id == 'pr60-polish' }}
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('artifacts/browser-pr60-polish-error.json')
          if not p.exists(): sys.exit(0)
          sys.exit(1 if json.loads(p.read_text()).get('phase')=='evidence-seed-submit' else 0)
          PY
      - name: Diagnostic exact / pr60 materialized
        if: ${{ always() && matrix.id == 'pr60-polish' }}
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('artifacts/browser-pr60-polish-error.json')
          if not p.exists(): sys.exit(0)
          sys.exit(1 if json.loads(p.read_text()).get('phase')=='evidence-seed-materialized' else 0)
          PY
      - name: Diagnostic exact / pr60 disclosure
        if: ${{ always() && matrix.id == 'pr60-polish' }}
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('artifacts/browser-pr60-polish-error.json')
          if not p.exists(): sys.exit(0)
          sys.exit(1 if json.loads(p.read_text()).get('phase')=='evidence-download-disclosure' else 0)
          PY
      - name: Diagnostic exact / pr60 downloads
        if: ${{ always() && matrix.id == 'pr60-polish' }}
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('artifacts/browser-pr60-polish-error.json')
          if not p.exists(): sys.exit(0)
          phase=json.loads(p.read_text()).get('phase','')
          sys.exit(1 if phase=='evidence-downloads' or phase.startswith('evidence-downloads-') else 0)
          PY
      - name: Diagnostic exact / onto home-scroll
        if: ${{ always() && matrix.id == 'onto-compliance-v1' }}
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('artifacts/browser-onto-compliance-v1-error.json')
          if not p.exists(): sys.exit(0)
          kinds={x.get('kind') for x in json.loads(p.read_text()).get('anomalies',[])}
          sys.exit(1 if 'home-page-scroll' in kinds else 0)
          PY
      - name: Diagnostic exact / onto ai-truth
        if: ${{ always() && matrix.id == 'onto-compliance-v1' }}
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('artifacts/browser-onto-compliance-v1-error.json')
          if not p.exists(): sys.exit(0)
          kinds={x.get('kind') for x in json.loads(p.read_text()).get('anomalies',[])}
          sys.exit(1 if 'ai-status-truth' in kinds else 0)
          PY
      - name: Diagnostic exact / onto shell-language-or-clipping
        if: ${{ always() && matrix.id == 'onto-compliance-v1' }}
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('artifacts/browser-onto-compliance-v1-error.json')
          if not p.exists(): sys.exit(0)
          kinds={x.get('kind') for x in json.loads(p.read_text()).get('anomalies',[])}
          sys.exit(1 if {'home-scroll-clipped','top-navigation-language'} & kinds else 0)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: ictc-browser-${{ matrix.id }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30

  epistemic-professional-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Professional demo browser syntax
        run: python -m py_compile v3/browser-epistemic-professional-demo.py
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          if [[ -z "$browser" || ! -x "$browser" ]]; then echo 'No supported system Chromium browser found on the runner' >&2; exit 1; fi
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Materialize canonical DEMO runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=47561 PORT=47561
          export ICTC_BASE_URL="http://127.0.0.1:47561"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-epistemic-demo-state"
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-epistemic-demo-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          export ICTC_DEMO_STARTUP_ATTEMPTS=900
          ./ictc.sh demo --profile current --no-open
          ./ictc.sh status --profile current
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
          echo "ICTC_STATE_DIR=$ICTC_STATE_DIR" >> "$GITHUB_ENV"
          echo "ICTC_RUNTIME_DIR=$ICTC_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Isolated server-backed EP-01 professional DEMO matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          trap './ictc.sh stop --profile current || true' EXIT
          export PYTHONUNBUFFERED=1 ICTC_NO_OPEN=1 ICTC_PORT=47561 PORT=47561 ICTC_SCHEDULER_TICK_MS=100000
          status=0
          python -u v3/browser-epistemic-professional-demo.py || status=$?
          cp "$ICTC_STATE_DIR/logs/ictc.log" artifacts/browser-epistemic-professional-demo-server.log || true
          if [[ "$status" -ne 0 ]]; then
            FAILED_BROWSER_SCRIPT='v3/browser-epistemic-professional-demo.py' node scripts/browser-failure-provenance.mjs || true
            exit "$status"
          fi
      - name: Stop DEMO runtime
        if: always()
        shell: bash
        run: ./ictc.sh stop --profile current || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: ictc-epistemic-professional-browser-evidence
          path: |
            artifacts/browser-epistemic-professional-demo*.json
            artifacts/browser-epistemic-professional-demo-server.log
            artifacts/epistemic-*.png
          if-no-files-found: warn
          retention-days: 30

  launcher-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Canonical launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4807 ICTC_STATE_DIR="$RUNNER_TEMP/state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/runtime"
          trap './ictc.sh stop --profile current || true' EXIT
          ./ictc.sh start --profile current --no-open
          curl -fsS http://127.0.0.1:4807/api/health
          ./ictc.sh status --profile current

  information-value-diagnostic:
    name: diagnostic / information-value-3-2
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Information-value syntax
        run: python -m py_compile v3/browser-information-value.py
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          if [[ -z "$browser" || ! -x "$browser" ]]; then echo 'No supported system Chromium browser found on the runner' >&2; exit 1; fi
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Run observational information-value diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONUNBUFFERED=1 ICTC_NO_OPEN=1 ICTC_PORT=4817 PORT=4817
          export ICTC_BASE_URL="http://127.0.0.1:4817"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-information-value-state"
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-information-value-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          trap './ictc.sh stop --profile current || true' EXIT
          status=0
          python -u v3/browser-information-value.py || status=$?
          if [[ "$status" -ne 0 ]]; then
            FAILED_BROWSER_SCRIPT='v3/browser-information-value.py' node scripts/browser-failure-provenance.mjs || true
            echo "Information-value remains diagnostic; required UI/product authorities are exercised by semantic, UI/UX, shell and stateful journey gates." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: ictc-information-value-diagnostic
          path: artifacts/*information-value*.json
          if-no-files-found: warn
          retention-days: 30

  ci-verdict:
    name: diagnostic / ci-verdict
    if: always()
    needs: [contract-and-audit, runtime-e2e, browser-journeys, epistemic-professional-browser, launcher-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CONTRACT_RESULT: ${{ needs['contract-and-audit'].result }}
      RUNTIME_RESULT: ${{ needs['runtime-e2e'].result }}
      BROWSER_RESULT: ${{ needs['browser-journeys'].result }}
      PROFESSIONAL_RESULT: ${{ needs['epistemic-professional-browser'].result }}
      LAUNCHER_RESULT: ${{ needs['launcher-smoke'].result }}
    steps:
      - name: Summarize canonical CI leaves
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          failed=0
          echo '## ICTC canonical CI leaf summary' >> "$GITHUB_STEP_SUMMARY"
          check_job() {
            local name="$1" result="$2"
            printf -- '- %s: `%s`\n' "$name" "$result" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$result" != 'success' ]]; then failed=1; fi
          }
          check_job 'contract-and-audit' "$CONTRACT_RESULT"
          check_job 'runtime-e2e' "$RUNTIME_RESULT"
          check_job 'browser-journeys-matrix' "$BROWSER_RESULT"
          check_job 'epistemic-professional-browser' "$PROFESSIONAL_RESULT"
          check_job 'launcher-smoke' "$LAUNCHER_RESULT"
          if [[ "$failed" -ne 0 ]]; then
            echo 'One or more canonical leaf jobs did not succeed; exact-head acceptance belongs to ictc/actions-census.' >&2
            exit 1
          fi
