name: s4-a5-browser-a11y
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: s4-a5-browser-a11y-${{ github.ref }}
  cancel-in-progress: true
jobs:
  final-dom-a11y:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - name: A5 changed-source syntax
        run: |
          node --check v3/s4-a5-final-dom-model.mjs
          node --check v3/s4-a5-browser-a11y-check.mjs
          node --check v3/s4-a5-browser-a11y-saturation.mjs
          node --check v3/s4-a5-holdout-10k.mjs
          python -m py_compile v3/browser-s4-a5-final-dom-a11y.py v3/browser-s4-a5-geometry-diagnostic.py
      - name: A5 source/user-effect contract
        run: node v3/s4-a5-browser-a11y-check.mjs
      - name: A5 source-model mutation rail
        run: node v3/s4-a5-browser-a11y-saturation.mjs
      - name: A5 10k declared-family holdout
        run: node v3/s4-a5-holdout-10k.mjs
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          if [[ -z "$browser" || ! -x "$browser" ]]; then echo 'No supported system Chromium browser found on the runner' >&2; exit 1; fi
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Start canonical current runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4865 PORT=4865
          export ICTC_BASE_URL="http://127.0.0.1:4865"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-a5-state"
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-a5-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          ./ictc.sh status --profile current
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
          echo "ICTC_STATE_DIR=$ICTC_STATE_DIR" >> "$GITHUB_ENV"
          echo "ICTC_RUNTIME_DIR=$ICTC_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: A5 geometry diagnostic
        shell: bash
        run: python -u v3/browser-s4-a5-geometry-diagnostic.py
      - name: A5 exact-head final-DOM browser and accessibility effects
        shell: bash
        run: |
          set -Eeuo pipefail
          status=0
          python -u v3/browser-s4-a5-final-dom-a11y.py || status=$?
          cp "$ICTC_STATE_DIR/logs/ictc.log" artifacts/browser-s4-a5-server.log || true
          if [[ "$status" -ne 0 ]]; then
            FAILED_BROWSER_SCRIPT='v3/browser-s4-a5-final-dom-a11y.py' node scripts/browser-failure-provenance.mjs || true
            exit "$status"
          fi
      - name: Publish A5 browser provenance
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -u
          error='artifacts/browser-s4-a5-final-dom-a11y-error.json'
          report='artifacts/browser-s4-a5-final-dom-a11y.json'
          diagnostic='artifacts/s4-a5-geometry-diagnostic.json'
          if [[ -f "$error" ]]; then
            phase="$(node -e "const p=require('./$error');process.stdout.write(String(p.phase||'unknown'))")"
            message="$(node -e "const p=require('./$error');process.stdout.write(String(p.message||'browser contract failed').replace(/[\\r\\n]+/g,' '))")"
            state=failure
            if [[ -f "$diagnostic" ]]; then
              compact="$(node -e "const p=require('./$diagnostic');process.stdout.write(String(p.compact||''))")"
              description="failure ${phase}: ${compact}"
            else
              description="failure ${phase}: ${message}"
            fi
          elif [[ -f "$report" ]]; then
            phase=complete
            state=success
            description='A5 final-DOM browser and accessibility effects green'
          else
            phase=no-artifact
            state=error
            description='A5 browser evidence artifact missing'
          fi
          target="https://github.com/${GITHUB_REPOSITORY}/blob/${HEAD_SHA}/v3/browser-s4-a5-final-dom-a11y.py?phase=${phase}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state="$state" -f context='ictc/s4-a5-browser' -f description="${description:0:140}" -f target_url="$target" >/dev/null || true
      - name: Stop current runtime
        if: always()
        run: ./ictc.sh stop --profile current || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v6
        if: always()
        with:
          name: s4-a5-browser-a11y
          path: |
            artifacts/s4-a5-*.json
            artifacts/browser-s4-a5-*.json
            artifacts/browser-s4-a5-server.log
          if-no-files-found: warn
          retention-days: 30