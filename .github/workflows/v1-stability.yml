name: ictc-v1-stability
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stable-local-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax and manifest contracts
        run: |
          node --check v1/release.mjs
          node --check v1/stability-audit.mjs
          node --check v1/buyer-simulation.mjs
          node --check v1/saturation.mjs
          node --check v3/server.mjs
          node -e "const p=require('./package.json'); if(p.version!=='1.1.0-rc.1'||p.scripts.start!=='node v3/server.mjs') process.exit(1)"
          bash -n ictc.sh
          bash -n ictc-v3.sh
      - name: Full release gate
        run: npm run release:check
      - name: Canonical npm start lifecycle
        env:
          PORT: '4781'
          ICTC_PORT: '4781'
          ICTC_HOST: '127.0.0.1'
          ICTC_RUNTIME_DIR: ${{ runner.temp }}/ictc-v1-npm-runtime
        run: |
          npm start > "${{ runner.temp }}/ictc-v1.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl --fail --silent http://127.0.0.1:4781/api/health && break; sleep .2; done
          curl --fail --silent http://127.0.0.1:4781/api/release > "${{ runner.temp }}/release.json"
          node -e "const r=require('${{ runner.temp }}/release.json'); if(r.version!=='1.1.0-rc.1'||r.readiness!=='ready') process.exit(1)"
      - name: Launcher lifecycle
        env:
          ICTC_NO_OPEN: '1'
          ICTC_PORT: '4782'
          ICTC_RUNTIME_DIR: ${{ runner.temp }}/ictc-v1-launcher-runtime
          ICTC_STATE_DIR: ${{ runner.temp }}/ictc-v1-launcher-state
        run: |
          trap './ictc.sh stop --profile current || true' EXIT
          ./ictc.sh start --profile current --no-open
          ./ictc.sh status --profile current
          curl --fail --silent http://127.0.0.1:4782/api/release
          ./ictc.sh stop --profile current
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-v1-stability
          path: |
            artifacts/v1-stability-attestation.json
            artifacts/v1-buyer-simulation.json
            artifacts/v1-saturation.json
            artifacts/gap-audit.json
            artifacts/v3-ux-audit.json
          retention-days: 30
