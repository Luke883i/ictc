name: Architecture | Current-state convergence

on:
  pull_request:
    paths:
      - 'src/lib/as-is-convergence*'
      - 'src/lib/trama-engineering*'
      - 'tests/contracts/trama-compass-governance.json'
      - 'tests/contracts/trama-enterprise-dod.json'
      - 'tests/contracts/gaps.json'
      - 'audit/remediation-registry.json'
      - 'docs/**'
      - 'AGENTS.md'
      - 'public/**'
      - '.github/workflows/as-is-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  as-is-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'
      - run: node tests/verification/as-is-convergence-check.mjs
      - name: Strategic 100k
        run: node tests/verification/as-is-convergence-saturation.mjs --trials 100000 --tail 10000
      - name: Strategic 1M
        run: node tests/verification/as-is-convergence-saturation.mjs --trials 1000000 --tail 10000
      - name: Strategic 10M
        run: node tests/verification/as-is-convergence-saturation.mjs --trials 10000000 --tail 10000
