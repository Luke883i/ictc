name: convergent-kernel-dod
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: convergent-kernel-dod-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: npm run check && python3 -m py_compile v3/browser-convergent-kernel.py
      - name: Canonical procedure and projection contracts
        run: node v3/procedure-contracts-check.mjs && node v3/procedure-guide-check.mjs && node v3/product-contract-check.mjs && node v3/semantic-api-contract-check.mjs
      - name: Convergent kernel invariants
        run: node v3/convergent-kernel-check.mjs
      - name: C01-C14 genuine convergence M plus 1000
        run: node v3/convergent-kernel-saturation.mjs
      - name: Existing 1.2 process fidelity
        run: node v3/standard-library-check.mjs && node v3/monitoring-access-check.mjs && node v3/incident-contract-check.mjs && node v3/object-identity-check.mjs && node v3/procedure-summary-check.mjs && node v3/procedure-market-saturation.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: convergent-kernel-semantic-evidence
          path: artifacts/convergent-kernel-saturation.json
          if-no-files-found: warn
          retention-days: 30
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve system browser
        shell: bash
        run: |
          for browser in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [[ -x "$browser" ]]; then echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"; exit 0; fi
          done
          echo 'No supported Chromium browser found' >&2; exit 1
      - name: Launch exact-head runtime
        shell: bash
        run: |
          export ICTC_NO_OPEN=1 ICTC_PORT=4827 PORT=4827 ICTC_BASE_URL=http://127.0.0.1:4827
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-convergent-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-convergent-runtime" ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
      - name: Seven-procedure epistemic browser journey
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          status=0
          python -u v3/browser-convergent-kernel.py || status=$?
          if [[ "$status" -ne 0 ]]; then
            FAILED_BROWSER_SCRIPT='v3/browser-convergent-kernel.py' node scripts/browser-failure-provenance.mjs || true
            error='artifacts/browser-convergent-kernel-error.json'
            if [[ -f "$error" ]]; then
              phase="$(node -e "const p=require('./$error');process.stdout.write(String(p.phase||'unknown'))")"
              message="$(node -e "const p=require('./$error');process.stdout.write(String(p.message||'').replace(/[\r\n]+/g,' '))")"
              trace="$(node -e "const p=require('./$error');const xs=String(p.traceback||'').split(/\r?\n/);let out='';for(let i=1;i<xs.length;i++){const c=xs[i].indexOf('^');if(c>=0){const src=xs[i-1]||'';out=src.slice(Math.max(0,c-42),Math.min(src.length,c+88)).trim();break;}}if(!out)out=xs.map(x=>x.trim()).filter(Boolean).slice(-3).join(' | ');process.stdout.write(out.replace(/[\r\n]+/g,' '))")"
              [[ -n "$message" ]] || message="$trace"
            else
              phase='no-artifact'; message='browser journey failed without structured artifact'
            fi
            target="https://github.com/${GITHUB_REPOSITORY}/blob/${HEAD_SHA}/v3/browser-convergent-kernel.py?phase=${phase}"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state=failure -f context='ictc/convergent-kernel-browser' -f description="${phase}: ${message:0:110}" -f target_url="$target" >/dev/null || true
            exit "$status"
          fi
          target="https://github.com/${GITHUB_REPOSITORY}/blob/${HEAD_SHA}/v3/browser-convergent-kernel.py?phase=complete"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state=success -f context='ictc/convergent-kernel-browser' -f description='seven-procedure convergent browser journey passed' -f target_url="$target" >/dev/null || true
      - name: Stop runtime
        if: always()
        run: ./ictc.sh stop --profile current || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: convergent-kernel-browser-evidence
          path: |
            artifacts/browser-convergent-kernel*.json
            artifacts/ux-v12-convergent-*.png
          if-no-files-found: warn
          retention-days: 30
