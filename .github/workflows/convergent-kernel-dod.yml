name: Architecture | Core convergence contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: convergent-kernel-dod-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out source SHA
        env:
          ICTC_EXPECT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$ICTC_EXPECT_HEAD" ]; then
            echo "::error title=exact-head-drift::checkout=$actual expected=$ICTC_EXPECT_HEAD"
            exit 1
          fi
          echo "Exact source SHA verified: $actual"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: npm run check && python3 -m py_compile tests/browser/browser-convergent-kernel.py
      - name: Canonical procedure and projection contracts
        run: node tests/verification/procedure-contracts-check.mjs && node tests/verification/procedure-guide-check.mjs && node tests/verification/product-contract-check.mjs && node tests/verification/semantic-api-contract-check.mjs
      - name: Convergent kernel invariants
        run: node tests/verification/convergent-kernel-check.mjs
      - name: C01-C14 genuine convergence M plus 1000
        run: node tests/verification/convergent-kernel-saturation.mjs
      - name: Existing 1.2 process fidelity
        run: node tests/verification/standard-library-check.mjs && node tests/verification/monitoring-access-check.mjs && node tests/verification/incident-contract-check.mjs && node tests/verification/object-identity-check.mjs && node tests/verification/procedure-summary-check.mjs && node tests/verification/procedure-market-saturation.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: convergent-kernel-semantic-evidence
          path: artifacts/convergent-kernel-saturation.json
          if-no-files-found: warn
          retention-days: 30
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out source SHA
        env:
          ICTC_EXPECT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$ICTC_EXPECT_HEAD" ]; then
            echo "::error title=exact-head-drift::checkout=$actual expected=$ICTC_EXPECT_HEAD"
            exit 1
          fi
          echo "Exact source SHA verified: $actual"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve system browser
        shell: bash
        run: |
          for browser in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [[ -x "$browser" ]]; then echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"; exit 0; fi
          done
          echo 'No supported Chromium browser found' >&2; exit 1
      - name: Launch exact-head runtime
        shell: bash
        run: |
          export ICTC_NO_OPEN=1 ICTC_PORT=4827 PORT=4827 ICTC_BASE_URL=http://127.0.0.1:4827
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-convergent-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-convergent-runtime" ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
      - name: Seven-procedure epistemic browser journey
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          status=0
          python -u tests/browser/browser-convergent-kernel.py || status=$?
          if [[ "$status" -ne 0 ]]; then
            FAILED_BROWSER_SCRIPT='tests/browser/browser-convergent-kernel.py' node scripts/browser-failure-provenance.mjs || true
            error='artifacts/browser-convergent-kernel-error.json'
            if [[ -f "$error" ]]; then
              phase="$(node -e "const p=require('./$error');process.stdout.write(String(p.phase||'unknown'))")"
              message="$(node -e "const p=require('./$error');process.stdout.write(String(p.message||'').replace(/[\r\n]+/g,' '))")"
              trace="$(node -e "const p=require('./$error');const xs=String(p.traceback||'').split(/\r?\n/);let out='';for(let i=1;i<xs.length;i++){const c=xs[i].indexOf('^');if(c>=0){const src=xs[i-1]||'';out=src.slice(Math.max(0,c-42),Math.min(src.length,c+88)).trim();break;}}if(!out)out=xs.map(x=>x.trim()).filter(Boolean).slice(-3).join(' | ');process.stdout.write(out.replace(/[\r\n]+/g,' '))")"
              [[ -n "$message" ]] || message="$trace"
            else
              phase='no-artifact'; message='browser journey failed without structured artifact'
            fi
            target="https://github.com/${GITHUB_REPOSITORY}/blob/${HEAD_SHA}/tests/browser/browser-convergent-kernel.py?phase=${phase}"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state=failure -f context='ictc/convergent-kernel-browser' -f description="${phase}: ${message:0:110}" -f target_url="$target" >/dev/null || true
            exit "$status"
          fi
          target="https://github.com/${GITHUB_REPOSITORY}/blob/${HEAD_SHA}/tests/browser/browser-convergent-kernel.py?phase=complete"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state=success -f context='ictc/convergent-kernel-browser' -f description='seven-procedure convergent browser journey passed' -f target_url="$target" >/dev/null || true
      - name: Stop runtime
        if: always()
        run: ./ictc.sh stop --profile current || true
      - name: Identify bounded browser failure provenance
        if: failure()
        id: browser_failure_phase
        shell: bash
        run: |
          node -e 'const fs=require("node:fs");let p={};try{p=JSON.parse(fs.readFileSync("artifacts/browser-convergent-kernel-error.json","utf8"))}catch{}const slug=x=>String(x||"unattributed").replace(/[^A-Za-z0-9._-]/g,"-").slice(0,70);fs.appendFileSync(process.env.GITHUB_OUTPUT,"label="+slug(p.phase)+"-"+slug(p.type)+String.fromCharCode(10))'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: convergent-kernel-failure-${{ steps.browser_failure_phase.outputs.label || 'unattributed' }}
          path: artifacts/browser-convergent-kernel-error.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: convergent-kernel-browser-evidence
          path: |
            artifacts/browser-convergent-kernel*.json
            artifacts/ux-v12-convergent-*.png
          if-no-files-found: warn
          retention-days: 30
