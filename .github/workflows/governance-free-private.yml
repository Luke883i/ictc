name: ictc-governance-free-private
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ictc-governance-free-private-${{ github.ref }}
  cancel-in-progress: true
jobs:
  governance-free-private:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22'}
      - name: Governance contract self-test
        run: node v3/governance-free-private-check.mjs --self-test
      - name: Validate PR or main-push provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node v3/governance-free-private-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v6
        if: always()
        with:
          name: ictc-gov-01f-governance
          path: artifacts/gov-01f-governance.json
          if-no-files-found: error
          retention-days: 30
