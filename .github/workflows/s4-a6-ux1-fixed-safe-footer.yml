name: s4-a6-ux1-fixed-safe-footer
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: s4-a6-ux1-fixed-safe-footer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixed-safe-footer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - name: A6-UX1 syntax
        run: |
          node --check v3/s4-a6-ux1-footer-model.mjs
          node --check v3/s4-a6-ux1-fixed-safe-footer-check.mjs
          node --check v3/s4-a6-ux1-fixed-safe-footer-saturation.mjs
          python -m py_compile v3/browser-s4-a6-ux1-fixed-safe-footer.py
      - name: A6-UX1 source contract
        run: node v3/s4-a6-ux1-fixed-safe-footer-check.mjs
      - name: A6-UX1 deterministic falsification
        run: node v3/s4-a6-ux1-fixed-safe-footer-saturation.mjs
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          if [[ -z "$browser" || ! -x "$browser" ]]; then echo 'No supported system Chromium browser found on the runner' >&2; exit 1; fi
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Start canonical current runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4865 PORT=4865
          export ICTC_BASE_URL="http://127.0.0.1:4865"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-a6-ux1-state"
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-a6-ux1-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          ./ictc.sh status --profile current
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
          echo "ICTC_STATE_DIR=$ICTC_STATE_DIR" >> "$GITHUB_ENV"
          echo "ICTC_RUNTIME_DIR=$ICTC_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: A6-UX1 exact-head Chromium geometry
        id: ux1_browser
        continue-on-error: true
        run: python -u v3/browser-s4-a6-ux1-fixed-safe-footer.py
      - name: Publish A6-UX1 failure provenance
        if: steps.ux1_browser.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          error='artifacts/browser-s4-a6-ux1-fixed-safe-footer-error.json'
          phase='no-error-artifact'
          message='fixed footer browser contract failed'
          if [ -f "$error" ]; then
            phase="$(python -c "import json; d=json.load(open('$error')); print(str(d.get('phase') or 'unknown'))")"
            message="$(python -c "import json; d=json.load(open('$error')); print(str(d.get('message') or 'browser contract failed').replace(chr(10),' ')[:96])")"
          fi
          description="${phase}: ${message}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=failure -f context='ictc/s4-a6-ux1-browser' \
            -f description="${description:0:140}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/blob/${HEAD_SHA}/v3/browser-s4-a6-ux1-fixed-safe-footer.py" >/dev/null || true
          cat "$error" || true
          exit 1
      - name: Publish A6-UX1 success provenance
        if: steps.ux1_browser.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success -f context='ictc/s4-a6-ux1-browser' \
            -f description='fixed footer geometry green at 1440/390/320' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/blob/${HEAD_SHA}/v3/browser-s4-a6-ux1-fixed-safe-footer.py" >/dev/null || true
      - name: Stop current runtime
        if: always()
        run: ./ictc.sh stop --profile current || true
