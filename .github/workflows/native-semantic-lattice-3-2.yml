name: ictc-native-semantic-lattice-3-2
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-semantic-lattice:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Static semantic lattice
        run: node v3/native-semantic-lattice-3-2-check.mjs
      - name: UI hierarchy contract
        run: node v3/native-semantic-lattice-3-2-ui-check.mjs
      - name: Ten-million mutation saturation
        run: node v3/native-semantic-lattice-3-2-saturation.mjs
      - name: Event and replay stress
        run: node v3/native-semantic-lattice-3-2-stress.mjs
