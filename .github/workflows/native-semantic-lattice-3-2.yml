name: ictc-native-semantic-lattice-3-2
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-semantic-lattice:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Static semantic lattice
        run: node v3/native-semantic-lattice-3-2-check.mjs
      - name: UI hierarchy contract
        run: node v3/native-semantic-lattice-3-2-ui-check.mjs
      - name: Ten-million model-vocabulary trials
        run: node v3/native-semantic-lattice-3-2-saturation.mjs
      - name: Code-bound C0.1 constitution stress
        run: node v3/native-semantic-lattice-3-2-stress.mjs
  epistemic-overflow-causal:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Causal overflow probe syntax
        run: python -m py_compile v3/browser-epistemic-overflow-probe.py
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          if [[ -z "$browser" || ! -x "$browser" ]]; then echo 'No supported system Chromium browser found on the runner' >&2; exit 1; fi
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: EP-01 exact geometry causal guard
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONUNBUFFERED=1 ICTC_NO_OPEN=1 ICTC_PORT=4811 PORT=4811 ICTC_BASE_URL='http://127.0.0.1:4811'
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-ep-overflow-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-ep-overflow-runtime" ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          trap './ictc.sh stop --profile current || true' EXIT
          status=0
          python -u v3/browser-epistemic-overflow-probe.py || status=$?
          if [[ "$status" -ne 0 ]]; then
            FAILED_BROWSER_SCRIPT='v3/browser-epistemic-overflow-probe.py' node scripts/browser-failure-provenance.mjs || true
            exit "$status"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v6
        if: always()
        with:
          name: ictc-epistemic-overflow-causal-evidence
          path: artifacts/browser-epistemic-overflow-probe*.json
          if-no-files-found: warn
          retention-days: 30
