name: ictc-journey-ux
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-journey-ux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  journey-runtime-and-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Journey contracts, accessibility and saturation
        run: npm run audit:ux:journey
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Full release compatibility
        run: npm run release:check
      - name: Live backend, runtime journeys and browser write
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1
          export ICTC_PORT=4807
          export PORT=4807
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-journey-runtime"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-journey-state"
          trap './ictc.sh stop --profile current || true' EXIT
          ./ictc.sh start --profile current --no-open
          curl -fsS "http://127.0.0.1:4807/api/health"
          ICTC_BASE_URL="http://127.0.0.1:4807" node v3/journey-runtime-check.mjs
          ICTC_BASE_URL="http://127.0.0.1:4807" python v3/journey-browser-check.py
          ./ictc.sh stop --profile current
          trap - EXIT
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-journey-ux
          path: |
            artifacts/journey-shell-audit.json
            artifacts/journey-accessibility-audit.json
            artifacts/journey-saturation.json
            artifacts/journey-runtime-check.json
            artifacts/journey-browser-check.json
            artifacts/screenshots/journey-workspace-runtime.png
          if-no-files-found: warn
          retention-days: 30
