name: browser-failure-diagnostics-2-6
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
  statuses: write
concurrency:
  group: browser-failure-diagnostics-2-6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  onto-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve Chromium
        shell: bash
        run: |
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do if command -v "$candidate" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$candidate")" >> "$GITHUB_ENV"; exit 0; fi; done; exit 1
      - name: Diagnose Onto-Compliance browser failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4840 PORT=4840 ICTC_BASE_URL=http://127.0.0.1:4840 ICTC_STATE_DIR="$RUNNER_TEMP/onto-diag-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/onto-diag-runtime" ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          trap './ictc.sh stop --profile current || true' EXIT
          if python -u v3/browser-onto-compliance-v1.py; then exit 0; fi
          python - <<'PY'
          import json,os,subprocess,pathlib,re
          p=pathlib.Path('artifacts/browser-onto-compliance-v1-error.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          phase=str(d.get('phase','unknown'))
          anomalies=d.get('anomalies') or []
          kind=str((anomalies[0] if anomalies else {}).get('kind','exception'))
          surface=str((anomalies[0] if anomalies else {}).get('surface','unknown'))
          slug=lambda s: re.sub(r'[^a-z0-9._-]+','-',s.lower()).strip('-')[:40]
          context=f"ictc/onto-diag/{slug(kind)}-{slug(surface)}-{slug(phase)}"[:100]
          payload=json.dumps({'state':'failure','context':context,'description':f'{kind} at {surface} / {phase}'})
          subprocess.run(['curl','-fsS','-X','POST','-H',f"Authorization: Bearer {os.environ['GH_TOKEN']}",'-H','Accept: application/vnd.github+json','-H','X-GitHub-Api-Version: 2022-11-28',f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['HEAD_SHA']}",'-d',payload],check=True)
          PY
          exit 1
  demo-sequence-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve Chromium
        shell: bash
        run: |
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do if command -v "$candidate" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$candidate")" >> "$GITHUB_ENV"; exit 0; fi; done; exit 1
      - name: Diagnose DEMO sequential browser failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4841 PORT=4841 ICTC_BASE_URL=http://127.0.0.1:4841 ICTC_EXPECT_DEMO=1 ICTC_STATE_DIR="$RUNNER_TEMP/demo-diag-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/demo-diag-runtime" ICTC_SCHEDULER_TICK_MS=100000 ICTC_DEMO_STARTUP_ATTEMPTS=900
          ./ictc.sh demo --profile current --no-open
          trap './ictc.sh stop --profile current || true' EXIT
          if python -u v3/browser-shell-admin-demo-2-6.py; then exit 0; fi
          python - <<'PY'
          import json,os,subprocess,pathlib,re
          p=pathlib.Path('artifacts/browser-shell-admin-demo-2-6-demo-error.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          phase=str(d.get('phase','unknown'))
          typ=str(d.get('type','exception'))
          slug=lambda s: re.sub(r'[^a-z0-9._-]+','-',s.lower()).strip('-')[:45]
          context=f"ictc/demo-diag/{slug(phase)}-{slug(typ)}"[:100]
          payload=json.dumps({'state':'failure','context':context,'description':f'DEMO browser failure at {phase}: {typ}'})
          subprocess.run(['curl','-fsS','-X','POST','-H',f"Authorization: Bearer {os.environ['GH_TOKEN']}",'-H','Accept: application/vnd.github+json','-H','X-GitHub-Api-Version: 2022-11-28',f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['HEAD_SHA']}",'-d',payload],check=True)
          PY
          exit 1
