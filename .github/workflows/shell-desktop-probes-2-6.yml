name: shell-desktop-probes-2-6
on: [pull_request, workflow_dispatch]
permissions: {contents: read}
concurrency:
  group: shell-desktop-probes-2-6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    name: shell-desktop-${{ matrix.probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        probe: [nav, profile, footer]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve Chromium
        shell: bash
        run: |
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do if command -v "$candidate" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$candidate")" >> "$GITHUB_ENV"; exit 0; fi; done; exit 1
      - name: Run desktop probe
        shell: bash
        env:
          ICTC_DESKTOP_PROBE: ${{ matrix.probe }}
          ICTC_PORT: 4838
          PORT: 4838
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_BASE_URL=http://127.0.0.1:4838 ICTC_STATE_DIR="$RUNNER_TEMP/ictc-desktop-${{ matrix.probe }}-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-desktop-${{ matrix.probe }}-runtime" ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          trap './ictc.sh stop --profile current || true' EXIT
          python -u v3/browser-shell-desktop-probe-2-6.py
