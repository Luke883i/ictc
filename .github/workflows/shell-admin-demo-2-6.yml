name: Experience | Admin demo browser journeys
on: [pull_request, workflow_dispatch]
permissions: {contents: read}
concurrency:
  group: ictc-shell-admin-demo-2-6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-shell-admin-demo:
    name: browser-shell-admin-demo-${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: standard, port: 4826, expect_demo: '0'}
          - {mode: demo, port: 4827, expect_demo: '1'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - run: python -m py_compile tests/browser/browser-shell-admin-demo-2-6.py
      - name: Resolve Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$candidate")" >> "$GITHUB_ENV"; exit 0; fi
          done
          exit 1
      - name: Run ${{ matrix.mode }} shell evidence
        shell: bash
        env:
          ICTC_EXPECT_DEMO: ${{ matrix.expect_demo }}
          ICTC_PORT: ${{ matrix.port }}
          PORT: ${{ matrix.port }}
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_BASE_URL="http://127.0.0.1:${ICTC_PORT}" ICTC_STATE_DIR="$RUNNER_TEMP/ictc-shell-${{ matrix.mode }}-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-shell-${{ matrix.mode }}-runtime" ICTC_SCHEDULER_TICK_MS=100000 ICTC_DEMO_STARTUP_ATTEMPTS=900
          if [[ "${ICTC_EXPECT_DEMO}" == '1' ]]; then ./ictc.sh demo --profile current --no-open; else ./ictc.sh start --profile current --no-open; fi
          trap './ictc.sh stop --profile current || true' EXIT
          python -u tests/browser/browser-shell-admin-demo-2-6.py
      - name: Expose failure phase as a separately named diagnostic artifact
        id: report_phase
        if: failure()
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          mode = os.environ['MODE']
          source=pathlib.Path('artifacts') / f'browser-shell-admin-demo-2-6-{mode}-error.json'
          if source.is_file():
              payload=json.loads(source.read_text(encoding='utf-8'))
              phase=re.sub('[^a-zA-Z0-9_-]','-',str(payload.get('phase','unknown')))[:70]
              message=str(payload.get('message',''))
              def metric(name):
                  matched=re.search(r"['\\\"]"+name+r"['\\\"]:\\s*([0-9.]+)",message)
                  return matched.group(1) if matched else 'x'
              summary='-o'+metric('overlaps')+'-h'+metric('footerHeight')+'-p'+metric('bodyPaddingBottom')+'-s'+metric('scrollPaddingBottom')
              phase=(phase+summary)[:105]
              with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output: output.write('phase='+phase+'\n')
              pathlib.Path('artifacts').joinpath(f'shell-admin-demo-phase-{mode}-{phase}.txt').write_text(
                  'PHASE='+phase+'\\nERROR='+str(payload.get('message','unknown'))[:1500]+'\\n',encoding='utf-8')
          else:
              with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output: output.write('phase=no-report\n')
              pathlib.Path('artifacts').joinpath(f'shell-admin-demo-phase-{mode}-no-error-report.txt').write_text('No error JSON generated\\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: shell-admin-demo-failure-phase-${{ matrix.mode }}-${{ steps.report_phase.outputs.phase }}
          path: artifacts/shell-admin-demo-phase-*.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ictc-shell-admin-demo-2-6-${{ matrix.mode }}
          path: |
            artifacts/browser-shell-admin-demo-2-6*.json
            artifacts/shell-admin-demo-2-6*.png
          if-no-files-found: warn
          retention-days: 30
