name: ictc-shell-admin-demo-2-6
on: [pull_request, workflow_dispatch]
permissions: {contents: read}
concurrency:
  group: ictc-shell-admin-demo-2-6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-shell-admin-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - run: python -m py_compile v3/browser-shell-admin-demo-2-6.py
      - name: Resolve Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$candidate")" >> "$GITHUB_ENV"; exit 0; fi
          done
          exit 1
      - name: Standard shell
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4826 PORT=4826 ICTC_BASE_URL=http://127.0.0.1:4826 ICTC_EXPECT_DEMO=0 ICTC_STATE_DIR="$RUNNER_TEMP/ictc-shell-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-shell-runtime" ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          trap './ictc.sh stop --profile current || true' EXIT
          python -u v3/browser-shell-admin-demo-2-6.py
          ./ictc.sh stop --profile current
          trap - EXIT
      - name: DEMO shell
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4827 PORT=4827 ICTC_BASE_URL=http://127.0.0.1:4827 ICTC_EXPECT_DEMO=1 ICTC_STATE_DIR="$RUNNER_TEMP/ictc-shell-demo-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-shell-demo-runtime" ICTC_SCHEDULER_TICK_MS=100000 ICTC_DEMO_STARTUP_ATTEMPTS=900
          ./ictc.sh demo --profile current --no-open
          trap './ictc.sh stop --profile current || true' EXIT
          python -u v3/browser-shell-admin-demo-2-6.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ictc-shell-admin-demo-2-6
          path: |
            artifacts/browser-shell-admin-demo-2-6*.json
            artifacts/shell-admin-demo-2-6*.png
          if-no-files-found: warn
          retention-days: 30
