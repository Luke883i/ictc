name: ictc-shell-admin-demo-2-6
on: [pull_request, workflow_dispatch]
permissions: {contents: read}
concurrency:
  group: ictc-shell-admin-demo-2-6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-shell-admin-demo:
    name: browser-shell-admin-demo-${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: standard, port: 4826, expect_demo: '0'}
          - {mode: demo, port: 4827, expect_demo: '1'}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - run: python -m py_compile v3/browser-shell-admin-demo-2-6.py
      - name: Resolve Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$candidate")" >> "$GITHUB_ENV"; exit 0; fi
          done
          exit 1
      - name: Run ${{ matrix.mode }} shell evidence
        shell: bash
        env:
          ICTC_EXPECT_DEMO: ${{ matrix.expect_demo }}
          ICTC_PORT: ${{ matrix.port }}
          PORT: ${{ matrix.port }}
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_BASE_URL="http://127.0.0.1:${ICTC_PORT}" ICTC_STATE_DIR="$RUNNER_TEMP/ictc-shell-${{ matrix.mode }}-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-shell-${{ matrix.mode }}-runtime" ICTC_SCHEDULER_TICK_MS=100000 ICTC_DEMO_STARTUP_ATTEMPTS=900
          if [[ "${ICTC_EXPECT_DEMO}" == '1' ]]; then ./ictc.sh demo --profile current --no-open; else ./ictc.sh start --profile current --no-open; fi
          trap './ictc.sh stop --profile current || true' EXIT
          python -u v3/browser-shell-admin-demo-2-6.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ictc-shell-admin-demo-2-6-${{ matrix.mode }}
          path: |
            artifacts/browser-shell-admin-demo-2-6*.json
            artifacts/shell-admin-demo-2-6*.png
          if-no-files-found: warn
          retention-days: 30

  s4-a0-observability:
    name: s4-a0 / exact-head observability
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Verify S4-A0 contracts
        run: node v3/s4-a0-observability-check.mjs && node v3/s4-a0-observability-saturation.mjs && python -m py_compile v3/browser-s4-a0-observability.py
      - name: Resolve Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$candidate")" >> "$GITHUB_ENV"; exit 0; fi
          done
          exit 1
      - name: Run exact-head S4-A0 evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONUNBUFFERED=1 ICTC_NO_OPEN=1 ICTC_PORT=4828 PORT=4828
          export ICTC_BASE_URL="http://127.0.0.1:4828"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-s4-a0-state"
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-s4-a0-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          export ICTC_EXPECT_BUILD_SHA="$GITHUB_SHA"
          ./ictc.sh start --profile current --no-open
          trap './ictc.sh stop --profile current || true' EXIT
          status=0
          python -u v3/browser-s4-a0-observability.py || status=$?
          cp "$ICTC_STATE_DIR/logs/ictc.log" artifacts/s4-a0-server.log || true
          if [[ "$status" -ne 0 ]]; then
            FAILED_BROWSER_SCRIPT='v3/browser-s4-a0-observability.py' node scripts/browser-failure-provenance.mjs || true
            exit "$status"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ictc-s4-a0-observability
          path: artifacts/s4-a0-*
          if-no-files-found: error
          retention-days: 30
