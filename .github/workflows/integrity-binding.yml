name: ictc-integrity-binding
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-integrity-binding-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22'}
      - name: Canonical state to audit-head binding
        run: node v3/integrity-binding-check.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-integrity-binding
          path: artifacts/integrity-binding.json
          if-no-files-found: error
          retention-days: 30
