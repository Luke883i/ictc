name: rn-primary-diagnostic

on:
  push:
    branches:
      - agent/uiux-converge-0-common-grammar
  pull_request:
    paths:
      - 'v3/public/**'
      - 'v3/browser-rn-primary-diagnostic.py'
      - '.github/workflows/rn-primary-diagnostic.yml'

concurrency:
  group: rn-primary-diagnostic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    name: rn-primary / ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [hit-test, node-stability, trial-click, dom-dispatch, browser-click]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          if [[ -z "$browser" || ! -x "$browser" ]]; then exit 1; fi
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
      - name: Start isolated runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4807 PORT=4807
          export ICTC_STATE_DIR="$RUNNER_TEMP/rn-primary-${{ matrix.mode }}-state"
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/rn-primary-${{ matrix.mode }}-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          echo "ICTC_BASE_URL=http://127.0.0.1:4807" >> "$GITHUB_ENV"
          echo "ICTC_STATE_DIR=$ICTC_STATE_DIR" >> "$GITHUB_ENV"
          echo "ICTC_RUNTIME_DIR=$ICTC_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Probe RN primary ${{ matrix.mode }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u v3/browser-rn-primary-diagnostic.py --mode '${{ matrix.mode }}'
      - name: Stop isolated runtime
        if: always()
        run: ./ictc.sh stop --profile current || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rn-primary-${{ matrix.mode }}
          path: artifacts/rn-primary-${{ matrix.mode }}.json
          if-no-files-found: warn
          retention-days: 7
