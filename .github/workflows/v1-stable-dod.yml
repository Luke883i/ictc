name: Historical Validation | Market candidate V1 (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v1-2-market-candidate-dod-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semantic:
    name: Market Candidate V1 | Semantic verification (manual)
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: 1.2 market profile
        run: node tests/verification/v1-2-market-candidate-check.mjs
      - name: Product contract authority
        run: node tests/verification/product-contract-check.mjs
      - name: Semantic API authority
        run: node tests/verification/semantic-api-contract-check.mjs
      - name: Procedure contracts
        run: node tests/verification/procedure-contracts-check.mjs
      - name: Procedure feature policy
        run: node tests/verification/procedure-policy-check.mjs
      - name: Process-specific primitives
        run: |
          node tests/verification/standard-library-check.mjs
          node tests/verification/monitoring-access-check.mjs
          node tests/verification/incident-contract-check.mjs
          node tests/verification/object-identity-check.mjs
          node tests/verification/procedure-summary-check.mjs
      - name: Existing lifecycle fidelity
        run: |
          node tests/verification/v1-stable-process-hardening-check.mjs
          node tests/verification/reference-contract-check.mjs
          node tests/verification/reference-integration-check.mjs
          node tests/verification/ao-reattestation-check.mjs
          node tests/verification/rn-requirement-identity-check.mjs
          node tests/verification/dependency-review-check.mjs
      - name: Genuine procedure saturation M plus 1000
        shell: bash
        run: |
          mkdir -p artifacts
          node tests/verification/procedure-market-saturation.mjs | tee artifacts/procedure-market-saturation.txt
      - name: Persistence and governance baseline
        run: |
          node tests/verification/v4-stable-governance-check.mjs
          node tests/verification/v4-stable-persistence-check.mjs
          node tests/verification/v4-stable-real-saturation.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: v1-2-market-candidate-semantic-evidence
          path: |
            artifacts/procedure-market-saturation.txt
            artifacts/v4-stable-real-saturation.json
          if-no-files-found: warn
  browser:
    name: Market Candidate V1 | Browser verification (manual)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - run: python -m py_compile tests/browser/browser-v1-2-market-candidate.py
      - name: Resolve Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$candidate")" >> "$GITHUB_ENV"; exit 0; fi
          done
          echo 'No supported Chromium browser found' >&2
          exit 1
      - name: Launch market candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4824 PORT=4824
          export ICTC_BASE_URL="http://127.0.0.1:4824"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-v12-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-v12-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
      - name: 1.2 process browser journey
        run: python -u tests/browser/browser-v1-2-market-candidate.py
      - name: Stop runtime
        if: always()
        run: ./ictc.sh stop --profile current || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: v1-2-market-candidate-browser-evidence
          path: |
            artifacts/browser-v1-2*.json
            artifacts/ux-v12-*.png
          if-no-files-found: warn
