name: v1-2-market-candidate-dod
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v1-2-market-candidate-dod-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: 1.2 market profile
        run: node v3/v1-2-market-candidate-check.mjs
      - name: Product contract authority
        run: node v3/product-contract-check.mjs
      - name: Semantic API authority
        run: node v3/semantic-api-contract-check.mjs
      - name: Procedure contracts
        run: node v3/procedure-contracts-check.mjs
      - name: Procedure feature policy
        run: node v3/procedure-policy-check.mjs
      - name: Process-specific primitives
        run: |
          node v3/standard-library-check.mjs
          node v3/monitoring-access-check.mjs
          node v3/incident-contract-check.mjs
          node v3/object-identity-check.mjs
          node v3/procedure-summary-check.mjs
      - name: Existing lifecycle fidelity
        run: |
          node v3/v1-stable-process-hardening-check.mjs
          node v3/reference-contract-check.mjs
          node v3/reference-integration-check.mjs
          node v3/ao-reattestation-check.mjs
          node v3/rn-requirement-identity-check.mjs
          node v3/dependency-review-check.mjs
      - name: Genuine procedure saturation M plus 1000
        shell: bash
        run: |
          mkdir -p artifacts
          node v3/procedure-market-saturation.mjs | tee artifacts/procedure-market-saturation.txt
      - name: Persistence and governance baseline
        run: |
          node v3/v4-stable-governance-check.mjs
          node v3/v4-stable-persistence-check.mjs
          node v3/v4-stable-real-saturation.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v1-2-market-candidate-semantic-evidence
          path: |
            artifacts/procedure-market-saturation.txt
            artifacts/v4-stable-real-saturation.json
          if-no-files-found: warn
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - run: python -m py_compile v3/browser-v1-2-market-candidate.py
      - name: Resolve Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$candidate")" >> "$GITHUB_ENV"; exit 0; fi
          done
          echo 'No supported Chromium browser found' >&2
          exit 1
      - name: Launch market candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4824 PORT=4824
          export ICTC_BASE_URL="http://127.0.0.1:4824"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-v12-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-v12-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
      - name: 1.2 process browser journey
        run: python -u v3/browser-v1-2-market-candidate.py
      - name: Stop runtime
        if: always()
        run: ./ictc.sh stop --profile current || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v1-2-market-candidate-browser-evidence
          path: |
            artifacts/browser-v1-2*.json
            artifacts/ux-v12-*.png
          if-no-files-found: warn
