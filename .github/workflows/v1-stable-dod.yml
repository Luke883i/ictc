name: v1-stable-dod
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v1-stable-dod-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Stable release contract
        run: node v3/v1-stable-release-contract-check.mjs
      - name: Stable UI contract
        run: node v3/v1-stable-ui-contract-check.mjs
      - name: Stable process hardening
        run: node v3/v1-stable-process-hardening-check.mjs
      - name: Typed traceability and lifecycle hardening
        run: |
          node v3/reference-contract-check.mjs
          node v3/reference-integration-check.mjs
          node v3/ao-reattestation-check.mjs
          node v3/rn-requirement-identity-check.mjs
          node v3/dependency-review-check.mjs
      - name: 1000 usage plus 1000 adversarial scenarios
        run: node v3/v1-stable-experience-saturation.mjs
      - name: 1000 enterprise-candidate semantic scenarios
        run: node v3/enterprise-candidate-saturation.mjs
      - name: PR49 stable runtime baseline
        run: |
          node v3/v4-stable-governance-check.mjs
          node v3/v4-stable-persistence-check.mjs
          node v3/v4-stable-real-saturation.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v1-stable-semantic-evidence
          path: |
            artifacts/v1-stable-*.json
            artifacts/enterprise-candidate-saturation.json
          if-no-files-found: warn
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - run: python -m py_compile v3/browser-v1-stable-check.py
      - name: Resolve Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$candidate")" >> "$GITHUB_ENV"; exit 0; fi
          done
          echo 'No supported Chromium browser found' >&2
          exit 1
      - name: Launch stable candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4822 PORT=4822
          export ICTC_BASE_URL="http://127.0.0.1:4822"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-v1-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-v1-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
      - name: Stable browser journey and screenshot geometry
        run: python -u v3/browser-v1-stable-check.py
      - name: Stop runtime
        if: always()
        run: ./ictc.sh stop --profile current || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v1-stable-browser-evidence
          path: |
            artifacts/browser-v1-stable*.json
            artifacts/ux-*.png
          if-no-files-found: warn
