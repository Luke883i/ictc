name: ictc-business-surface-convergence-2-7
on: [workflow_dispatch]
permissions:
  contents: read
  statuses: write
concurrency:
  group: ictc-business-surface-convergence-2-7-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semantic-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: node v3/business-surface-convergence-check-2-7.mjs
      - run: node v3/business-surface-convergence-saturation-2-7.mjs
      - run: node v3/business-surface-convergence-frontier-2-7.mjs
  browser:
    name: browser-${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: standard, port: 4840, expect_demo: '0'}
          - {mode: demo, port: 4841, expect_demo: '1'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - run: python -m py_compile v3/browser-business-surface-convergence-2-7.py
      - name: Resolve Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$candidate")" >> "$GITHUB_ENV"; exit 0; fi
          done
          exit 1
      - name: Run ${{ matrix.mode }} business surface evidence
        shell: bash
        env:
          ICTC_EXPECT_DEMO: ${{ matrix.expect_demo }}
          ICTC_PORT: ${{ matrix.port }}
          PORT: ${{ matrix.port }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_BASE_URL="http://127.0.0.1:${ICTC_PORT}" ICTC_STATE_DIR="$RUNNER_TEMP/ictc-business-${{ matrix.mode }}-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-business-${{ matrix.mode }}-runtime" ICTC_SCHEDULER_TICK_MS=100000 ICTC_DEMO_STARTUP_ATTEMPTS=900
          if [[ "${ICTC_EXPECT_DEMO}" == '1' ]]; then ./ictc.sh demo --profile current --no-open; else ./ictc.sh start --profile current --no-open; fi
          trap './ictc.sh stop --profile current || true' EXIT
          python -u v3/browser-business-surface-convergence-2-7.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ictc-business-surface-convergence-2-7-${{ matrix.mode }}
          path: |
            artifacts/browser-business-surface-convergence-2-7*.json
            artifacts/business-surface-convergence-2-7*.png
          if-no-files-found: warn
          retention-days: 30
