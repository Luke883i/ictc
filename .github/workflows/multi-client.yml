name: ictc-multi-client-readiness
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-multi-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Access, isolation, RBAC and session scope
        run: npm run audit:access
      - name: Minimal UI and M plus 100 saturation
        run: |
          node v3/multi-client-ui-check.mjs
          node v3/multi-client-saturation.mjs
      - name: Full compatibility gate
        run: npm run release:check
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-multi-client-readiness
          path: |
            artifacts/multi-client-saturation.json
            artifacts/v1-stability-attestation.json
            artifacts/journey-shell-audit.json
            artifacts/core-copy-audit.json
          if-no-files-found: warn
          retention-days: 30
