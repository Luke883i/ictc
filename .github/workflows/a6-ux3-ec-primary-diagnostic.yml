name: a6-ux3-ec-primary-diagnostic
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a6-ux3-ec-primary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ec-primary-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve browser
        shell: bash
        run: |
          for c in google-chrome google-chrome-stable chromium chromium-browser; do if command -v "$c" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$c")" >> "$GITHUB_ENV"; exit 0; fi; done; exit 1
      - name: Start runtime
        run: |
          export ICTC_NO_OPEN=1 ICTC_PORT=4883 PORT=4883 ICTC_BASE_URL=http://127.0.0.1:4883
          export ICTC_STATE_DIR="$RUNNER_TEMP/state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/runtime" ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
          echo "ICTC_STATE_DIR=$ICTC_STATE_DIR" >> "$GITHUB_ENV"
          echo "ICTC_RUNTIME_DIR=$ICTC_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Probe EC primary
        id: probe
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
            b=pw.chromium.launch(headless=True,args=['--no-sandbox'],executable_path=os.environ['ICTC_CHROMIUM']);c=b.new_context(viewport={'width':1440,'height':950});c.add_init_script("localStorage.setItem('ictc-role','admin');localStorage.setItem('ictc-service','processes')")
            p=c.new_page();p.set_default_timeout(5000);p.goto(os.environ['ICTC_BASE_URL']+'/?view=processes',wait_until='networkidle')
            card=p.locator('#procedureHub [data-process-code="EC-01"]');card.locator(':scope > footer .procedure-primary').click();p.wait_for_function("()=>document.querySelector('#incidentsView')?.offsetParent!==null&&document.querySelector('#incidentsView')?.dataset.editorialOrderValid==='true'")
            old=p.locator('.procedure-frame:visible .procedure-primary');direct=p.locator('#incidentsView > .procedure-frame .procedure-primary');typed=p.locator('[data-procedure-primary="incidents"]');frame=p.locator('#incidentsView > .procedure-frame')
            oc,dc,tc,fc=old.count(),direct.count(),typed.count(),frame.count();fv=frame.is_visible() if fc==1 else False;tv=typed.is_visible() if tc==1 else False
            case='old-zero' if oc==0 else 'old-many' if oc>1 else 'direct-zero' if dc==0 else 'direct-many' if dc>1 else 'typed-zero' if tc==0 else 'typed-many' if tc>1 else 'frame-not-visible' if not fv else 'typed-not-visible' if not tv else 'green'
            print('COUNTS',oc,dc,tc,fc,'VISIBLE',fv,tv,'CASE',case)
            with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('case='+case+'\n')
            b.close()
          PY
      - name: EC old selector zero
        if: steps.probe.outputs.case == 'old-zero'
        run: exit 1
      - name: EC old selector many
        if: steps.probe.outputs.case == 'old-many'
        run: exit 1
      - name: EC direct primary zero
        if: steps.probe.outputs.case == 'direct-zero'
        run: exit 1
      - name: EC direct primary many
        if: steps.probe.outputs.case == 'direct-many'
        run: exit 1
      - name: EC typed primary zero
        if: steps.probe.outputs.case == 'typed-zero'
        run: exit 1
      - name: EC typed primary many
        if: steps.probe.outputs.case == 'typed-many'
        run: exit 1
      - name: EC frame not visible
        if: steps.probe.outputs.case == 'frame-not-visible'
        run: exit 1
      - name: EC typed primary not visible
        if: steps.probe.outputs.case == 'typed-not-visible'
        run: exit 1
      - name: EC selector diagnostic green
        if: steps.probe.outputs.case == 'green'
        run: echo green
      - name: Stop runtime
        if: always()
        run: ./ictc.sh stop --profile current || true