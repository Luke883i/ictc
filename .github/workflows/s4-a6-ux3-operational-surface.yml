name: s4-a6-ux3-operational-surface
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s4-a6-ux3-operational-surface-${{ github.ref }}
  cancel-in-progress: true
jobs:
  operational-surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      browser_phase: ${{ steps.browser_phase.outputs.phase }}
      scroll_signature: ${{ steps.browser_phase.outputs.scroll_signature }}
      scroll_owner_count: ${{ steps.browser_phase.outputs.scroll_owner_count }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - name: A6-UX3 syntax
        run: |
          node --check v3/public/ui/operational-surface-a6-ux3.js
          node --check v3/public/ui/standard-browser.js
          node --check v3/s4-a6-ux3-operational-surface-model.mjs
          node --check v3/s4-a6-ux3-operational-surface-check.mjs
          node --check v3/s4-a6-ux3-operational-surface-saturation.mjs
          python -m py_compile v3/browser-s4-a6-ux3-operational-surface.py
          python -m py_compile v3/browser-procedure-finetuning-1-4-base.py
          python -m py_compile v3/browser-v2-1-procedure-journey.py
          python -m py_compile v3/browser-shell-admin-demo-2-6.py
          python -m py_compile v3/browser-shell-admin-demo-probe-2-6.py
          python -m py_compile v3/browser-shell-desktop-probe-2-6.py
      - name: A6-UX3 source contract
        run: node v3/s4-a6-ux3-operational-surface-check.mjs
      - name: A6-UX3 100k source antagonists
        run: node v3/s4-a6-ux3-operational-surface-saturation.mjs
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          if [[ -z "$browser" || ! -x "$browser" ]]; then echo 'No supported system Chromium browser found on the runner' >&2; exit 1; fi
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Start canonical current runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4867 PORT=4867
          export ICTC_BASE_URL="http://127.0.0.1:4867"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-a6-ux3-state"
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-a6-ux3-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          ./ictc.sh status --profile current
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
          echo "ICTC_STATE_DIR=$ICTC_STATE_DIR" >> "$GITHUB_ENV"
          echo "ICTC_RUNTIME_DIR=$ICTC_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: A6-UX3 exact-head Chromium operational surface
        id: browser
        continue-on-error: true
        run: python -u v3/browser-s4-a6-ux3-operational-surface.py
      - name: Stop current runtime
        if: always()
        run: ./ictc.sh stop --profile current || true
      - name: Capture A6-UX3 browser phase
        id: browser_phase
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import ast, json, os, pathlib, re
          path=pathlib.Path('artifacts/browser-s4-a6-ux3-operational-surface-error.json')
          phase='green'; message=''; owners=[]
          if path.exists():
              payload=json.loads(path.read_text(encoding='utf8'))
              phase=str(payload.get('phase') or 'unknown')
              message=str(payload.get('message') or '')
          if phase == 'mc-standard-scroll' and message:
              try:
                  parsed=ast.literal_eval(message)
                  if isinstance(parsed, tuple) and len(parsed) >= 2 and isinstance(parsed[1], list):
                      owners=[o for o in parsed[1] if isinstance(o, dict)]
              except Exception:
                  owners=[]
          def owner_key(owner):
              oid=str(owner.get('id') or '')
              classes=set(str(owner.get('cls') or '').split())
              if oid == 'standardBrowserDialog': return 'dialog'
              for css,name in (
                  ('standard-browser-shell','shell'),
                  ('standard-browser-tools','tools'),
                  ('standard-browser-objectives','objectives'),
                  ('standard-browser-master-detail','master-detail'),
                  ('standard-browser-master','master'),
                  ('standard-browser-detail','detail'),
                  ('standard-node-list','node-list'),
                  ('standard-node-detail','node-detail'),
              ):
                  if css in classes:return name
              tag=str(owner.get('tag') or 'node').lower()
              token=oid or next(iter(sorted(classes)),tag)
              return 'other-'+re.sub(r'[^a-zA-Z0-9_.-]+','_',token)[:48]
          signature='+'.join(owner_key(o) for o in owners) if owners else ('unparsed' if phase == 'mc-standard-scroll' else 'none')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as out:
              out.write(f'phase={phase}\n')
              out.write(f'scroll_signature={signature}\n')
              out.write(f'scroll_owner_count={len(owners)}\n')
          print(f'A6-UX3 browser phase: {phase}')
          print(f'A6-UX3 scroll owners: count={len(owners)} signature={signature}')
          PY
      - name: A6-UX3 browser failure - Home
        if: steps.browser.outcome == 'failure' && steps.browser_phase.outputs.phase == 'home'
        run: exit 1
      - name: A6-UX3 browser failure - RN
        if: steps.browser.outcome == 'failure' && (contains(steps.browser_phase.outputs.phase, 'RN-01') || startsWith(steps.browser_phase.outputs.phase, 'rn-'))
        run: exit 1
      - name: A6-UX3 browser failure - EC
        if: steps.browser.outcome == 'failure' && (contains(steps.browser_phase.outputs.phase, 'EC-01') || startsWith(steps.browser_phase.outputs.phase, 'ec-'))
        run: exit 1
      - name: A6-UX3 browser failure - AO
        if: steps.browser.outcome == 'failure' && (contains(steps.browser_phase.outputs.phase, 'AO-01') || startsWith(steps.browser_phase.outputs.phase, 'ao-'))
        run: exit 1
      - name: A6-UX3 browser failure - MC framework grammar
        if: steps.browser.outcome == 'failure' && (steps.browser_phase.outputs.phase == 'MC-01-owner' || steps.browser_phase.outputs.phase == 'mc-frameworks' || steps.browser_phase.outputs.phase == 'mc-duplicates' || steps.browser_phase.outputs.phase == 'mc-scopes')
        run: exit 1
      - name: A6-UX3 browser failure - MC scope overlay
        if: steps.browser.outcome == 'failure' && (steps.browser_phase.outputs.phase == 'mc-scope-open' || steps.browser_phase.outputs.phase == 'mc-scope-position' || steps.browser_phase.outputs.phase == 'mc-scope-close')
        run: exit 1
      - name: A6-UX3 browser failure - MC standard entry
        if: steps.browser.outcome == 'failure' && (steps.browser_phase.outputs.phase == 'mc-standard-entries' || steps.browser_phase.outputs.phase == 'mc-standard-open')
        run: exit 1
      - name: A6-UX3 browser failure - MC master detail / scroll
        if: steps.browser.outcome == 'failure' && (steps.browser_phase.outputs.phase == 'mc-standard-detail' || steps.browser_phase.outputs.phase == 'mc-standard-scroll' || steps.browser_phase.outputs.phase == 'mc-standard-node' || steps.browser_phase.outputs.phase == 'mc-standard-readonly' || steps.browser_phase.outputs.phase == 'mc-standard-close')
        run: exit 1
      - name: A6-UX3 browser failure - MC geometry
        if: steps.browser.outcome == 'failure' && steps.browser_phase.outputs.phase == 'mc-geometry'
        run: exit 1
      - name: A6-UX3 browser failure - role boundary
        if: steps.browser.outcome == 'failure' && startsWith(steps.browser_phase.outputs.phase, 'user-')
        run: exit 1
      - name: A6-UX3 browser failure - mobile
        if: steps.browser.outcome == 'failure' && startsWith(steps.browser_phase.outputs.phase, 'mobile-')
        run: exit 1
      - name: A6-UX3 browser failure - read-only boundary
        if: steps.browser.outcome == 'failure' && steps.browser_phase.outputs.phase == 'admin-read-only'
        run: exit 1
      - name: A6-UX3 browser failure - unknown phase
        if: steps.browser.outcome == 'failure' && steps.browser_phase.outputs.phase == 'unknown'
        run: exit 1
      - name: A6-UX3 exact-head browser verdict
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.browser.outcome }}" != "success" ]]; then
            echo "A6-UX3 browser failed in phase ${{ steps.browser_phase.outputs.phase }}" >&2
            echo "scroll owners: ${{ steps.browser_phase.outputs.scroll_signature }}" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v6
        if: always()
        with:
          name: s4-a6-ux3-operational-surface-evidence
          path: artifacts/browser-s4-a6-ux3-operational-surface*.json
          if-no-files-found: warn
          retention-days: 30
  scroll-census:
    name: A6-UX3 scroll census [${{ needs.operational-surface.outputs.scroll_signature }}]
    needs: operational-surface
    if: ${{ always() && needs.operational-surface.outputs.browser_phase == 'mc-standard-scroll' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Expose exact computed owner signature
        run: |
          echo "count=${{ needs.operational-surface.outputs.scroll_owner_count }}"
          echo "signature=${{ needs.operational-surface.outputs.scroll_signature }}"
          test -n "${{ needs.operational-surface.outputs.scroll_signature }}"
