name: enterprise-candidate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: enterprise-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  enterprise-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      ICTC_CI_TRUTH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      ICTC_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: node v3/enterprise-gate-manifest-check.mjs
      - run: node v3/convergence-authority-check.mjs
      - name: Contributor runtime contract
        run: node v3/contributor-runtime-check.mjs
      - name: Contributor runtime adversarial saturation 100k
        run: node v3/contributor-runtime-saturation-100k.mjs
      - run: npm run release:check
      - run: node v3/runtime-enterprise-boundaries-ci.mjs
      - run: node v3/browser-local-write-boundary-check.mjs
      - run: node v3/command-identity-boundary-check.mjs
      - run: node v3/privacy-erasure-race-check.mjs
      - run: node v3/ai-secret-policy-check.mjs
      - run: node v3/tenant-identity-coherence-check.mjs
      - run: node v3/attachment-scanner-tenant-check.mjs
      - run: node v3/csv-export-security-check.mjs
      - run: node v3/ai-network-policy-check.mjs
      - run: node v3/security-enterprise-dod-check.mjs
      - run: node v3/enterprise-t-saturation.mjs
      - run: node v3/enterprise-invariant-convergence.mjs
      - run: node v3/enterprise-t-audit.mjs
      - run: node v3/enterprise-t-runtime-stress.mjs
      - run: node v3/ci-truth-check.mjs
      - run: node v3/enterprise-candidate-saturation.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: enterprise-candidate-evidence
          path: |
            artifacts/enterprise-candidate-saturation.json
            artifacts/ci-truth.json
            artifacts/enterprise-t-audit.json
            artifacts/enterprise-t-runtime-stress.json
            artifacts/convergence-authority-receipt.json
            artifacts/convergence-authority-saturation.json
          if-no-files-found: warn
          retention-days: 30
