name: enterprise-candidate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
concurrency:
  group: enterprise-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  enterprise-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      ICTC_CI_TRUTH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      ICTC_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: node v3/delivery-provenance-check.mjs
      - name: Generate exact-candidate CycloneDX SBOM
        shell: bash
        run: |
          mkdir -p artifacts
          npm sbom --sbom-format cyclonedx > artifacts/ictc-sbom.cdx.json
      - name: Prepare exact-candidate delivery provenance
        id: delivery
        env:
          ICTC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node v3/delivery-provenance-check.mjs --prepare
      - name: Attest candidate build provenance
        id: build_attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.delivery.outputs.bundle_path }}
      - name: Attest candidate SBOM
        id: sbom_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.delivery.outputs.bundle_path }}
          sbom-path: artifacts/ictc-sbom.cdx.json
      - name: Verify candidate attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "${{ steps.delivery.outputs.bundle_path }}" --repo "$GITHUB_REPOSITORY"
      - name: Finalize delivery provenance receipt
        env:
          ICTC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ICTC_BUILD_ATTEST_ID: ${{ steps.build_attest.outputs.attestation-id }}
          ICTC_BUILD_ATTEST_URL: ${{ steps.build_attest.outputs.attestation-url }}
          ICTC_BUILD_BUNDLE_PATH: ${{ steps.build_attest.outputs.bundle-path }}
          ICTC_SBOM_ATTEST_ID: ${{ steps.sbom_attest.outputs.attestation-id }}
          ICTC_SBOM_ATTEST_URL: ${{ steps.sbom_attest.outputs.attestation-url }}
          ICTC_SBOM_BUNDLE_PATH: ${{ steps.sbom_attest.outputs.bundle-path }}
          ICTC_GH_VERIFY: passed
        run: node v3/delivery-provenance-check.mjs --finalize
      - run: node v3/enterprise-gate-manifest-check.mjs
      - run: node v3/convergence-authority-check.mjs
      - name: Contributor runtime contract
        run: node v3/contributor-runtime-check.mjs
      - name: Contributor runtime adversarial saturation 100k
        run: node v3/contributor-runtime-saturation-100k.mjs
      - name: Release contract
        id: release_contract
        continue-on-error: true
        run: npm run release:check
      - name: Diagnose release stable
        id: release_stable
        if: steps.release_contract.outcome == 'failure'
        continue-on-error: true
        run: npm run test:stable
      - name: Diagnose release current semantic
        id: release_semantic
        if: steps.release_contract.outcome == 'failure'
        continue-on-error: true
        run: npm run test:current:semantic
      - name: Diagnose release current runtime
        id: release_runtime
        if: steps.release_contract.outcome == 'failure'
        continue-on-error: true
        run: npm run test:current:runtime
      - name: Propagate release contract failure
        if: steps.release_contract.outcome == 'failure'
        run: |
          echo "release=${{ steps.release_contract.outcome }} stable=${{ steps.release_stable.outcome }} semantic=${{ steps.release_semantic.outcome }} runtime=${{ steps.release_runtime.outcome }}"
          exit 1
      - run: node v3/runtime-enterprise-boundaries-ci.mjs
      - run: node v3/browser-local-write-boundary-check.mjs
      - run: node v3/command-identity-boundary-check.mjs
      - run: node v3/privacy-erasure-race-check.mjs
      - run: node v3/ai-secret-policy-check.mjs
      - run: node v3/tenant-identity-coherence-check.mjs
      - run: node v3/attachment-scanner-tenant-check.mjs
      - run: node v3/csv-export-security-check.mjs
      - run: node v3/ai-network-policy-check.mjs
      - run: node v3/security-enterprise-dod-check.mjs
      - run: node v3/enterprise-t-saturation.mjs
      - run: node v3/enterprise-invariant-convergence.mjs
      - run: node v3/enterprise-t-audit.mjs
      - run: node v3/enterprise-t-runtime-stress.mjs
      - run: node v3/ci-truth-check.mjs
      - run: node v3/enterprise-candidate-saturation.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: enterprise-candidate-evidence
          path: |
            artifacts/enterprise-candidate-saturation.json
            artifacts/ci-truth.json
            artifacts/enterprise-t-audit.json
            artifacts/enterprise-t-runtime-stress.json
            artifacts/convergence-authority-receipt.json
            artifacts/convergence-authority-saturation.json
            artifacts/delivery-provenance-contract.json
            artifacts/delivery-provenance-saturation-10m.json
            artifacts/ictc-sbom.cdx.json
            artifacts/ictc-candidate-*.zip
            artifacts/delivery-provenance.json
            artifacts/delivery-checksums.sha256
            artifacts/delivery-provenance-receipt.json
            artifacts/ictc-build-provenance.sigstore.jsonl
            artifacts/ictc-sbom-attestation.sigstore.jsonl
          if-no-files-found: warn
          retention-days: 30
