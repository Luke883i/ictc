name: a6-ux3-ec-callsite-diagnostic
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a6-ux3-ec-callsite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v21-ec-callsite:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve browser
        shell: bash
        run: |
          set -Eeuo pipefail
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$c")" >> "$GITHUB_ENV"; exit 0; fi
          done
          exit 1
      - name: Start runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4873 PORT=4873 ICTC_BASE_URL=http://127.0.0.1:4873
          export ICTC_STATE_DIR="$RUNNER_TEMP/state-v21" ICTC_RUNTIME_DIR="$RUNNER_TEMP/runtime-v21" ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
          echo "ICTC_STATE_DIR=$ICTC_STATE_DIR" >> "$GITHUB_ENV"
          echo "ICTC_RUNTIME_DIR=$ICTC_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Run V2.1 journey
        id: browser
        continue-on-error: true
        run: python -u v3/browser-v2-1-procedure-journey.py
      - name: Stop runtime
        if: always()
        run: ./ictc.sh stop --profile current || true
      - name: Classify V2.1 EC callsite
        id: classify
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          p=pathlib.Path('artifacts/browser-v2-1-procedure-journey-error.json')
          payload=json.loads(p.read_text(encoding='utf8')) if p.exists() else {}
          phase=str(payload.get('phase') or ('green' if '${{ steps.browser.outcome }}'=='success' else 'unknown'))
          trace=str(payload.get('traceback') or '')
          message=str(payload.get('message') or '')
          site='green' if '${{ steps.browser.outcome }}'=='success' else 'unknown'
          checks=[
            ('ec-dialog-close', "#incidentDialog')).not_to_be_visible"),
            ('ec-list-text', "#incidentList')).to_contain_text"),
            ('ec-workspace-close', "#incidentWorkspace button[aria-label=\"Chiudi\"]"),
            ('ec-awareness-fill', "input[name=\"awarenessAt\"]"),
            ('ec-narrative-fill', "textarea[name=\"originalNarrative\"]"),
            ('ec-submit-click', "#incidentDialog button[type=\"submit\"]"),
            ('ec-projection-revision', 'wait_advance(page, before)'),
            ('ec-surface-revision', "check_surface_revision(page, '#incidentsView', r2)"),
            ('ec-process-projection', "verify_process_projection(page, 'EC-01'"),
          ]
          for label,needle in checks:
            if needle in trace:
              site=label; break
          if site=='unknown' and phase.startswith('EC-01'):
            if 'TimeoutError' in trace or 'TimeoutError' in message: site='ec-timeout-other'
            elif 'AssertionError' in trace: site='ec-assert-other'
            else: site='ec-other'
          print('ICTC_CALLSITE',site,'PHASE',phase,'TYPE',payload.get('type'),'MESSAGE',message[:500])
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as f:
            f.write('site='+site+'\n'); f.write('phase='+phase+'\n')
          PY
      - name: EC callsite - dialog close
        if: steps.classify.outputs.site == 'ec-dialog-close'
        run: exit 1
      - name: EC callsite - list text
        if: steps.classify.outputs.site == 'ec-list-text'
        run: exit 1
      - name: EC callsite - workspace close
        if: steps.classify.outputs.site == 'ec-workspace-close'
        run: exit 1
      - name: EC callsite - awareness fill
        if: steps.classify.outputs.site == 'ec-awareness-fill'
        run: exit 1
      - name: EC callsite - narrative fill
        if: steps.classify.outputs.site == 'ec-narrative-fill'
        run: exit 1
      - name: EC callsite - submit click
        if: steps.classify.outputs.site == 'ec-submit-click'
        run: exit 1
      - name: EC callsite - projection revision
        if: steps.classify.outputs.site == 'ec-projection-revision'
        run: exit 1
      - name: EC callsite - surface revision
        if: steps.classify.outputs.site == 'ec-surface-revision'
        run: exit 1
      - name: EC callsite - process projection
        if: steps.classify.outputs.site == 'ec-process-projection'
        run: exit 1
      - name: EC callsite - timeout other
        if: steps.classify.outputs.site == 'ec-timeout-other'
        run: exit 1
      - name: EC callsite - assertion other
        if: steps.classify.outputs.site == 'ec-assert-other'
        run: exit 1
      - name: EC callsite - other
        if: steps.classify.outputs.site == 'ec-other' || steps.classify.outputs.site == 'unknown'
        run: exit 1
      - name: V2.1 callsite verdict
        if: always()
        run: test '${{ steps.browser.outcome }}' = success

  finetuning-ec-callsite:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve browser
        shell: bash
        run: |
          set -Eeuo pipefail
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$c")" >> "$GITHUB_ENV"; exit 0; fi
          done
          exit 1
      - name: Start runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4874 PORT=4874 ICTC_BASE_URL=http://127.0.0.1:4874
          export ICTC_STATE_DIR="$RUNNER_TEMP/state-ft" ICTC_RUNTIME_DIR="$RUNNER_TEMP/runtime-ft" ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
          echo "ICTC_STATE_DIR=$ICTC_STATE_DIR" >> "$GITHUB_ENV"
          echo "ICTC_RUNTIME_DIR=$ICTC_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Run finetuning base
        id: browser
        continue-on-error: true
        run: python -u v3/browser-procedure-finetuning-1-4-base.py
      - name: Stop runtime
        if: always()
        run: ./ictc.sh stop --profile current || true
      - name: Classify finetuning EC callsite
        id: classify
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('artifacts/browser-procedure-finetuning-1-4-error.json')
          payload=json.loads(p.read_text(encoding='utf8')) if p.exists() else {}
          phase=str(payload.get('phase') or ('green' if '${{ steps.browser.outcome }}'=='success' else 'unknown'))
          trace=str(payload.get('traceback') or '')
          message=str(payload.get('message') or '')
          site='green' if '${{ steps.browser.outcome }}'=='success' else 'unknown'
          checks=[
            ('ft-ec-compass-hidden', "data-finetune-compass=\"incidents\""),
            ('ft-ec-context-closed', "context_closed(page,'#incidentsView')"),
            ('ft-ec-orphans-view', "no_orphans(page,'#incidentsView')"),
            ('ft-ec-primary-click', ".procedure-frame:visible .procedure-primary').click"),
            ('ft-ec-dialog-visible', "#incidentDialog')).to_be_visible"),
            ('ft-ec-case-title', "[name=\"caseTitle\"]"),
            ('ft-ec-orphans-dialog', "no_orphans(page,'#incidentDialog')"),
            ('ft-ec-close-dialog', "#incidentDialog button[aria-label=\"Chiudi\"]"),
          ]
          for label,needle in checks:
            if needle in trace:
              site=label; break
          if site=='unknown' and (phase=='ec' or phase.startswith('EC-01')):
            if 'TimeoutError' in trace or 'TimeoutError' in message: site='ft-ec-timeout-other'
            elif 'AssertionError' in trace: site='ft-ec-assert-other'
            else: site='ft-ec-other'
          print('ICTC_CALLSITE',site,'PHASE',phase,'TYPE',payload.get('type'),'MESSAGE',message[:500])
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as f:
            f.write('site='+site+'\n'); f.write('phase='+phase+'\n')
          PY
      - name: FT EC callsite - compass hidden
        if: steps.classify.outputs.site == 'ft-ec-compass-hidden'
        run: exit 1
      - name: FT EC callsite - context closed
        if: steps.classify.outputs.site == 'ft-ec-context-closed'
        run: exit 1
      - name: FT EC callsite - orphans view
        if: steps.classify.outputs.site == 'ft-ec-orphans-view'
        run: exit 1
      - name: FT EC callsite - primary click
        if: steps.classify.outputs.site == 'ft-ec-primary-click'
        run: exit 1
      - name: FT EC callsite - dialog visible
        if: steps.classify.outputs.site == 'ft-ec-dialog-visible'
        run: exit 1
      - name: FT EC callsite - case title
        if: steps.classify.outputs.site == 'ft-ec-case-title'
        run: exit 1
      - name: FT EC callsite - orphans dialog
        if: steps.classify.outputs.site == 'ft-ec-orphans-dialog'
        run: exit 1
      - name: FT EC callsite - close dialog
        if: steps.classify.outputs.site == 'ft-ec-close-dialog'
        run: exit 1
      - name: FT EC callsite - timeout other
        if: steps.classify.outputs.site == 'ft-ec-timeout-other'
        run: exit 1
      - name: FT EC callsite - assertion other
        if: steps.classify.outputs.site == 'ft-ec-assert-other'
        run: exit 1
      - name: FT EC callsite - other
        if: steps.classify.outputs.site == 'ft-ec-other' || steps.classify.outputs.site == 'unknown'
        run: exit 1
      - name: Finetuning callsite verdict
        if: always()
        run: test '${{ steps.browser.outcome }}' = success
