name: onto-compliance-diagnostic

on:
  push:
    branches:
      - agent/uiux-converge-0-common-grammar

concurrency:
  group: onto-compliance-diagnostic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    name: diagnostic / onto-compliance-signatures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          if [[ -z "$browser" || ! -x "$browser" ]]; then exit 1; fi
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
      - name: Run onto audit and expose anomaly signatures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          export PYTHONUNBUFFERED=1 ICTC_NO_OPEN=1 ICTC_PORT=4807 PORT=4807
          export ICTC_BASE_URL="http://127.0.0.1:4807"
          export ICTC_STATE_DIR="$RUNNER_TEMP/onto-diagnostic-state"
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/onto-diagnostic-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          trap './ictc.sh stop --profile current || true' EXIT
          status=0
          python -u v3/browser-onto-compliance-v1.py || status=$?
          STATUS="$status" python - <<'PY'
          import json, os, pathlib, urllib.request
          path=pathlib.Path('artifacts/browser-onto-compliance-v1-error.json')
          payload=json.loads(path.read_text(encoding='utf8')) if path.exists() else {'phase':'no-artifact','anomalies':[]}
          token=os.environ['GH_TOKEN']; repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['GITHUB_SHA']
          def safe(v,n=58):
              s=''.join(c if c.isalnum() or c in '._-' else '-' for c in str(v or 'none'))
              return s[:n] or 'none'
          def post(context, description):
              body=json.dumps({'state':'success','context':context[:100],'description':description[:140]}).encode()
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',data=body,method='POST',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              urllib.request.urlopen(req,timeout=10).read()
          post('ictc/onto-diag/phase', f"status={os.environ.get('STATUS')} phase={payload.get('phase','unknown')} count={len(payload.get('anomalies') or [])}")
          unique=[]; seen=set()
          for a in payload.get('anomalies') or []:
              sig=(a.get('kind'),a.get('surface'),a.get('role'),a.get('viewport'))
              if sig in seen: continue
              seen.add(sig); unique.append(a)
          for i,a in enumerate(unique[:24],1):
              context=f"ictc/onto-diag/{i:02d}-{safe(a.get('kind'),34)}-{safe(a.get('surface'),18)}-{safe(a.get('role'),10)}-{safe(a.get('viewport'),10)}"
              measured=json.dumps(a.get('measured'),ensure_ascii=True,separators=(',',':'))
              post(context, f"expected={str(a.get('expected'))[:52]} measured={measured[:78]}")
          PY
          exit 0
