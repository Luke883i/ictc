name: ictc-ui-standard-diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Replay canonical semantic authority
        run: npm run test:current:semantic
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Historical UI-standard browser replay syntax
        run: python -m py_compile v3/browser-v1-9-experience.py v3/browser-v2-epistemic.py v3/browser-ui-epistemic-convergence.py v3/browser-v2-1-procedure-journey.py v3/browser-pr60-polish.py v3/browser-onto-compliance-v1.py v3/browser-procedure-finetuning-1-4.py
      - name: Resolve system Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$candidate")" >> "$GITHUB_ENV"; exit 0; fi
          done
          echo 'No supported Chromium browser found' >&2
          exit 1
      - name: Replay historical UI-standard browser matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4807 PORT=4807
          export ICTC_BASE_URL="http://127.0.0.1:4807"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-ui-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-ui-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          trap './ictc.sh stop --profile current || true' EXIT
          python -u v3/browser-v1-9-experience.py
          python -u v3/browser-v2-epistemic.py
          python -u v3/browser-ui-epistemic-convergence.py
          python -u v3/browser-v2-1-procedure-journey.py
          python -u v3/browser-pr60-polish.py
          python -u v3/browser-onto-compliance-v1.py
          python -u v3/browser-procedure-finetuning-1-4.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: ictc-ui-standard-diagnostic-browser
          path: |
            artifacts/browser-v1-9*.json
            artifacts/browser-v2-epistemic*.json
            artifacts/browser-ui-epistemic-convergence*.json
            artifacts/browser-v2-1*.json
            artifacts/browser-pr60*.json
            artifacts/browser-onto-compliance*.json
            artifacts/browser-procedure-finetuning-1-4*.json
            artifacts/ux-*.png
          if-no-files-found: warn
          retention-days: 30
