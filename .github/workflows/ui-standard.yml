name: ictc-ui-standard
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-ui-standard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Surface standard and triple saturation
        run: node v3/enterprise-2-ui-standard-check.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-ui-standard-assurance
          path: artifacts/enterprise-2-ui-standard-*.json
          if-no-files-found: warn
          retention-days: 30

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Browser contract syntax
        run: python -m py_compile v3/browser-enterprise-2-ui-standard-check.py
      - name: Resolve system Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$candidate")" >> "$GITHUB_ENV"; exit 0; fi
          done
          echo 'No supported Chromium browser found' >&2
          exit 1
      - name: Server-backed UI standard journey
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4807 PORT=4807
          export ICTC_BASE_URL="http://127.0.0.1:4807" ICTC_MOCK_URL="http://127.0.0.1:4899"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-ui-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-ui-runtime"
          export ICTC_ALLOW_PRIVATE_AI=1 ICTC_LLM_API_KEY="test-key" ICTC_SCHEDULER_TICK_MS=100000
          node v3/mock-ai-provider.mjs >"$RUNNER_TEMP/ictc-ui-mock.log" 2>&1 &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true; ./ictc.sh stop --profile current || true' EXIT
          for _ in $(seq 1 50); do curl -fsS http://127.0.0.1:4899 >/dev/null 2>&1 && break; sleep .1; done
          ./ictc.sh start --profile current --no-open
          python -u v3/browser-enterprise-2-ui-standard-check.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-ui-standard-browser
          path: |
            artifacts/browser-enterprise-2-ui-standard-check.json
            artifacts/browser-enterprise-2-ui-standard-error.json
            artifacts/ui-standard-*.png
          if-no-files-found: warn
          retention-days: 30
