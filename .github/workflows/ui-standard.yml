name: ictc-ui-standard
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-ui-standard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Current active surface and authority
        run: |
          node v3/ui-active-experience-audit.mjs
          node v3/semantic-api-contract-check.mjs
          node v3/historical-ui-fixture-check.mjs
          node v3/v1-2-market-candidate-check.mjs
          node v3/v1-9-experience-check.mjs
          node v3/surface-primitives-check.mjs
          node v3/projection-commit-check.mjs
          node v3/journey-navigation-check.mjs
          node v3/procedure-journey-2-1-check.mjs
          node v3/epistemic-lattice-check.mjs
          node v3/epistemic-lattice-ui-check.mjs
          node v3/epistemic-inference-check.mjs
          node v3/epistemic-inference-ui-check.mjs
          node v3/cross-procedure-create-check.mjs
          node v3/cross-procedure-create-ui-check.mjs
          node v3/ux-language-polish-check.mjs
          node v3/epistemic-lattice-saturation.mjs
          node v3/procedure-journey-saturation.mjs
          node v3/pr60-convergence-saturation.mjs
          node v3/v1-9-experience-saturation.mjs
          node v3/procedure-policy-check.mjs
          node v3/procedure-market-saturation.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-v21-model-evidence
          path: |
            artifacts/v1-9-experience-saturation.json
            artifacts/epistemic-lattice*.json
            artifacts/procedure-journey-saturation.json
            artifacts/pr60-convergence-saturation.json
          if-no-files-found: warn
          retention-days: 30
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Browser contract syntax
        run: python -m py_compile v3/browser-v1-9-experience.py v3/browser-v2-epistemic.py v3/browser-v2-1-procedure-journey.py v3/browser-pr60-polish.py
      - name: Resolve system Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$candidate")" >> "$GITHUB_ENV"; exit 0; fi
          done
          echo 'No supported Chromium browser found' >&2
          exit 1
      - name: Server-backed Experience 1.9 + Epistemic 2.0 + Procedure Journey 2.1 + PR60 polish
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4807 PORT=4807
          export ICTC_BASE_URL="http://127.0.0.1:4807"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-ui-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-ui-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          trap './ictc.sh stop --profile current || true' EXIT
          python -u v3/browser-v1-9-experience.py
          python -u v3/browser-v2-epistemic.py
          python -u v3/browser-v2-1-procedure-journey.py
          python -u v3/browser-pr60-polish.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-v21-browser-evidence
          path: |
            artifacts/browser-v1-9*.json
            artifacts/browser-v2-epistemic*.json
            artifacts/browser-v2-1*.json
            artifacts/browser-pr60*.json
            artifacts/ux-v19-*.png
            artifacts/ux-v20-*.png
            artifacts/ux-v21-*.png
            artifacts/ux-pr60-*.png
          if-no-files-found: warn
          retention-days: 30
