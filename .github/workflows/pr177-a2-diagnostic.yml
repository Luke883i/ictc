name: pr177-a2-diagnostic
on:
  push:
    branches:
      - agent/pr177-a2-diagnostic
    paths-ignore:
      - diagnostics/pr177-a2/**
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          test -n "$browser" && test -x "$browser"
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
      - name: Start exact-head demo
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4822 PORT=4822
          export ICTC_BASE_URL="http://127.0.0.1:4822"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-pr177-a2-state"
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-pr177-a2-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000 ICTC_DEMO_STARTUP_ATTEMPTS=900
          export ICTC_EXPECT_BUILD_SHA="$GITHUB_SHA"
          ./ictc.sh demo --profile current --no-open
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
          echo "ICTC_STATE_DIR=$ICTC_STATE_DIR" >> "$GITHUB_ENV"
          echo "ICTC_RUNTIME_DIR=$ICTC_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "ICTC_EXPECT_BUILD_SHA=$ICTC_EXPECT_BUILD_SHA" >> "$GITHUB_ENV"
      - name: Reproduce and persist diagnostic
        shell: bash
        run: |
          set +e
          python -u v3/browser-s4-a2-editorial-composition.py
          status=$?
          set -e
          mkdir -p diagnostics/pr177-a2
          if [[ -f artifacts/browser-s4-a2-editorial-composition-error.json ]]; then
            cp artifacts/browser-s4-a2-editorial-composition-error.json diagnostics/pr177-a2/error.json
          elif [[ -f artifacts/browser-s4-a2-editorial-composition.json ]]; then
            cp artifacts/browser-s4-a2-editorial-composition.json diagnostics/pr177-a2/report.json
          else
            printf '{"ok":false,"message":"no browser artifact","status":%s}\n' "$status" > diagnostics/pr177-a2/error.json
          fi
          git config user.name "ictc-diagnostic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/pr177-a2
          git commit -m "diagnostic: persist PR177 A2 browser failure [skip ci]" || true
          git push origin HEAD:agent/pr177-a2-diagnostic
      - name: Stop demo
        if: always()
        run: ./ictc.sh stop --profile current || true
