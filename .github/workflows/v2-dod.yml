name: v2-dod
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-dod-${{ github.ref }}
  cancel-in-progress: true
jobs:
  v2-definition-of-done:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: npm run check
      - name: V2 GRC domain contracts
        run: node v3/grc-object-check.mjs && node v3/grc-mapping-check.mjs && node v3/grc-action-check.mjs && node v3/grc-risk-check.mjs && node v3/grc-assurance-check.mjs
      - name: V2 semantic convergence
        run: node v3/process-kernel-check.mjs && node v3/v2-grc-convergence-check.mjs && node v3/semantic-api-contract-check.mjs
      - name: V2 semantic saturation
        run: node v3/v2-grc-saturation.mjs
      - name: V2 UX saturation
        run: node v3/v2-ux-saturation.mjs
      - name: V2 global DoD
        run: node v3/v2-global-dod-check.mjs
      - name: Product and UI contracts
        run: node v3/product-contract-check.mjs && node v3/question-audit-check.mjs && node v3/ui-contract-check.mjs
      - name: Ontology and epistemic audit
        run: node v3/onto-epistemic-audit.mjs
      - name: Journey audit
        run: node v3/user-journey-audit.mjs && node v3/user-journey-2-check.mjs
      - name: Evidence and decision binding
        run: node v3/decision-binding-check.mjs && node v3/epistemic-projection-check.mjs && node v3/evidence-export-check.mjs && node v3/evidence-export-auth-check.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v2-dod-evidence
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30
