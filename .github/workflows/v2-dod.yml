name: v2-dod
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-dod-${{ github.ref }}
  cancel-in-progress: true
jobs:
  v2-definition-of-done:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: npm run check
      - name: V2 GRC domain contracts
        run: node tests/verification/grc-object-check.mjs && node tests/verification/grc-mapping-check.mjs && node tests/verification/grc-action-check.mjs && node tests/verification/grc-risk-check.mjs && node tests/verification/grc-assurance-check.mjs
      - name: V2 semantic convergence
        run: node tests/verification/process-kernel-check.mjs && node tests/verification/v2-grc-convergence-check.mjs && node tests/verification/semantic-api-contract-check.mjs
      - name: V2 semantic saturation
        run: node tests/verification/v2-grc-saturation.mjs
      - name: V2 UX saturation
        run: node tests/verification/v2-ux-saturation.mjs
      - name: V2 global DoD
        run: node tests/verification/v2-global-dod-check.mjs
      - name: Product and UI contracts
        run: node tests/verification/product-contract-check.mjs && node tests/verification/question-audit-check.mjs && node tests/verification/ui-contract-check.mjs
      - name: Ontology and epistemic audit
        run: node tests/verification/onto-epistemic-audit.mjs
      - name: Journey audit
        run: node tests/verification/user-journey-audit.mjs && node tests/verification/user-journey-2-check.mjs
      - name: Evidence and decision binding
        run: node tests/verification/decision-binding-check.mjs && node tests/verification/epistemic-projection-check.mjs && node tests/verification/evidence-export-check.mjs && node tests/verification/evidence-export-auth-check.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: v2-dod-evidence
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30
