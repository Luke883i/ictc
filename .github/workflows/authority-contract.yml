name: ictc-authority-contract
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-authority-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22'}
      - name: Validate executable authority
        run: node v3/authority-contract-check.mjs
      - name: Validate portable bootstrap authority
        run: node v3/bootstrap-contract-check.mjs
      - name: Falsify portable bootstrap authority
        run: node v3/bootstrap-contract-saturation-1m.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: ictc-authority-contract
          path: artifacts/authority-contract-check.json
          if-no-files-found: error
          retention-days: 30
