name: ictc-authority-contract
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-authority-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22'}
      - name: Validate executable authority
        run: node v3/authority-contract-check.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-authority-contract
          path: artifacts/authority-contract-check.json
          if-no-files-found: error
          retention-days: 30
