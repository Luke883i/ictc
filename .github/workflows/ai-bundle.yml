name: ictc-ai-bundle
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-ai-bundle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify sealed bundle twice
        run: |
          python3 ai/ictc-agent-bundle/tools/verify_integrity.py ai/ictc-agent-bundle
          python3 ai/ictc-agent-bundle/tools/verify_integrity.py ai/ictc-agent-bundle
      - name: Compile and self-test autopoiesis
        run: |
          python3 -m compileall -q ai/ictc-agent-bundle
          python3 ai/ictc-agent-bundle/tools/selftest.py ai/ictc-agent-bundle
      - name: Rebuild deterministic archive
        run: |
          python3 ai/ictc-agent-bundle/tools/build_bundle.py ai/ictc-agent-bundle --zip dist/ICTC_AI_HANDOFF_BUNDLE_V1.zip
          sha256sum -c dist/ICTC_AI_HANDOFF_BUNDLE_V1.zip.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: ictc-ai-handoff-bundle
          path: dist/ICTC_AI_HANDOFF_BUNDLE_V1.zip
          retention-days: 30
