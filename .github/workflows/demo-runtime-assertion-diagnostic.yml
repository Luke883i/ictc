name: ictc-demo-runtime-assertion-diagnostic
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: ictc-demo-runtime-assertion-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  demo-runtime-assertion-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Execute DEMO runtime checker
        id: demo-runtime
        continue-on-error: true
        shell: bash
        run: |
          set +e
          output=$(node v3/demo-seed-runtime-check.mjs 2>&1)
          rc=$?
          printf '%s\n' "$output"
          reason=$(printf '%s\n' "$output" | grep -m1 -E 'AssertionError|Error:' | tr '\n' ' ' | cut -c1-360)
          if [[ -z "$reason" ]]; then reason=$(printf '%s\n' "$output" | grep -m1 -E 'ERR_ASSERTION|expected|actual' | tr '\n' ' ' | cut -c1-360); fi
          if [[ -z "$reason" ]]; then reason=$(printf '%s\n' "$output" | tail -1 | cut -c1-360); fi
          echo "reason=${reason:-unknown}" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Publish exact-head runtime assertion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OUTCOME: ${{ steps.demo-runtime.outcome }}
          REASON: ${{ steps.demo-runtime.outputs.reason }}
        shell: bash
        run: |
          set -Eeuo pipefail
          post() {
            local context="$1" state="$2" description="$3"
            local payload
            payload=$(printf '{"state":"%s","context":"%s","description":"%s"}' "$state" "$context" "$description")
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -d "$payload" >/dev/null
          }
          if [[ "$OUTCOME" == success ]]; then
            post 'ictc/demo-runtime-assertion' success 'DEMO runtime checker passed'
            exit 0
          fi
          slug=$(printf '%s' "${REASON:-unknown}" | tr -cs 'A-Za-z0-9._-' '-' | cut -c1-110)
          post 'ictc/demo-runtime-assertion' failure 'DEMO runtime checker failed'
          post "ictc/demo-runtime-failure/$slug" failure 'exact server-backed assertion failure'
          exit 1
