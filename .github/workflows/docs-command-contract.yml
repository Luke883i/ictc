name: ictc-docs-command-contract
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-docs-command-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs-command-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22'}
      - name: Validate documented commands
        run: node v3/docs-command-contract-check.mjs
      - name: Inventory tracked source and fail closed on unknown retirement
        run: npm run repo:inventory
      - name: Reject fabricated census, hash and deletion receipts
        run: npm run repo:inventory:falsify
      - name: Seeded retirement semantics and negative controls
        run: npm run repo:retirement:mutations
      - name: Qualify each unregistered document with isolated removal counterfactual
        run: npm run docs:causal
      - name: Enumerate canonical business-journey E2E denominator
        run: npm run e2e:denominator
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: ictc-docs-command-contract
          path: |
            artifacts/docs-command-contract.json
            artifacts/repository-inventory.json
            artifacts/repository-retirement-mutations.json
            artifacts/repository-inventory-falsification.json
            artifacts/document-causal-qualification.json
            artifacts/e2e-journey-denominator.json
          if-no-files-found: error
          retention-days: 30
