name: ictc-docs-command-contract
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-docs-command-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs-command-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # C1-3c checks ancestry and original Git blob bytes for six historical documents
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22'}
      - name: Validate documented commands
        run: node v3/docs-command-contract-check.mjs
      - name: Inventory tracked source and fail closed on unknown retirement
        run: npm run repo:inventory
      - name: Reject fabricated census, hash and deletion receipts
        run: npm run repo:inventory:falsify
      - name: Seeded retirement semantics and negative controls
        run: npm run repo:retirement:mutations
      - name: Refute legacy-tool promotion and stale current-runtime claims (C1-2 F7)
        run: node scripts/repository-compatibility-falsification.mjs --falsify
      - name: Verify sealed PR8 handoff integrity without source changes
        run: python3 -B audit/archive/ictc-agent-bundle/tools/verify_integrity.py audit/archive/ictc-agent-bundle
      - name: Qualify each unregistered document with isolated removal counterfactual
        run: npm run docs:causal
      - name: Protect first-party executable document references with physical deletion falsification
        run: node scripts/executable-doc-reference-check.mjs --falsify
      - name: Run seven-procedure three-role guide HTTP E2E and forbidden placeholders
        run: node v3/e2e-guide-7x3-check.mjs
      - name: Qualify remaining document retention exposure individually
        run: node scripts/document-retention-review.mjs --falsify
      - name: Prove scoped cross-process writes and receipts under live HTTP
        run: node v3/e2e-cross-process-receipts-check.mjs
      - name: Simulated reasoned decisions across RN EC AO with real HTTP receipts
        run: node v3/e2e-simulated-decisions-check.mjs
      - name: Enumerate canonical business-journey E2E denominator
        run: npm run e2e:denominator
      - name: Reconcile actual receipts with each of 53 declared journey steps (no full-step inflation)
        run: node scripts/e2e-step-evidence-audit.mjs --falsify
      - name: Exhaustively prove bounded 12-axis retirement diagnostic encoding
        run: node scripts/repository-retirement-mutations.mjs --cases=1 --negatives=1 --exhaustive-proof
      - name: Independently scan all 149 document consumers before the retirement adjudication (C1-3b)
        run: node scripts/document-consumer-independent-check.mjs --falsify
      - name: Reconcile independent evidence and reject false historical-retirement claims (C1-3b)
        run: node scripts/document-retirement-gate-check.mjs --falsify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: ictc-docs-command-contract
          path: |
            artifacts/docs-command-contract.json
            artifacts/repository-inventory.json
            artifacts/repository-retirement-mutations.json
            artifacts/repository-inventory-falsification.json
            artifacts/document-causal-qualification.json
            artifacts/e2e-journey-denominator.json
            artifacts/e2e-guides-7x3.json
            artifacts/executable-doc-reference.json
            artifacts/document-retention-review.json
            artifacts/e2e-cross-process-receipts.json
            artifacts/e2e-step-evidence-ledger.json
            artifacts/retirement-minimality-certificate.json
            artifacts/document-retirement-gate.json
            artifacts/independent-document-consumer-scan.json
            artifacts/model-assisted-decision-receipts.json
          if-no-files-found: error
          retention-days: 30
