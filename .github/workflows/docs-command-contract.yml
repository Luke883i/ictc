name: ictc-docs-command-contract
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-docs-command-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs-command-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22'}
      - name: Validate documented commands
        run: node v3/docs-command-contract-check.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-docs-command-contract
          path: artifacts/docs-command-contract.json
          if-no-files-found: error
          retention-days: 30
