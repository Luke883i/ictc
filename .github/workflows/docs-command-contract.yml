name: ictc-docs-command-contract
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-docs-command-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs-command-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22'}
      - name: Validate documented commands
        run: node v3/docs-command-contract-check.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: ictc-docs-command-contract
          path: artifacts/docs-command-contract.json
          if-no-files-found: error
          retention-days: 30
