name: ictc-docs-command-contract
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-docs-command-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs-command-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22'}
      - name: Validate documented commands
        run: node v3/docs-command-contract-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v6
        if: always()
        with:
          name: ictc-docs-command-contract
          path: artifacts/docs-command-contract.json
          if-no-files-found: error
          retention-days: 30
