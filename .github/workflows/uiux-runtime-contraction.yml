name: UIUX runtime contraction

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uiux-runtime-contraction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-contraction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Runtime contraction contract
        run: node v3/uiux-runtime-contraction-check.mjs
      - name: Runtime contraction semantic saturation 1M
        run: node v3/uiux-runtime-contraction-saturation-1m.mjs
