name: ictc-security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          mkdir -p artifacts
          npm sbom --sbom-format cyclonedx > artifacts/ictc-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: ictc-sbom
          path: artifacts/ictc-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
  runtime-security-dod:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: node v3/security-runtime-dod-check.mjs
      - run: node v3/security-implementation-mutants.mjs
      - run: node v3/security-main-mutation-1m.mjs
      - run: node v3/security-attack-saturation.mjs
      - run: npm run public-demo:check
      - run: npm run public-demo:saturation
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: ictc-security-runtime-dod
          path: |
            artifacts/security-runtime-dod.json
            artifacts/security-implementation-mutants.json
            artifacts/security-main-mutation-1m.json
            artifacts/security-attack-saturation.json
          if-no-files-found: error
          retention-days: 30
  repository-sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22'}
      - run: node v3/workflow-action-pin-check.mjs
      - run: node v3/security-sast-check.mjs
      - run: node v3/security-static-analysis-posture.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: ictc-security-sast
          path: |
            artifacts/security-sast.json
            artifacts/security-static-analysis-posture.json
          if-no-files-found: error
          retention-days: 30
  fi01-dom-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22'}
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          if [[ -z "$browser" || ! -x "$browser" ]]; then echo 'No supported system Chromium browser found on the runner' >&2; exit 1; fi
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - run: node --check v3/security-fi01-dom-cdp-check.mjs
      - run: node v3/security-fi01-dom-cdp-check.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: ictc-security-fi01-dom
          path: artifacts/security-fi01-dom-browser.json
          if-no-files-found: error
          retention-days: 30
  codeql:
    if: ${{ vars.ICTC_ENABLE_GHAS == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with: {languages: javascript-typescript}
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
