name: ictc-post-merge-evidence
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run test:current
      - name: Release health
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4807 ICTC_RUNTIME_DIR="$RUNNER_TEMP/runtime" ICTC_STATE_DIR="$RUNNER_TEMP/state"
          trap './ictc.sh stop --profile current || true' EXIT
          ./ictc.sh start --profile current --no-open
          curl -fsS http://127.0.0.1:4807/api/health > artifacts/post-merge-health.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: ictc-post-merge-evidence
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 60
