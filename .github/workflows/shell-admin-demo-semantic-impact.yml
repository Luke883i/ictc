name: Experience | Admin demo semantics
on: [pull_request, workflow_dispatch]
permissions: {contents: read}
concurrency:
  group: shell-admin-demo-semantic-impact-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semantic-impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: syntax, cmd: 'node scripts/syntax-check.mjs'}
          - {name: contract-2-6, cmd: 'node tests/verification/shell-admin-demo-check-2-6.mjs'}
          - {name: saturation-2-6, cmd: 'node tests/verification/shell-admin-demo-saturation-2-6.mjs'}
          - {name: demo-suite-2-2, cmd: 'node tests/verification/demo-suite-2-2-runtime-semantic-check.mjs'}
          - {name: native-shell, cmd: 'node tests/verification/native-shell-check.mjs'}
          - {name: v1-9-experience, cmd: 'node tests/verification/v1-9-experience-check.mjs'}
          - {name: refined-product, cmd: 'node tests/verification/refined-product-check.mjs'}
          - {name: active-experience, cmd: 'node tests/verification/ui-active-experience-audit.mjs'}
          - {name: constitution, cmd: 'node tests/verification/experience-constitution-check.mjs'}
          - {name: procedure-contracts, cmd: 'node tests/verification/procedure-contracts-check.mjs'}
          - {name: ux-language, cmd: 'node tests/verification/ux-language-polish-check.mjs'}
          - {name: visual-grace, cmd: 'node tests/verification/visual-grace-lexical-epistemic-check.mjs'}
          - {name: visual-runtime, cmd: 'node tests/verification/visual-epistemic-runtime-check.mjs'}
    name: semantic-impact-${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: ${{ matrix.cmd }}
