name: audit-evidence-ca6017b

on:
  push:
    branches:
      - agent/audit-evidence-ca6017b

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, '[skip audit-evidence]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22'}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - name: Materialize exact main snapshot
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/ictc-main ca6017b76f33d951ac5e3e5ee3db5f155e6a1fff
          cd /tmp/ictc-main
          npm ci --ignore-scripts
          python -m pip install --disable-pip-version-check playwright==1.57.0
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          test -n "$browser"
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
      - name: Start exact main DEMO
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ictc-main
          export ICTC_NO_OPEN=1 PORT=4831 ICTC_PORT=4831
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-audit-state"
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-audit-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          nohup npm run demo >"$RUNNER_TEMP/ictc-audit-server.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/ictc-audit-server.pid"
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:4831/api/health >/tmp/health.json && break
            sleep 1
          done
          test -s /tmp/health.json
          cat /tmp/health.json
      - name: Capture complete end-user evidence
        shell: bash
        env:
          ICTC_BASE_URL: http://127.0.0.1:4831
        run: |
          set -euo pipefail
          cd /tmp/ictc-main
          mkdir -p artifacts/audit-dossier
          cat > /tmp/capture_audit.py <<'PY'
import json, os, pathlib, traceback
from playwright.sync_api import sync_playwright, expect

BASE=os.environ['ICTC_BASE_URL'].rstrip('/')
OUT=pathlib.Path('/tmp/ictc-main/artifacts/audit-dossier')
OUT.mkdir(parents=True,exist_ok=True)
TARGET='ca6017b76f33d951ac5e3e5ee3db5f155e6a1fff'
SURFACES=[
 ('home','home',None,'#homeView'),
 ('processes','processes',None,'#processesView'),
 ('monitoring','monitoring',None,'#monitoringView'),
 ('incidents','incidents',None,'#incidentsView'),
 ('objects','grc','objects','#grcWorkspace'),
 ('coverage','grc','coverage','#grcWorkspace'),
 ('actions','grc','actions','#grcWorkspace'),
 ('risks','grc','risks','#grcWorkspace'),
 ('assurance','grc','assurance','#grcWorkspace'),
 ('proof','proof',None,'#proofView'),
 ('epistemic','epistemic',None,'#epistemicView'),
 ('admin','admin',None,'#adminCenter'),
 ('ai-settings','ai-settings',None,'#settingsDialog'),
]
VIEWPORTS=[('desktop',1440,1000),('mobile',390,844)]
records=[]
errors=[]

def visible_text(page,selector):
    try:
        return page.locator(selector).inner_text(timeout=1500).strip()
    except:
        return ''

def meta(page,label,role,viewport,kind='surface'):
    return {
      'label':label,'role':role,'viewport':viewport,'kind':kind,
      'surface':page.locator('html').get_attribute('data-ictc-surface'),
      'workspace':page.locator('html').get_attribute('data-ictc-workspace'),
      'title':page.title(),
      'h1':page.locator('h1:visible').all_inner_texts()[:8],
      'h2':page.locator('h2:visible').all_inner_texts()[:12],
      'buttons':[x.strip() for x in page.locator('button:visible').all_inner_texts() if x.strip()][:30],
      'rootDataset':page.evaluate("()=>({...document.documentElement.dataset})"),
      'url':page.url
    }

def context(browser,role,w,h,service='home'):
    ctx=browser.new_context(viewport={'width':w,'height':h})
    ctx.add_init_script(f"""localStorage.setItem('ictc-role','{role}');localStorage.setItem('ictc-service','{service}');localStorage.setItem('ictc-profile','demo');""")
    return ctx

def ready(page):
    page.wait_for_function("()=>document.documentElement.dataset.enduserComposition==='p2'",timeout=30000)
    page.wait_for_timeout(450)

def mount(page,surface,view,procedure,root):
    if view=='grc':
        page.goto(f'{BASE}/?view=grc&procedure={procedure}',wait_until='networkidle')
        page.wait_for_function("p=>document.querySelector('#grcWorkspace')?.dataset.compositionSurface===p",arg=procedure,timeout=30000)
    elif view=='admin':
        page.goto(f'{BASE}/?view=home',wait_until='networkidle'); ready(page)
        menu=page.locator('#stableProfileMenu')
        if menu.get_attribute('open') is None: menu.locator(':scope > summary').click()
        page.locator('#openAdminCenter').click(); expect(page.locator('#adminCenter')).to_be_visible()
        page.wait_for_timeout(600)
    elif view=='ai-settings':
        page.goto(f'{BASE}/?view=home',wait_until='networkidle'); ready(page)
        menu=page.locator('#stableProfileMenu')
        if menu.get_attribute('open') is None: menu.locator(':scope > summary').click()
        page.locator('#openSettings').click(); expect(page.locator('#settingsDialog')).to_be_visible()
        page.wait_for_timeout(500)
    else:
        page.goto(f'{BASE}/?view={view}',wait_until='networkidle')
        page.wait_for_timeout(350)
    ready(page)
    if root:
        expect(page.locator(root)).to_be_visible()

def shot(page,name,role,viewport,kind='surface'):
    path=OUT/f'{name}.png'
    page.screenshot(path=str(path),full_page=True)
    rec=meta(page,name,role,viewport,kind); rec['file']=path.name
    records.append(rec)

with sync_playwright() as pw:
    launch={'headless':True,'args':['--no-sandbox']}
    if os.environ.get('ICTC_CHROMIUM'): launch['executable_path']=os.environ['ICTC_CHROMIUM']
    browser=pw.chromium.launch(**launch)

    # 13 canonical surfaces, desktop + mobile, admin role.
    for vp,w,h in VIEWPORTS:
        for surface,view,procedure,root in SURFACES:
            ctx=context(browser,'admin',w,h,view if view not in ('admin','ai-settings') else 'home')
            page=ctx.new_page()
            try:
                mount(page,surface,view,procedure,root)
                shot(page,f'{vp}__admin__{surface}','admin',vp)
            except Exception as e:
                errors.append({'phase':f'{vp}/admin/{surface}','error':repr(e),'trace':traceback.format_exc()})
                try: page.screenshot(path=str(OUT/f'ERROR__{vp}__admin__{surface}.png'),full_page=True)
                except: pass
            finally:
                ctx.close()

    # Material role-sensitive views on desktop.
    role_cases=[
      ('user','home','home',None,'#homeView'),
      ('auditor','home','home',None,'#homeView'),
      ('user','processes','processes',None,'#processesView'),
      ('auditor','processes','processes',None,'#processesView'),
      ('user','monitoring','monitoring',None,'#monitoringView'),
      ('auditor','monitoring','monitoring',None,'#monitoringView'),
      ('user','incidents','incidents',None,'#incidentsView'),
      ('auditor','incidents','incidents',None,'#incidentsView'),
      ('auditor','objects','grc','objects','#grcWorkspace'),
      ('user','actions','grc','actions','#grcWorkspace'),
      ('auditor','proof','proof',None,'#proofView'),
      ('auditor','epistemic','epistemic',None,'#epistemicView'),
    ]
    for role,surface,view,procedure,root in role_cases:
        ctx=context(browser,role,1440,1000,view)
        page=ctx.new_page()
        try:
            mount(page,surface,view,procedure,root)
            shot(page,f'desktop__{role}__{surface}',role,'desktop','role-sensitive')
        except Exception as e:
            errors.append({'phase':f'desktop/{role}/{surface}','error':repr(e),'trace':traceback.format_exc()})
        finally: ctx.close()

    # Admin tabs.
    ctx=context(browser,'admin',1440,1000,'home'); page=ctx.new_page()
    try:
        mount(page,'admin','admin',None,'#adminCenter')
        for tab in ['overview','ai','identity']:
            nav=page.locator(f'#adminCenter [data-admin-nav="{tab}"]')
            if nav.count():
                nav.click(); page.wait_for_timeout(450)
                shot(page,f'desktop__admin__admin-{tab}','admin','desktop','admin-tab')
    except Exception as e: errors.append({'phase':'admin-tabs','error':repr(e),'trace':traceback.format_exc()})
    finally: ctx.close()

    # Dialog/subsurface captures.
    def capture_dialog(label,route,role,open_fn,dialog_sel,procedure=None):
        ctx=context(browser,role,1440,1000,route)
        page=ctx.new_page()
        try:
            if route=='grc': mount(page,label,'grc',procedure,'#grcWorkspace')
            else: mount(page,label,route,None,{'monitoring':'#monitoringView','incidents':'#incidentsView'}.get(route,None))
            open_fn(page)
            expect(page.locator(dialog_sel)).to_be_visible(timeout=10000)
            page.wait_for_timeout(350)
            shot(page,f'desktop__{role}__{label}',role,'desktop','dialog/subsurface')
        except Exception as e:
            errors.append({'phase':label,'error':repr(e),'trace':traceback.format_exc()})
        finally: ctx.close()

    capture_dialog('monitoring-contribution','monitoring','admin',lambda p:p.locator('#openContribution').click(),'#contributionDialog')
    capture_dialog('monitoring-scheduler','monitoring','admin',lambda p:p.locator('[data-rn-open-scheduler]').first.click(),'#jobDialog')
    capture_dialog('monitoring-source-review','monitoring','admin',lambda p:p.locator('[data-open-source]').first.click(),'#sourceDialog')
    capture_dialog('monitoring-plan-review','monitoring','admin',lambda p:p.locator('[data-open-plan]').first.click(),'#planDialog')
    capture_dialog('incident-intake','incidents','user',lambda p:p.locator('#openIncident').click(),'#incidentDialog')
    capture_dialog('incident-workspace','incidents','auditor',lambda p:p.locator('[data-open-incident]').first.click(),'#incidentWorkspace')

    # Coverage library and scope overlay, if available.
    ctx=context(browser,'admin',1440,1000,'grc'); page=ctx.new_page()
    try:
        mount(page,'coverage','grc','coverage','#grcWorkspace')
        lib=page.locator('#grcWorkspace [data-market-library]')
        if lib.count() and lib.get_attribute('open') is None: lib.locator(':scope > summary').click()
        page.wait_for_timeout(250)
        shot(page,'desktop__admin__coverage-library','admin','desktop','progressive-disclosure')
        scope=page.locator('#grcWorkspace .market-scope-editor').first
        if scope.count():
            if scope.get_attribute('open') is None: scope.locator(':scope > summary').click()
            page.wait_for_timeout(250)
            shot(page,'desktop__admin__coverage-scope-editor','admin','desktop','overlay')
    except Exception as e: errors.append({'phase':'coverage-overlays','error':repr(e),'trace':traceback.format_exc()})
    finally: ctx.close()

    browser.close()

health=json.loads(pathlib.Path('/tmp/health.json').read_text())
report={
 'targetSha':TARGET,
 'health':health,
 'canonicalSurfaceCount':len(SURFACES),
 'canonicalViewports':[x[0] for x in VIEWPORTS],
 'records':records,
 'errors':errors,
 'screenshotCount':len(list(OUT.glob('*.png'))),
 'claimBoundary':'Rendered Chromium evidence of exact repository main in isolated DEMO Suite 3.0. Screenshots demonstrate presentation states observed in this run; they do not prove representative-human usability, legal compliance, external truth, deployment assurance or universal accessibility effectiveness.'
}
(OUT/'capture-report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf8')
print(json.dumps({'screenshots':report['screenshotCount'],'records':len(records),'errors':len(errors),'targetSha':TARGET},ensure_ascii=False))
PY
          ICTC_CHROMIUM="$ICTC_CHROMIUM" python -u /tmp/capture_audit.py
      - name: Commit evidence to temporary audit branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _audit_evidence
          mkdir -p _audit_evidence
          cp -a /tmp/ictc-main/artifacts/audit-dossier/. _audit_evidence/
          cp "$RUNNER_TEMP/ictc-audit-server.log" _audit_evidence/server.log || true
          git config user.name "ictc-audit-evidence"
          git config user.email "ictc-audit-evidence@users.noreply.github.com"
          git add _audit_evidence
          git commit -m "audit evidence ca6017b [skip audit-evidence]"
          git push origin HEAD:agent/audit-evidence-ca6017b
