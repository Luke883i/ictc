name: audit-litebundle-ca6017b
on:
  push:
    branches:
      - agent/audit-evidence2-ca6017b
permissions:
  contents: write
jobs:
  bundle:
    if: ${{ contains(github.event.head_commit.message, '[litebundle]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Prepare exact main
        shell: bash
        run: |
          set -euo pipefail
          cp _audit_plan.py /tmp/audit_plan.py
          git worktree add --detach /tmp/ictc-main ca6017b76f33d951ac5e3e5ee3db5f155e6a1fff
          cd /tmp/ictc-main
          npm ci --ignore-scripts
          python -m pip install --disable-pip-version-check playwright==1.57.0 pillow
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          test -x "$browser"
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
      - name: Capture plan dialog
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ictc-main
          export PORT=4833 ICTC_PORT=4833 ICTC_NO_OPEN=1
          export ICTC_STATE_DIR="$RUNNER_TEMP/plan-state"
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/plan-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          nohup npm run demo >"$RUNNER_TEMP/plan-server.log" 2>&1 &
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:4833/api/health >/dev/null && break
            sleep 1
          done
          ICTC_BASE_URL=http://127.0.0.1:4833 ICTC_CHROMIUM="$ICTC_CHROMIUM" python -u /tmp/audit_plan.py
          cp -a artifacts/audit-plan/. "$GITHUB_WORKSPACE/_audit_evidence/"
      - name: Build lightweight dossier transfer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import shutil, json
          src=Path('_audit_evidence'); dst=Path('_audit_lite')
          if dst.exists(): shutil.rmtree(dst)
          dst.mkdir()
          for p in sorted(src.iterdir()):
              if p.suffix.lower()=='.png':
                  im=Image.open(p).convert('RGB')
                  if im.width>1200:
                      h=round(im.height*1200/im.width)
                      im=im.resize((1200,h),Image.Resampling.LANCZOS)
                  im.save(dst/(p.stem+'.jpg'),quality=62,optimize=True,progressive=True)
              elif p.suffix.lower() in {'.json','.log'}:
                  shutil.copy2(p,dst/p.name)
          files=sorted(x.name for x in dst.iterdir())
          (dst/'MANIFEST.json').write_text(json.dumps({'targetSha':'ca6017b76f33d951ac5e3e5ee3db5f155e6a1fff','files':files},indent=2),encoding='utf8')
          PY
          rm -rf _audit_transfer_lite
          mkdir -p _audit_transfer_lite
          tar -czf /tmp/audit-lite.tar.gz _audit_lite
          sha256sum /tmp/audit-lite.tar.gz | awk '{print $1}' > _audit_transfer_lite/SHA256.txt
          wc -c /tmp/audit-lite.tar.gz > _audit_transfer_lite/SIZE.txt
          base64 -w0 /tmp/audit-lite.tar.gz | fold -w 800000 | split -d -a 3 - _audit_transfer_lite/part-
          for f in _audit_transfer_lite/part-*; do mv "$f" "$f.txt"; done
          ls -lh _audit_transfer_lite
      - name: Commit completed evidence transfer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ictc-audit-evidence
          git config user.email ictc-audit-evidence@users.noreply.github.com
          git add _audit_evidence _audit_transfer_lite
          git commit -m "complete audit evidence lite transfer [skip audit-evidence] [skip followup] [skip litebundle]"
          git push origin HEAD:agent/audit-evidence2-ca6017b
