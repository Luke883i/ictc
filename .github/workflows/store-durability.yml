name: ictc-store-durability
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-store-durability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  store-durability:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22'}
      - name: Persist-readback-before-visible invariant
        run: node v3/store-durability-check.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-store-durability
          path: artifacts/store-durability.json
          if-no-files-found: error
          retention-days: 30
