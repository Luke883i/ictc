name: Historical Validation | V4.1 contract (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v4-1-dod-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lexical-saturation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: V4.1 lexical contract
        run: node tests/verification/v4-1-lexical-contract-check.mjs
      - name: V4.1 100k end-user language saturation
        run: node tests/verification/v4-1-language-saturation.mjs
      - name: Global V4.1 DoD
        run: node tests/verification/v4-1-global-dod-check.mjs
  screen-by-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - run: python -m py_compile tests/browser/browser-v4-1-language-check.py
      - name: Resolve system Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$candidate")" >> "$GITHUB_ENV"; exit 0; fi
          done
          exit 1
      - name: Historical V4.1 screen journey
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4815 PORT=4815 ICTC_BASE_URL="http://127.0.0.1:4815"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-v4-1-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-v4-1-runtime" ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          trap './ictc.sh stop --profile current || true' EXIT
          python -u tests/browser/browser-v4-1-language-check.py
