name: v4-1-dod
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v4-1-dod-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lexical-saturation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: V4.1 lexical contract
        run: node v3/v4-1-lexical-contract-check.mjs
      - name: V4.1 100k end-user language saturation
        run: node v3/v4-1-language-saturation.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v4-1-language-saturation
          path: artifacts/v4-1-language-saturation.json
          if-no-files-found: error
  screen-by-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - run: python -m py_compile v3/browser-v4-1-language-check.py
      - name: Resolve system Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then echo "ICTC_CHROMIUM=$(command -v "$candidate")" >> "$GITHUB_ENV"; exit 0; fi
          done
          echo 'No supported Chromium browser found' >&2
          exit 1
      - name: V4.1 screen-by-screen business language journey
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4815 PORT=4815
          export ICTC_BASE_URL="http://127.0.0.1:4815"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-v4-1-state" ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-v4-1-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          trap './ictc.sh stop --profile current || true' EXIT
          python -u v3/browser-v4-1-language-check.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v4-1-screen-audit
          path: artifacts/browser-v4-1-language*.json
          if-no-files-found: warn
