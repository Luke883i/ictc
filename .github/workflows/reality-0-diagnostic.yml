name: reality-0-diagnostic
on:
  pull_request:
    branches: [main]
permissions: {contents: read}
jobs:
  reality-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.event.pull_request.head.sha }}", fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: REALITY model
        continue-on-error: true
        run: node v3/reality-0-check.mjs v3/reality-0-model.json .
      - name: REALITY saturation
        continue-on-error: true
        run: node v3/reality-0-saturation.mjs v3/reality-0-model.json .
      - name: SCOPE model
        continue-on-error: true
        run: node v3/scope-0-check.mjs v3/scope-0-model.json .
      - name: SCOPE saturation
        continue-on-error: true
        run: node v3/scope-0-saturation.mjs v3/scope-0-model.json .
      - name: UIUX model
        continue-on-error: true
        run: node v3/uiux-scope-check.mjs v3/uiux-scope-model.json
      - name: UIUX saturation
        continue-on-error: true
        run: node v3/uiux-scope-saturation.mjs v3/uiux-scope-model.json
      - name: Convergence full
        continue-on-error: true
        run: node v3/convergence-authority-check.mjs .
