name: ictc-ci-truth
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-ci-truth-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ICTC_CI_TRUTH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22'}
      - name: Enforce AI output schemas
        run: node v3/ai-output-schema-check.mjs
      - name: Produce enterprise assurance evidence
        run: node v3/enterprise-t-saturation.mjs && node v3/enterprise-invariant-convergence.mjs && node v3/enterprise-t-audit.mjs && node v3/enterprise-t-runtime-stress.mjs
      - name: Enforce non-expanding critical/high debt
        run: node v3/ci-truth-check.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: ictc-ci-truth
          path: |
            artifacts/enterprise-t-*.json
            artifacts/enterprise-invariant-convergence.json
            artifacts/ci-truth.json
          if-no-files-found: error
          retention-days: 30
