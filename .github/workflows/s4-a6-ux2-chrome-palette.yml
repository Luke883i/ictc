name: s4-a6-ux2-chrome-palette
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s4-a6-ux2-chrome-palette-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chrome-palette:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - name: A6-UX2 syntax
        run: |
          node --check v3/s4-a6-ux2-chrome-palette-model.mjs
          node --check v3/s4-a6-ux2-chrome-palette-check.mjs
          node --check v3/s4-a6-ux2-chrome-palette-saturation.mjs
          python -m py_compile v3/browser-s4-a6-ux2-chrome-palette.py
      - name: A6-UX2 source contract
        run: node v3/s4-a6-ux2-chrome-palette-check.mjs
      - name: A6-UX2 100k real source antagonists
        run: node v3/s4-a6-ux2-chrome-palette-saturation.mjs
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          if [[ -z "$browser" || ! -x "$browser" ]]; then echo 'No supported system Chromium browser found on the runner' >&2; exit 1; fi
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Start canonical current runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4866 PORT=4866
          export ICTC_BASE_URL="http://127.0.0.1:4866"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-a6-ux2-state"
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-a6-ux2-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          ./ictc.sh status --profile current
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
          echo "ICTC_STATE_DIR=$ICTC_STATE_DIR" >> "$GITHUB_ENV"
          echo "ICTC_RUNTIME_DIR=$ICTC_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: A6-UX2 exact-head Chromium palette and UX1 geometry
        run: python -u v3/browser-s4-a6-ux2-chrome-palette.py
      - name: Stop current runtime
        if: always()
        run: ./ictc.sh stop --profile current || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: s4-a6-ux2-chrome-palette-evidence
          path: |
            artifacts/browser-s4-a6-ux2-chrome-palette*.json
            artifacts/browser-s4-a6-ux2-chrome-palette*.png
          if-no-files-found: warn
          retention-days: 30
