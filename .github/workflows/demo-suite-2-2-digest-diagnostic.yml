name: demo-suite-2-2-digest-diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    outputs:
      state_digest: ${{ steps.digest.outputs.state_digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - id: digest
        shell: bash
        run: |
          DIGEST="$(node --input-type=module -e "import {buildDemoSuite22State} from './v3/runtime/demo-suite-2-2.mjs'; try { const built=await buildDemoSuite22State(); process.stdout.write(built.stateDigest); } catch (error) { if (error?.code==='demo-suite-2-2-state-digest-mismatch' && error?.details?.actual) process.stdout.write(error.details.actual); else throw error; }")"
          test -n "$DIGEST"
          echo "state_digest=$DIGEST" >> "$GITHUB_OUTPUT"
  reveal:
    needs: probe
    name: state-digest / ${{ needs.probe.outputs.state_digest }}
    runs-on: ubuntu-24.04
    steps:
      - run: test -n "${{ needs.probe.outputs.state_digest }}"
