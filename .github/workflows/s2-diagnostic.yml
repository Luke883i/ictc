name: s2-diagnostic
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolate:
    name: s2 isolate / ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: syntax, cmd: "node scripts/syntax-check.mjs" }
          - { id: s2-check, cmd: "node v3/s2-temporal-epistemic-check.mjs" }
          - { id: s2-saturation, cmd: "node v3/s2-temporal-epistemic-saturation.mjs" }
          - { id: gate-registry, cmd: "node v3/current-gate-registry-check.mjs" }
          - { id: grc-assurance, cmd: "node v3/grc-assurance-check.mjs" }
          - { id: dependency-review, cmd: "node v3/dependency-review-check.mjs" }
          - { id: worklist-s1, cmd: "node v3/procedure-worklist-s1-check.mjs" }
          - { id: semantic-2-8-causality, cmd: "node v3/semantic-closure-2-8-causality-check.mjs" }
          - { id: epistemic-inference, cmd: "node v3/epistemic-inference-check.mjs" }
          - { id: ui-epistemic-convergence, cmd: "node v3/ui-epistemic-convergence-check.mjs" }
          - { id: procedure-journey-2-1, cmd: "node v3/procedure-journey-2-1-check.mjs" }
          - { id: procedure-policy, cmd: "node v3/procedure-policy-check.mjs" }
          - { id: standard-library, cmd: "node v3/standard-library-check.mjs" }
          - { id: monitoring-access, cmd: "node v3/monitoring-access-check.mjs" }
          - { id: incident-contract, cmd: "node v3/incident-contract-check.mjs" }
          - { id: object-identity, cmd: "node v3/object-identity-check.mjs" }
          - { id: procedure-summary, cmd: "node v3/procedure-summary-check.mjs" }
          - { id: demo-seed-runtime, cmd: "node v3/demo-seed-runtime-check.mjs" }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: '22', cache: npm }
      - run: npm ci --ignore-scripts
      - run: ${{ matrix.cmd }}
