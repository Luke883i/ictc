name: ictc-core-ui
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-core-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime-and-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Core UI contracts, copy, accessibility and saturation
        run: npm run audit:ux:core
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Full release compatibility
        run: npm run release:check
      - name: Live monitoring, storage, incident lifecycle and browser
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1
          export ICTC_PORT=4807
          export PORT=4807
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-core-ui-state"
          export ICTC_MONITORING_REMOTE=1
          export ICTC_ALLOW_PRIVATE_MONITORING=1
          export ICTC_AI_ENDPOINT="http://127.0.0.1:4899/v1/chat/completions"
          export ICTC_AI_MODEL="mock-study"
          export ICTC_SCHEDULER_TICK_MS=100000
          node v3/mock-monitoring-provider.mjs >"$RUNNER_TEMP/ictc-mock-provider.log" 2>&1 &
          MOCK_PID=$!
          cleanup() {
            ./ictc.sh stop --profile current || true
            kill "$MOCK_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-core-runtime-check"
          ./ictc.sh start --profile current --no-open
          curl -fsS "http://127.0.0.1:4807/api/health"
          ICTC_BASE_URL="http://127.0.0.1:4807" ICTC_MOCK_URL="http://127.0.0.1:4899" node v3/journey-runtime-check.mjs
          ./ictc.sh stop --profile current
          rm -rf "$ICTC_STATE_DIR"
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-core-browser-check"
          ./ictc.sh start --profile current --no-open
          curl -fsS "http://127.0.0.1:4807/api/health"
          ICTC_BASE_URL="http://127.0.0.1:4807" python v3/journey-browser-check.py
          ./ictc.sh stop --profile current
          trap - EXIT
          kill "$MOCK_PID" 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ictc-core-ui
          path: |
            artifacts/runtime-kernel-check.json
            artifacts/journey-shell-audit.json
            artifacts/journey-accessibility-audit.json
            artifacts/core-copy-audit.json
            artifacts/journey-saturation.json
            artifacts/journey-runtime-check.json
            artifacts/journey-browser-check.json
            artifacts/v3-ux-audit.json
            artifacts/screenshots/core-monitoring-runtime.png
            artifacts/screenshots/core-incidents-runtime.png
          if-no-files-found: warn
          retention-days: 30
