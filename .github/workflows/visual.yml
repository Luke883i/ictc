name: ictc-visual
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Install pinned browser audit tool
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: npm run visual
      - run: npm run audit:a11y
      - run: npm run schema:check
      - uses: actions/upload-artifact@v6
        with:
          name: ictc-v2-visual-attestation
          path: |
            artifacts/screenshots/dashboard-v2.png
            artifacts/screenshots/trace-v2.png
            artifacts/visual-attestation.json
            artifacts/accessibility-audit.json
            artifacts/visual.log
          retention-days: 14
