name: uiux-enduser-p2-runtime
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uiux-enduser-p2-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live-dom-mutation-1m:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: P2 contract and source saturation
        run: |
          node v3/uiux-enduser-composition-p2-check.mjs
          node v3/uiux-enduser-composition-p2-saturation.mjs
      - name: Browser rail syntax
        run: python -m py_compile v3/browser-uiux-enduser-p2-runtime-1m.py
      - name: Resolve system Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          if [[ -z "$browser" || ! -x "$browser" ]]; then echo 'No supported system Chromium browser found on the runner' >&2; exit 1; fi
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Run isolated live DOM mutation rail
        id: runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONUNBUFFERED=1 ICTC_NO_OPEN=1 ICTC_PORT=4827 PORT=4827
          export ICTC_BASE_URL="http://127.0.0.1:4827"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-p2-state"
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-p2-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          trap './ictc.sh stop --profile current || true' EXIT
          status=0
          python -u v3/browser-uiux-enduser-p2-runtime-1m.py || status=$?
          detail=complete
          if [[ -f artifacts/browser-uiux-enduser-p2-runtime-1m-error.json ]]; then
            detail="$(python -c "import json,re; p=json.load(open('artifacts/browser-uiux-enduser-p2-runtime-1m-error.json',encoding='utf8')); phase=str(p.get('phase','unknown')); m=str(p.get('message','')); m=(m if len(m)<=260 else m[:130]+'-'+m[-130:]); v=re.sub(r'[^A-Za-z0-9._-]+','-',phase+'-'+m).strip('-'); print(v[:220] or 'unknown')")"
          fi
          echo "phase=$detail" >> "$GITHUB_OUTPUT"
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: uiux-enduser-p2-runtime-evidence-${{ steps.runtime.outputs.phase }}
          path: |
            artifacts/browser-uiux-enduser-p2-runtime-1m*.json
          if-no-files-found: warn
          retention-days: 30
