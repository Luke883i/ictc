name: runtime-portability-diagnostic
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
  statuses: write
concurrency:
  group: runtime-portability-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnose:
    name: runtime-portability-diagnostic-${{ matrix.repeat }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - id: runtime
        continue-on-error: true
        run: npm run test:current:runtime
      - name: Publish diagnostic
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OUTCOME: ${{ steps.runtime.outcome }}
          FAILED_CHECK: ${{ steps.runtime.outputs.failed_check }}
          REPEAT: ${{ matrix.repeat }}
        run: |
          set -Eeuo pipefail
          state=success
          [[ "$OUTCOME" == success ]] || state=failure
          failed="${FAILED_CHECK:-none}"
          slug=$(printf '%s' "$failed" | tr -cs 'A-Za-z0-9._-' '-' | cut -c1-55)
          payload=$(printf '{"state":"%s","context":"ictc/runtime-portability-diag/%s-%s","description":"repeat %s outcome=%s failed=%s"}' "$state" "$REPEAT" "$slug" "$REPEAT" "$OUTCOME" "$failed")
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -d "$payload" >/dev/null
