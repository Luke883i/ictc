name: demo-evidence-lattice-3-0
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo-evidence-lattice-3-0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semantic-lattice:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Bootstrap demo resolves to Suite 3.0
        run: node v3/bootstrap-demo-3-0-cutover-check.mjs
      - name: DEMO Suite 3.0 canonical cutover contract
        run: node v3/demo-suite-3-0-cutover-check.mjs
      - name: DEMO Suite 3.0 UI disclosure authority
        run: node v3/demo-suite-3-0-ui-check.mjs
      - name: DEMO Suite 3.0 lattice authority
        run: node v3/demo-suite-3-0-lattice-check.mjs
      - name: DEMO init Store
        env: {ICTC_DEMO_INIT_PHASE: store}
        run: node v3/demo-suite-3-0-server-init-check.mjs
      - name: DEMO init Enterprise
        env: {ICTC_DEMO_INIT_PHASE: enterprise}
        run: node v3/demo-suite-3-0-server-init-check.mjs
      - name: DEMO init Privacy
        env: {ICTC_DEMO_INIT_PHASE: privacy}
        run: node v3/demo-suite-3-0-server-init-check.mjs
      - name: DEMO Suite 3.0 build corpus
        env: {ICTC_DEMO_INIT_PHASE: build}
        run: node v3/demo-suite-3-0-server-init-check.mjs
      - name: DEMO Suite 3.0 seed call
        env: {ICTC_DEMO_INIT_PHASE: seed-call}
        run: node v3/demo-suite-3-0-server-init-check.mjs
      - name: DEMO Suite 3.0 seed receipt
        env: {ICTC_DEMO_INIT_PHASE: seed-receipt}
        run: node v3/demo-suite-3-0-server-init-check.mjs
      - name: DEMO Suite 3.0 seed projection
        env: {ICTC_DEMO_INIT_PHASE: seed-projection}
        run: node v3/demo-suite-3-0-server-init-check.mjs
      - name: DEMO Suite 3.0 after Enterprise defaults
        env: {ICTC_DEMO_INIT_PHASE: demo-after-enterprise}
        run: node v3/demo-suite-3-0-server-init-check.mjs
      - name: DEMO Suite 3.0 after Privacy defaults
        env: {ICTC_DEMO_INIT_PHASE: demo-after-privacy}
        run: node v3/demo-suite-3-0-server-init-check.mjs
      - name: DEMO Suite 3.0 after Enterprise and Privacy defaults
        env: {ICTC_DEMO_INIT_PHASE: demo-after-enterprise-privacy}
        run: node v3/demo-suite-3-0-server-init-check.mjs
      - name: DEMO init Tenant authority
        env: {ICTC_DEMO_INIT_PHASE: tenant}
        run: node v3/demo-suite-3-0-server-init-check.mjs
      - name: DEMO Suite 3.0 server starts
        env: {ICTC_DEMO_E2E_PHASE: start}
        run: node v3/demo-suite-3-0-runtime-e2e-check.mjs
      - name: DEMO Suite 3.0 health enabled
        env: {ICTC_DEMO_E2E_PHASE: health-enabled}
        run: node v3/demo-suite-3-0-runtime-e2e-check.mjs
      - name: DEMO Suite 3.0 health version
        env: {ICTC_DEMO_E2E_PHASE: health-version}
        run: node v3/demo-suite-3-0-runtime-e2e-check.mjs
      - name: DEMO Suite 3.0 health authority
        env: {ICTC_DEMO_E2E_PHASE: health-authority}
        run: node v3/demo-suite-3-0-runtime-e2e-check.mjs
      - name: DEMO Suite 3.0 runtime bootstrap truth
        env: {ICTC_DEMO_E2E_PHASE: bootstrap}
        run: node v3/demo-suite-3-0-runtime-e2e-check.mjs
      - name: DEMO Suite 3.0 native procedure projections
        env: {ICTC_DEMO_E2E_PHASE: procedures}
        run: node v3/demo-suite-3-0-runtime-e2e-check.mjs
      - name: DEMO Suite 3.0 runtime lattice
        env: {ICTC_DEMO_E2E_PHASE: lattice}
        run: node v3/demo-suite-3-0-runtime-e2e-check.mjs
      - name: DEMO Suite 3.0 restart idempotence
        env: {ICTC_DEMO_E2E_PHASE: restart}
        run: node v3/demo-suite-3-0-runtime-e2e-check.mjs
      - name: One million Suite 3.0 cutover mutations
        run: node v3/demo-suite-3-0-cutover-mutation-1m.mjs
      - name: DEMO Evidence Lattice 3.0 regression contract
        run: node v3/demo-evidence-lattice-3-0-check.mjs
      - name: Closed SME ontology and epistemic completeness regression
        run: node v3/demo-evidence-lattice-3-0-completeness-check.mjs
      - name: Ten million ontology epistemic semantic regression mutations
        run: node v3/demo-evidence-lattice-3-0-mutation-10m.mjs
      - name: Preserve deprecated Suite 2.2 generator regressions
        run: |
          node v3/demo-suite-2-2-module-load-check.mjs
          node v3/demo-suite-2-2-runtime-semantic-check.mjs
          node v3/demo-suite-2-2-runtime-store-check.mjs
          node v3/demo-suite-2-2-projection-closure-check.mjs
      - name: Preserve handler and current gate authorities
        run: |
          node v3/current-gate-registry-check.mjs
          node v3/current-release-suite-check.mjs
          node v3/procedure-adapter-registry-check.mjs
