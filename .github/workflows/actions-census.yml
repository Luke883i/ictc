name: ictc-actions-census
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  statuses: write
concurrency:
  group: ictc-actions-census-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actions-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GITHUB_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ICTC_CENSUS_SELF_NAMES: actions-census
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22'}
      - name: Observe every exact-head GitHub Actions check
        run: node v3/actions-census.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: ictc-actions-census
          path: artifacts/actions-census.json
          if-no-files-found: error
          retention-days: 30
