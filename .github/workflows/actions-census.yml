name: ictc-actions-census
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  statuses: write
concurrency:
  group: ictc-actions-census-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actions-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GITHUB_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ICTC_CENSUS_SELF_NAMES: actions-census
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22'}
      - name: Observe every exact-head GitHub Actions check
        run: node v3/actions-census.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v6
        if: always()
        with:
          name: ictc-actions-census
          path: artifacts/actions-census.json
          if-no-files-found: error
          retention-days: 30
