name: ictc-uiux-p3-semantic-runtime
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ictc-uiux-p3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semantic-runtime-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      browser_phase: ${{ steps.browser_phase.outputs.phase }}
      browser_outcome: ${{ steps.browser.outcome }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - name: Syntax and semantic closure contract
        run: |
          node --check v3/public/ui/semantic-state-projection-p3.js
          node --check v3/public/ui/provider-settings-p3.js
          node --check v3/runtime/standard-public-source-pack.mjs
          node --check v3/standard-public-source-pack-check.mjs
          node --check v3/uiux-semantic-runtime-closure-p3-model.mjs
          node --check v3/uiux-semantic-runtime-closure-p3-check.mjs
          node --check v3/uiux-semantic-runtime-closure-p3-saturation.mjs
          python -m py_compile v3/browser-uiux-semantic-runtime-closure-p3.py
          node v3/standard-public-source-pack-check.mjs
          node v3/uiux-semantic-runtime-closure-p3-check.mjs
      - name: 100,000,000 semantic mutations
        run: node v3/uiux-semantic-runtime-closure-p3-saturation.mjs
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Resolve system browser
        shell: bash
        run: |
          set -Eeuo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          test -n "$browser" && test -x "$browser"
          echo "ICTC_CHROMIUM=$browser" >> "$GITHUB_ENV"
      - name: Start canonical runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export ICTC_NO_OPEN=1 ICTC_PORT=4868 PORT=4868
          export ICTC_BASE_URL="http://127.0.0.1:4868"
          export ICTC_STATE_DIR="$RUNNER_TEMP/ictc-uiux-p3-state"
          export ICTC_RUNTIME_DIR="$RUNNER_TEMP/ictc-uiux-p3-runtime"
          export ICTC_SCHEDULER_TICK_MS=100000
          ./ictc.sh start --profile current --no-open
          ./ictc.sh status --profile current
          echo "ICTC_BASE_URL=$ICTC_BASE_URL" >> "$GITHUB_ENV"
          echo "ICTC_STATE_DIR=$ICTC_STATE_DIR" >> "$GITHUB_ENV"
          echo "ICTC_RUNTIME_DIR=$ICTC_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Exact-head final DOM screenshot-findings oracle
        id: browser
        continue-on-error: true
        run: python -u v3/browser-uiux-semantic-runtime-closure-p3.py
      - name: Capture P3 browser phase
        id: browser_phase
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          path=pathlib.Path('artifacts/browser-uiux-semantic-runtime-closure-p3-error.json')
          phase='green'
          if path.exists():
              phase=str(json.loads(path.read_text(encoding='utf8')).get('phase') or 'unknown')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as out: out.write(f'phase={phase}\n')
          print('P3 browser phase:',phase)
          PY
      - name: Stop runtime
        if: always()
        run: ./ictc.sh stop --profile current || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v6
        if: always()
        with:
          name: uiux-p3-semantic-runtime-evidence
          path: artifacts/browser-uiux-semantic-runtime-closure-p3*.json
          if-no-files-found: warn
          retention-days: 30
  browser-verdict:
    name: P3 final-DOM verdict [${{ needs.semantic-runtime-closure.outputs.browser_phase }}]
    needs: semantic-runtime-closure
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Preserve final-DOM acceptance
        shell: bash
        run: |
          phase='${{ needs.semantic-runtime-closure.outputs.browser_phase }}'
          outcome='${{ needs.semantic-runtime-closure.outputs.browser_outcome }}'
          echo "phase=$phase outcome=$outcome"
          test "$phase" = green
          test "$outcome" = success
