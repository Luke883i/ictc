name: TRAMA causal qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-10-campaigns:
    name: causal-10-campaigns
    env:
      ICTC_TRAMA_EXACT_HEAD: '1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'
      - name: Contract check
        run: node tests/verification/trama-causal-qualification-check.mjs
      # The K1/K2 verifier asserts the pre-cutover v3 tree. Keep the original
      # source oracle, but exercise it on its immutable historical preimage.
      # On the current HEAD, the post-cutover inventory enforces v3/ = 0.
      - name: K1/K2 historical Git preimage and positive controls
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/ictc-k12-precutover" e641526114a508e24f86e8554c027d8cd6bbe715
          (cd "$RUNNER_TEMP/ictc-k12-precutover" && node scripts/test-boundary-migration-check.mjs)
          mkdir -p artifacts
          cp "$RUNNER_TEMP/ictc-k12-precutover/artifacts/c1-3d-test-boundary.json" artifacts/c1-3d-test-boundary.json
      - name: K1/K2 historical physical counterexamples and current inventory
        shell: bash
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/ictc-k12-precutover" && node scripts/test-boundary-migration-check.mjs --falsify)
          node scripts/repository-inventory-falsification.mjs
          test "$(git ls-files 'v3/**' | wc -l)" -eq 0
      - name: Campaign 01 · 100k + 10k no-novelty
        run: node tests/verification/trama-causal-qualification-saturation-1m.mjs --trials 100000 --tail 10000 --seed 7000000000000104730
      - name: Campaign 02 · 100k + 10k no-novelty
        run: node tests/verification/trama-causal-qualification-saturation-1m.mjs --trials 100000 --tail 10000 --seed 7000000000000209459
      - name: Campaign 03 · 100k + 10k no-novelty
        run: node tests/verification/trama-causal-qualification-saturation-1m.mjs --trials 100000 --tail 10000 --seed 7000000000000314188
      - name: Campaign 04 · 100k + 10k no-novelty
        run: node tests/verification/trama-causal-qualification-saturation-1m.mjs --trials 100000 --tail 10000 --seed 7000000000000418917
      - name: Campaign 05 · 100k + 10k no-novelty
        run: node tests/verification/trama-causal-qualification-saturation-1m.mjs --trials 100000 --tail 10000 --seed 7000000000000523646
      - name: Campaign 06 · 100k + 10k no-novelty
        run: node tests/verification/trama-causal-qualification-saturation-1m.mjs --trials 100000 --tail 10000 --seed 7000000000000628375
      - name: Campaign 07 · 100k + 10k no-novelty
        run: node tests/verification/trama-causal-qualification-saturation-1m.mjs --trials 100000 --tail 10000 --seed 7000000000000733104
      - name: Campaign 08 · 100k + 10k no-novelty
        run: node tests/verification/trama-causal-qualification-saturation-1m.mjs --trials 100000 --tail 10000 --seed 7000000000000837833
      - name: Campaign 09 · 100k + 10k no-novelty
        run: node tests/verification/trama-causal-qualification-saturation-1m.mjs --trials 100000 --tail 10000 --seed 7000000000000942562
      - name: Campaign 10 · 100k + 10k no-novelty
        run: node tests/verification/trama-causal-qualification-saturation-1m.mjs --trials 100000 --tail 10000 --seed 7000000000001047291
      - name: TRAMA parent regression
        run: node tests/verification/trama-engineering-check.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        if: always()
        with:
          name: ictc-c1-3d-test-boundary
          path: artifacts/c1-3d-test-boundary.json
          if-no-files-found: error
          retention-days: 30
