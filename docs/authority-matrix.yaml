version: 4
surfaces:
  product_intent:
    authority: docs/00_PROMPT_CLARIFICATION.md
  epistemic_contract:
    authority: docs/02_EPISTEMIC_CONTRACT.md
  user_journeys:
    authority: docs/04_USER_JOURNEYS.md
  architecture:
    authority: docs/11_ARCHITECTURE.md
  enduser_language:
    authority: docs/03_ENDUSER_LANGUAGE.md
  ui_wiring:
    authority: docs/ui-wiring-manifest.json
  api:
    authority: docs/openapi.yaml
  schemas:
    authority: schemas/
  runtime_entrypoint:
    authority: v3/server.mjs
  runtime_domain:
    authority: v3/domain.mjs
  runtime_state:
    authority: v3/store.mjs
  runtime_store_adapter:
    authority: v3/runtime-store.mjs
  runtime_persistence:
    authority: v3/sqlite-state-persistence.mjs
  runtime_handlers:
    authority: v3/runtime/
  runtime_enterprise:
    authority: v3/enterprise.mjs
  runtime_ai:
    authority: v3/ai.mjs
  public_ui:
    authority: v3/public/
  ui_composition_root:
    authority: v3/public/ui/active-experience.js
    classification: exclusive
  ui_lifecycle_contract:
    authority: v3/public/ui/experience-constitution.js
  ui_lifecycle_runtime:
    authority: v3/public/ui/experience-lifecycle.js
  ui_decision_presentation:
    authority: v3/public/ui/procedure-ui-ux-1-6.js
    phase: presentation
    classification: exclusive-presentation-owner
  ui_integrity_observer:
    authority: v3/public/ui/procedure-ui-ux-integrity-1-6.js
    phase: integrity
    classification: non-business-authority
  ui_journey_overlay:
    authority: v3/public/ui/procedure-sequential-ux-2-2.js
    phase: journey
    classification: non-competing-overlay
  launcher:
    authority: ictc.sh
  package_contract:
    authority: package.json
  generated_artifacts:
    authority: scripts/
    classification: derived
rules:
  - generated artifacts are never hand-edited
  - UI labels cannot redefine epistemic status
  - AI output cannot create human-reviewed or human-owned state
  - package.json scripts.start and ictc.sh must resolve to runtime_entrypoint
  - runtime_store_adapter may add runtime-only persistence/storage hardening but must extend runtime_state and may not become a second business write authority
  - mutable canonical state and append-only audit ledger are separate authorities
  - runtime documentation must not claim append-only canonical state or historical reconstructibility unless executable proof establishes it
  - a change to a declared runtime authority requires authority-contract evidence on the same commit
  - app.js may install exactly one UI composition root
  - current procedure presentation, integrity and journey participants must register through ui_lifecycle_runtime
  - participant precedence is defined by the explicit phase order presentation -> integrity -> journey, never by timer, timeout or microtask depth
  - decision-presentation is exclusive; integrity observers and journey overlays may not become competing decision-presentation owners
  - current runtime UI contracts must be reachable through the canonical npm test gate; dedicated workflows may be diagnostic but not parallel PR authorities
