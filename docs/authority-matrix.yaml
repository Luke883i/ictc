rules:
  - generated artifacts are never hand-edited
  - documentation lifecycle and authority topics are registered in docs/documentation-manifest.json; the registry may not replace substantive product, architecture, epistemic, UI or runtime owners
  - source-input, roadmap, lineage and generated documents may not become current authority by filename recency, PR recency or implicit reference
  - docs/PRODUCT.md is the only current product-intent authority; prompts and TO-BE documents are inputs or roadmap
  - target_operating_model owns only the bounded target envelope; it may not redefine product identity, claim boundaries, or AS-IS runtime/architecture facts, and structural changes require REALITY-0 evidence plus DECIDE-0 authority
  - convergence_authority owns development sequencing and reconciliation only; it cannot redefine product, runtime, legal/compliance or Git merge facts
  - workbook projection is derived from convergence_authority and may not become a second product/runtime authority
  - every pull request to main declares Trajectory impact and Convergence slice; planned, intentional-deviation and reconciliation changes to trajectory-sensitive surfaces update convergence_authority and its workbook projection together while neutral NO_DELTA does neither
  - a user-directed out-of-plan change is represented as intentional-deviation, preserves prior trajectory history and replans forward rather than being rejected merely because it was absent from the previous workbook
  - post-merge convergence facts are receipts over real Git/GitHub SHAs and are not predicted or written as a self-referential future SHA inside the commit that creates them
  - CI may verify convergence and emit untracked receipts but may not gain contents:write or auto-commit authority to main for workbook reconciliation
  - UI labels cannot redefine epistemic status
  - AI output cannot create human-reviewed or human-owned state
  - enduser_language defines the human-facing policy; semantic_foundation_vocabulary and semantic_foundation_actions implement it and may not widen legal or decision authority
  - ui_composition_root is the only bootstrap authority for active UI composition
  - local native surface owners own information hierarchy and compression for their surfaces; the global semantic annotation runtime may classify metadata but may not rewrite business copy, reorder local DOM, or bootstrap local owners
  - ui_workspace_chrome is presentation-only and may style stable header/footer through shared tokens; it may not own business copy, local surface hierarchy, navigation semantics, runtime state or C0.1 participation
  - current presentation is distributed across declared canonical owners; there is no global final cascade resolver
  - enterprise-workspace-3-2.css may own Home and bounded native workspace visuals but may not retain historical stable-chrome or process-catalogue causes
  - semantic-workspace-closure-3-2-1.css owns Processi catalogue/landing and Evidence presentation in addition to its copy/layout closure
  - workspace-finetuning-3-4.css is retired lineage and may not be loaded, marked current, or reintroduced as a final resolver
  - tests for the retired 3.4 closure protect relocated observable invariants at their current owners and must fail if the retired resolver returns
  - deleting a superseded presentation cause together with its compensating override is preferred when observable behavior and accessibility invariants remain equivalent
  - the native workspace bootstrap may aggregate installer calls and bounded stylesheets but may not become a business write authority or a C0.1 participant
  - shared UI primitives are structural and accessibility helpers; they may not inject manifesto, purpose, why, evidence or boundary narratives into every surface
  - each landing exposes at most one primary purpose sentence before operational work; technical and methodological context is progressive by default
  - comparable repeated business records use row/list grammar before card-wall grammar; heterogeneous business capabilities may use the 3 -> 2 -> 1 capability matrix
  - work scope, legal applicability, mapping, control effectiveness and conformity are distinct axes and may not be collapsed by presentation or annotation
  - semantic human-action metadata is applied through ui_control_annotation after decision presentation and may not mutate business state or rewrite the exclusive presentation authority
  - package.json scripts.start and ictc.sh must resolve to runtime_entrypoint
  - runtime_store_adapter may add runtime-only persistence/storage hardening but must extend runtime_state and may not become a second business write authority
  - mutable canonical state and append-only audit ledger are separate authorities
  - runtime documentation must not claim append-only canonical state or historical reconstructibility unless executable proof establishes it
  - a change to a declared runtime authority requires authority-contract evidence on the same commit
  - app.js may install exactly one UI composition root
  - current final procedure harmonization, presentation, integrity, journey and annotation responsibilities must converge through ui_lifecycle_runtime
  - participant precedence is defined by the explicit phase order harmonization -> presentation -> integrity -> journey -> annotation, never by timer, timeout, side-channel event or microtask depth
  - decision-presentation is exclusive; harmonization, integrity, journey and annotation may not become competing decision-presentation owners
  - annotation may classify controls, human-action semantics and evidence effects but may not create business decisions or runtime write authority
  - reentrant lifecycle requests must replay inside the current flush and the lifecycle must fail closed on non-convergence
  - current runtime UI contracts must be reachable through the canonical npm test gate; dedicated workflows may be diagnostic but not parallel PR authorities
  - documentation_runtime must be reachable through the canonical semantic current npm test gate
  - browser test processes are observational and do not hold commit-status write authority; aggregate CI/census publishers own exact-head status verdicts
  - release_identity distinguishes current contracts and maturity from informational lineage; lineage must not be promoted to current identity by concatenation
  - model-vocabulary and source-string mutation trial counts must not be represented as browser sessions, contributor studies, independent assurance, or code mutants unless those code mutants were actually compiled/executed
