openapi: 3.1.1
info:
  title: ICTC v2 Local API
  version: 2.0.0-beta.3
  description: Local proof-oriented API. AI responses and source metadata are proposals, not legal conclusions.
servers:
  - url: http://127.0.0.1:4173
paths:
  /api/bootstrap:
    get:
      summary: Rebuild domain state and typed outcome views from seed and append-only events
      responses:
        '200': {description: Current local projection}
  /api/sources:
    post:
      summary: Persist a manually proposed source and an AI metadata proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: {type: string}
                url: {type: string, format: uri}
                notes: {type: string}
                contentBase64: {type: string}
      responses:
        '201': {description: Candidate source persisted and read back}
  /api/sources/{sourceId}/review:
    post:
      summary: Record a human acceptance or rejection
      parameters:
        - in: path
          name: sourceId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: {enum: [accepted, rejected]}
                note: {type: string}
      responses:
        '201': {description: Human review receipt}
  /api/scout-jobs/{jobId}/run:
    post:
      summary: Execute a controlled local scouting simulation
      parameters:
        - in: path
          name: jobId
          required: true
          schema: {type: string}
      responses:
        '201': {description: Deterministic observation and optional AI proposal persisted}
  /api/matters:
    post:
      summary: Persist an original narrative and create a proposed workflow projection
      responses:
        '201': {description: Matter persisted and read back}
  /api/matters/{matterId}/confirm-owner:
    post:
      summary: Record the human confirmation of owner and RACI
      parameters:
        - in: path
          name: matterId
          required: true
          schema: {type: string}
      responses:
        '201': {description: Human decision receipt}
  /api/session:
    post:
      summary: Create a single-session, read-only AI context
      responses:
        '201': {description: Session created with no write authority}
  /api/assistant:
    post:
      summary: Ask a question over the deterministic capsule selected by the UI
      responses:
        '200': {description: AI proposal with cited outcome IDs and limitations}
  /api/runtime/info:
    get:
      summary: Return local runtime mode, isolation and operational limits
      responses:
        '200': {description: Runtime information without exposing filesystem paths}
  /api/runtime/integrity:
    get:
      summary: Verify the local SHA-256 append-only chain
      responses:
        '200': {description: Integrity result}
  /api/traces:
    get:
      summary: Return deterministic runtime traces rendered by the ASCII workbench
      responses:
        '200': {description: Runtime trace projections}
  /api/findings/{findingId}/review:
    post:
      summary: Record a human relevance review for a finding
      parameters:
        - in: path
          name: findingId
          required: true
          schema: {type: string}
      responses:
        '201': {description: Human review receipt}
